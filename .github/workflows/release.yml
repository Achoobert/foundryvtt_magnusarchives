name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate, package, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build and validate Foundry package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/package-release.ps1 -Tag "${{ github.ref_name }}"

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --prerelease
            gh release upload "$GITHUB_REF_NAME" .release/magnusarchives.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" .release/magnusarchives.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --prerelease \
              --verify-tag
          fi
