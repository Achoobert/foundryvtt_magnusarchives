  description: >-
    <p>You are strong, and you enjoy the power and endurance that comes with
    it.</p><p><strong>You gain the following
    characteristics:</strong></p><ul><li><p><strong>Strong:</strong> +2 to your
    Might Pool.</p></li><li><p><strong>Skill:</strong> You're trained in
    @UUID[Compendium.magnusarchives.skills.Item.4057b66c1d139a6d]{Endurance}.</p></li><li><p><strong>Breaking:</strong>
    Your tasks to smash physical objects — doors, containers, and other
    inanimate objects — are eased.</p></li><li><p><strong>Suggested Second
    Skill:</strong> Instead of an extra skill, you may take the Breaking
    characteristic.</p></li><li><p><strong>Suggested Inability:</strong> You're
    strong but not quick. You have an inability in
