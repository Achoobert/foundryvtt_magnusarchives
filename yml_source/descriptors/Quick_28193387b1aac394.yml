  description: >-
    <p>Right place, right time — or more often, out of the wrong place in time.
    Not luck: speed.</p><p><strong>You gain the following
    characteristics:</strong></p><ul><li><p><strong>Swift:</strong> Quick offers
    no initial skill, but a larger stat Pool
    bonus.</p></li><li><p><strong>Suggested Second Skill:</strong> Endurance or
    gymnastics.</p></li><li><p><strong>Suggested Inability:</strong> You're
    quick, but not quick-witted when it comes to falsehoods. You have an
    inability in
    @UUID[Compendium.magnusarchives.skills.Item.9NS4fm5VOrlzRwHv]{Deception}.</p></li></ul>
