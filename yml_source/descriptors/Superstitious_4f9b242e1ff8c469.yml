  description: >-
    <p>You see the patterns others overlook, and you are sure the deepest truths
    will come into focus.</p><p><strong>You gain the following
    characteristics:</strong></p><ul><li><p><strong>Folkwise:</strong> +2 to
    your Intellect Pool.</p></li><li><p><strong>Skill:</strong> You're trained
    in
    @UUID[Compendium.magnusarchives.skills.Item.8d7248fff87386d3]{Occultism}.</p></li><li><p><strong>Throw
    Salt:</strong> When something unquestionably supernatural affects you
    adversely, you can reroll your defense roll against it. Once per
    encounter.</p></li><li><p><strong>Suggested Second Skill:</strong> Instead
    of an extra skill, you may take the Throw Salt
    characteristic.</p></li><li><p><strong>Suggested Inability:</strong> You're
    willing to believe a lot. You have an inability in
    @UUID[Compendium.magnusarchives.skills.Item.952bfb5f1296eb5b]{Discerning
    motive}.</p></li></ul>
