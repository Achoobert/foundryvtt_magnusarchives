  slug: ''
  description: >-
    <p>Tough enough to take a lot of punishment. You feel the pain; you just
    don't let it stop you.</p><p><strong>You gain the following
    characteristics:</strong></p><ul><li><p><strong>Rugged:</strong> Sturdy
    offers no initial skill, but a larger stat Pool
    bonus.</p></li><li><p><strong>Resilient:</strong> You ignore the first 3
    points of Stress you would otherwise take in a day from physical sources,
    such as Stress from minor wounds. Once that threshold is passed you suffer
    Stress normally until after your next ten-hour recovery roll, which resets
    it.</p></li><li><p><strong>Suggested Second Skill:</strong> Instead of an
    extra skill, you may take the Resilient
    characteristic.</p></li><li><p><strong>Suggested Inability:</strong> You're
    brawny but not mentally flexible. You have an inability in
    @UUID[Compendium.magnusarchives.skills.Item.2253f39a79c36c71]{Intellect
    defense}.</p></li></ul>
