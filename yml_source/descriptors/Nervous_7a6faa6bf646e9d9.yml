  description: >-
    <p>The world is full of unsettling things and you are not imagining it. The
    unease keeps you on your toes.</p><p><strong>You gain the following
    characteristics:</strong></p><ul><li><p><strong>Jumpy:</strong> +2 to your
    Speed Pool.</p></li><li><p><strong>Skill:</strong> You're trained in
    @UUID[Compendium.magnusarchives.skills.Item.jUTYItXojqpYujYN]{Initiative}.</p></li><li><p><strong>High-Strung:</strong>
    You gain an asset to your initiative tasks if you use your first action in
    an encounter to move a short distance away from whatever threatens
    you.</p></li><li><p><strong>Suggested Second Skill:</strong> Instead of an
    extra skill, you may take the High-Strung
    characteristic.</p></li><li><p><strong>Suggested Inability:</strong> You'll
    never convincingly make ultimatums. You have an inability in
    @UUID[Compendium.magnusarchives.skills.Item.TxjNz86eOB6UwTGb]{Intimidation}.</p></li></ul>
