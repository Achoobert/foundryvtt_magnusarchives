  description: >-
    <p>You hate frills, chitchat and gossip. You prize straight talk and the
    facts.</p><p><strong>You gain the following
    characteristics:</strong></p><ul><li><p><strong>Austere:</strong> +2 to your
    Might Pool.</p></li><li><p><strong>Skill:</strong> You're trained in
    @UUID[Compendium.magnusarchives.skills.Item.1ed6a9dae4acd3cb]{Researching}.</p></li><li><p><strong>Resilient:</strong>
    You ignore the first 3 points of Stress you would otherwise take in a day
    from shock, such as Stress from experiencing something supernatural. Once
    that threshold is passed you suffer Stress normally until after your next
    ten-hour recovery roll, which resets it.</p></li><li><p><strong>Suggested
    Second Skill:</strong> Instead of an extra skill, you may take the Resilient
    characteristic.</p></li><li><p><strong>Suggested Inability:</strong> People
    react badly to your humourless ways. You have an inability in
    @UUID[Compendium.magnusarchives.skills.Item.c4b6b98d92624257]{Persuasion}.</p></li></ul>
