  description: >-
    <p>A sharp memory and a quick grasp of ideas, formal education or
    not.</p><p><strong>You gain the following
    characteristics:</strong></p><ul><li><p><strong>Brainy:</strong> Smart
    offers no initial skill, but a larger stat Pool
    bonus.</p></li><li><p><strong>Eidetic:</strong> You remember and can
    memorise things you experience directly. If a roll is needed to test your
    memory against something particularly challenging, that roll is
    eased.</p></li><li><p><strong>Suggested Second Skill:</strong> Instead of an
    extra skill, you may take the Eidetic
    characteristic.</p></li><li><p><strong>Suggested Inability:</strong> You're
    good at absorbing information, but not at hiding what you know. You have an
    inability in
    @UUID[Compendium.magnusarchives.skills.Item.9NS4fm5VOrlzRwHv]{Deception}.</p></li></ul>
