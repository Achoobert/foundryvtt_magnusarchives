  description: >-
    <p>Something in you screams to make them pay. You fold it away for your
    friends, but it is always there.</p><p><strong>You gain the following
    characteristics:</strong></p><ul><li><p><strong>Brutish:</strong> +2 to your
    Might Pool.</p></li><li><p><strong>Skill:</strong> You're trained in
    @UUID[Compendium.magnusarchives.skills.Item.SbEfC3bQGCbTDvOM]{Tracking}.</p></li><li><p><strong>Bloodthirsty:</strong>
    Once you begin fighting, you see only red. The first attack you make in any
    given combat is eased.</p></li><li><p><strong>Suggested Second
    Skill:</strong> Instead of an extra skill, you may take the Bloodthirsty
    characteristic.</p></li><li><p><strong>Suggested Inability:</strong> You're
    easily provoked. You have an inability in
    @UUID[Compendium.magnusarchives.skills.Item.2253f39a79c36c71]{Intellect
    defense}.</p></li></ul>
