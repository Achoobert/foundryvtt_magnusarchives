  description: >-
    <p>Charming and charismatic. People like you, want to help you, and want to
    be your friend.</p><p><strong>You gain the following
    characteristics:</strong></p><ul><li><p><strong>Charismatic:</strong> +2 to
    your Intellect Pool.</p></li><li><p><strong>Skill:</strong> You're trained
    in
    @UUID[Compendium.magnusarchives.skills.Item.c4b6b98d92624257]{Persuasion}.</p></li><li><p><strong>Contact:</strong>
    You have an important contact in an influential position, such as a minor
    celebrity, a police captain, or the editor of a news organisation. Work out
    the details with the GM.</p></li><li><p><strong>Suggested Second
    Skill:</strong> Instead of an extra skill, you may take the Contact
    characteristic.</p></li><li><p><strong>Suggested Inability:</strong> Your
    willpower is not one of your strong points. You have an inability in
    @UUID[Compendium.magnusarchives.skills.Item.2253f39a79c36c71]{Intellect
    defense}.</p></li></ul>
