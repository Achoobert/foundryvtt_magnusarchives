name: Death
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>One of many embodiments of Death, heralded by the cold damp smell of
    vaults and catacombs. A robe of ancient, brittle bones that something far
    older moves. Whoever beats Death at a game may find they become the next
    Death.</p>
  notes: >-
    <p>One of many embodiments of Death, heralded by the cold damp smell of
    vaults and catacombs. A robe of ancient, brittle bones that something far
    older moves. Whoever beats Death at a game may find they become the next
    Death.</p><p><strong>Level:</strong> 7 (21)</p><p><strong>Related
    Entity:</strong> The End</p><p><strong>Stress on first realizing its
    horror:</strong> 4 (usually on a failed Intellect defense
    roll)</p><p><strong>Health:</strong> 33</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Games and contests of skill as
    level 8</p><h3>Combat</h3><p>Death's touch inflicts a serious injury and
    kills a target who fails a Might defense roll.</p><p><strong>Contract With
    Death:</strong> A target may challenge Death to a game or contest before
    being taken. If Death accepts, play is resolved as a series of Intellect
    defense rolls (or by actually playing). Succeeding on three before failing
    three means the target doesn't die, but they must then succeed on a Might
    defense roll or Death's mantle passes to them when the game ends, making
    them a new undead embodiment who must bring the living to The End until
    beaten in turn. A target who wins and also succeeds on the Might defense
    roll lives on as before, for now. A Death who passes on the mantle regains
    their flesh and an undying vitality, but food sickens them, they cannot
    sleep, and they crave something they cannot name.</p><p><strong>Deathless
    Existence:</strong> Death regains 10 health each round, even at 0
    health.</p><p><strong>Deliver Death:</strong> As their move, Death can flash
    anywhere in the world a living target resides.</p><h3>Interaction</h3><p>If
    Death agrees to a game, they promise the opponent that if they win, they
    shall not die.</p><h3>Use</h3><p>An Avatar of The End whose existence should
    give PCs serious pause. They should avoid Death or find a way to fake Death
    out, because even those who win usually lose.</p><p><em>The Magnus Archives
    Roleplaying Game, p210.</em></p>
