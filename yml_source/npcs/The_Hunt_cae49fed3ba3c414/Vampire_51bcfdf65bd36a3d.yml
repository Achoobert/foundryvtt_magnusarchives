name: Vampire
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>Predators who never make a sound, instead planting their thoughts so
    smoothly that victims don't notice they have been chosen. Despite the myth,
    they can go out by day.</p>
  notes: >-
    <p>Predators who never make a sound, instead planting their thoughts so
    smoothly that victims don't notice they have been chosen. Despite the myth,
    they can go out by day.</p><p><strong>Level:</strong> 4
    (12)</p><p><strong>Related Entity:</strong> The Hunt</p><p><strong>Stress on
    first realizing its horror:</strong> 1 (usually on a failed Intellect
    defense roll)</p><p><strong>Health:</strong> 18</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Deception and persuasion as
    level 6</p><h3>Combat</h3><p>Vampires bite. They flinch from flame and take
    double damage from fire unless they have fed in the last few
    hours.</p><p><strong>Psychic Communication:</strong> They make themselves
    understood perfectly without speaking. Noticing that the communication is
    unusual and not spoken takes a difficulty 6 perception
    task.</p><p><strong>Hypnotic Gaze:</strong> A target meeting its gaze in
    short range who fails an Intellect defense roll is stunned and loses their
    next turn. For ten minutes they don't forcibly resist (beyond an Intellect
    defense roll each round to break free), and it can suggest actions,
    including letting it feed.</p><p><strong>Feed:</strong> A helpless or
    hypnotized target suffers a serious injury every minute it feeds. Its belly
    swells, and it loses its vulnerability to flame for the next few
    hours.</p><h3>Interaction</h3><p>It acts normal in order to get prey alone
    in its lair, usually an ordinary, slightly unkempt flat or
    house.</p><h3>Use</h3><p>Lethal to a lone character who doesn't know what it
    is, but a group, or one prepared hunter, can defeat
    one.</p><h3>Notes</h3><p>Sample names: Sylvia McDonald, Robert Arden,
    Elisabetta Bianchi, Randall Marsh, Juliet Schuman, Eugene Briggs, Vera
    Goodman, Philip Kain.</p><p><em>The Magnus Archives Roleplaying Game,
    p242.</em></p>
