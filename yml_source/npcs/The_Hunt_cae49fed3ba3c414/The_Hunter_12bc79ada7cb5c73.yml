name: The Hunter
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>A predator in human shape who wants prey to know they are being hunted,
    letting their fear build for hours before the chase.</p>
  notes: >-
    <p>A predator in human shape who wants prey to know they are being hunted,
    letting their fear build for hours before the
    chase.</p><p><strong>Level:</strong> 6 (18)</p><p><strong>Related
    Entity:</strong> The Hunt</p><p><strong>Stress on first realizing its
    horror:</strong> 2 (usually on a failed Intellect defense
    roll)</p><p><strong>Health:</strong> 21</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong>
    Long</p><p><strong>Modifications:</strong> Perception, tracking and stealth
    as level 7</p><h3>Combat</h3><p>The Hunter claws.</p><p><strong>Avatar
    Bane:</strong> Avatars it damages can't supernaturally heal that damage, and
    if it destroys them, they can't return to life.</p><p><strong>Terrifying
    Song:</strong> Once per day it sings "A-Hunting We Shall Go." Everyone in
    long range who hears and fails an Intellect defense roll is terrified for
    one minute, freezing or fleeing (The Hunter's choice). They may attempt an
    Intellect defense roll each round to end it; each failure (or not trying)
    costs 1 Stress.</p><p><strong>Unstoppable Hunter:</strong> It regains 2
    health each round, even at 0 health.</p><h3>Interaction</h3><p>It first
    appears as a hiker in sturdy clothes without coat or pack, asking about the
    target's plans with a smile of too many teeth. If it decides to pursue, it
    sniffs its prey, remarks that tomorrow will be a good day for a run, and
    leaves. It then stalks them for a day, laughing softly before it catches
    up.</p><h3>Use</h3><p>A physically strong group might briefly halt it, but
    fleeing the area is the PCs' best chance.</p><p><em>The Magnus Archives
    Roleplaying Game, p222.</em></p>
