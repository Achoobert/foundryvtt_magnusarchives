name: Greyling
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>Aspects of The Vast with inhumanly long grey arms and legs, usually half
    hidden in fog, that haunt high places and love to send people plunging to
    their deaths. Agents of The Vast sometimes call them.</p>
  notes: >-
    <p>Aspects of The Vast with inhumanly long grey arms and legs, usually half
    hidden in fog, that haunt high places and love to send people plunging to
    their deaths. Agents of The Vast sometimes call
    them.</p><p><strong>Level:</strong> 3 (9)</p><p><strong>Related
    Entity:</strong> The Vast</p><p><strong>Stress on first realizing its
    horror:</strong> 2 (usually on a failed Intellect defense
    roll)</p><p><strong>Health:</strong> 12</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong> Short.
    Long when flying.</p><h3>Combat</h3><p>A greyling batters with its long,
    grey, inhuman arms.</p><p><strong>Fog:</strong> Once per day it summons fog
    filling a very long area for up to ten minutes. Ranged attacks there are
    nearly impossible, melee attacks are hindered, and its stealth tasks are
    eased by three steps.</p><p><strong>Over the Edge:</strong> A target it
    damages must also succeed on a Might defense roll or be grabbed. A grabbed
    target's physical actions are hindered and they take damage each round until
    they escape with a Might roll as their action, or until the greyling uses
    its next action to force them over a nearby drop. Resisting being forced
    over requires a successful Might defense
    roll.</p><h3>Interaction</h3><p>Vicious aspects with no purpose but
    terrorizing those who fear falling.</p><h3>Use</h3><p>Not very dangerous
    alone, but in numbers, or where one shove means a deadly fall, they threaten
    even a capable team.</p><h3>Notes</h3><p>See Disciple of the Endless
    (p214).</p><p><em>The Magnus Archives Roleplaying Game, p220.</em></p>
