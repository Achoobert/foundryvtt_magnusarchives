name: Cultist, Divine Host
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>Members of the People's Church of the Divine Host, who long for an
    eternal, peaceful darkness beyond death. Outside cult business they seem
    ordinary, though many have strangely dark eyes.</p>
  notes: >-
    <p>Members of the People's Church of the Divine Host, who long for an
    eternal, peaceful darkness beyond death. Outside cult business they seem
    ordinary, though many have strangely dark
    eyes.</p><p><strong>Level:</strong> 3 (9)</p><p><strong>Related
    Entity:</strong> The Dark</p><p><strong>Health:</strong>
    12</p><p><strong>Damage Inflicted:</strong> Serious
    injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Discerning motive as level
    2</p><h3>Combat</h3><p>The cultist attacks with a knife, hammer or firearm.
    A given cultist may have one or both of these abilities.</p><p><strong>Dream
    of the Dark:</strong> Once per day the cultist meets a target's gaze. On a
    failed Intellect defense roll, the target hallucinates wandering forever
    under an empty, lightless sky and gains 1 Stress. They may attempt an
    Intellect defense roll each round to break free; otherwise they are
    effectively helpless for one minute.</p><p><strong>Empowered Eclipsing
    Touch:</strong> Within short range of a Divine Host artefact (such as the
    dark star) or an Avatar of The Dark (such as The Taker of Light), the
    cultist's weapon leaves a blot of darkness in the wound that deals 1 Stress
    each round until the target removes it with a Might-based roll as their
    action.</p><h3>Interaction</h3><p>Confident in their beliefs, they are
    vulnerable to falsehoods that fit their dogma.</p><h3>Use</h3><p>As
    dangerous as any zealot, but competent PCs can beat even a group of them
    unless cult leaders are close by.</p><h3>Notes</h3><p>Sample names: Stan
    Collins, Angela Kin, TJ Chakraborty, Shannon Dramis, Roshani Whitten,
    William Chao, Ken Carlisle, Saddie Johnson, Mary Levitt, Malcom
    Agrawal.</p><p>See Dark star (p255), The Taker of Light
    (p239).</p><p><em>The Magnus Archives Roleplaying Game, p207.</em></p>
