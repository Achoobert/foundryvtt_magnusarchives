  notes: >-
    <p>The singular progenitor of the lightless beasts, usually summoned by The
    Taker of Light.</p><p><strong>Level:</strong> 7 (21)</p><p><strong>Related
    Entity:</strong> The Dark</p><p><strong>Health:</strong>
    25</p><p><strong>Damage Inflicted:</strong> Serious
    injury</p><p><strong>Movement:</strong> Short. Immediate when phasing
    through floors, walls and the like.</p><p><strong>Modifications:</strong>
    Speed defense as level 4 (hard to see); Perception as level
    8</p><h3>Combat</h3><p>It attacks with whipping
    tendrils.</p><p><strong>Darken the Block:</strong> Once per month it can
    plunge a whole city block into darkness before coming for a
    target.</p><h3>Use</h3><p>Even a prepared group would find it almost
    impossible to face without special preparation.</p><h3>Notes</h3><p>Printed
    as a sidebar stat line in the lightless beast entry. Use the lightless
    beast's abilities as the GM sees fit.</p><p><em>The Magnus Archives
    Roleplaying Game, p224.</em></p>
