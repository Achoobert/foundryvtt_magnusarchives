name: Watcher's Husk
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>Undead librarians, once Avatars of The Eye whose mantle passed to
    another, that shuffle through dark, forgotten depositories of ancient lore,
    guarding them forever.</p>
  notes: >-
    <p>Undead librarians, once Avatars of The Eye whose mantle passed to
    another, that shuffle through dark, forgotten depositories of ancient lore,
    guarding them forever.</p><p><strong>Level:</strong> 4
    (12)</p><p><strong>Related Entity:</strong> The Eye</p><p><strong>Stress on
    first realizing its horror:</strong> 1 (usually on a failed Intellect
    defense roll)</p><p><strong>Health:</strong> 12</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Perception as level
    8</p><h3>Combat</h3><p>It batters with an undead limb, and may use these
    abilities as its action.</p><p><strong>Heavy Gaze:</strong> The target of
    its stare must succeed on an Intellect defense roll or have their physical
    actions hindered for one minute.</p><p><strong>Remember the Past:</strong>
    Its successful touch floods the target with centuries of The Eye's visions,
    dealing 3 Stress.</p><p><strong>Watchful Vitality:</strong> If defeated it
    may rise again in a few days unless its eye is removed from its
    skull.</p><h3>Interaction</h3><p>It never speaks; it guards without
    hesitation or real consciousness.</p><h3>Use</h3><p>Frightening but
    beatable. Finding one mostly shows how long the Entities have been at work.
    Husks may guard paranormal books or scrolls, perhaps a
    Leitner.</p><h3>Notes</h3><p>See The Archivist (p198), Leitners
    (p267).</p><p><em>The Magnus Archives Roleplaying Game, p245.</em></p>
