name: The Chosen of Flame
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>Tall, with long straight auburn hair and eyes like headlights. Chosen as
    a child to be the "messiah" of the Cult of the Lightless Flame, she burns
    with enough heat and rage to turn the world to desert, and her temper spares
    no one.</p>
  notes: >-
    <p>Tall, with long straight auburn hair and eyes like headlights. Chosen as
    a child to be the "messiah" of the Cult of the Lightless Flame, she burns
    with enough heat and rage to turn the world to desert, and her temper spares
    no one.</p><p><strong>Level:</strong> 8 (24)</p><p><strong>Related
    Entity:</strong> The Desolation</p><p><strong>Health:</strong>
    24</p><p><strong>Damage Inflicted:</strong> Serious
    injury</p><p><strong>Movement:</strong> Short</p><h3>Combat</h3><p>She
    attacks with a searing touch. She is immune to heat and
    flame.</p><p><strong>Nova:</strong> Once per day she flares like the sun,
    damaging every creature in short range. Targets who succeed on a Speed
    defense roll still gain 2 Stress.</p><p><strong>Regenerative Candle
    Flesh:</strong> Her waxy flesh is as hot and malleable as a burning candle.
    On any round she spends molding her wounds back into shape, she regains 10
    health.</p><p><strong>Superheat:</strong> As part of another action she
    heats an object in short range, anywhere from scalding to melting, sometimes
    without meaning to. She can also superheat a target in short range, who
    takes damage on a failed Might defense roll.</p><h3>Interaction</h3><p>She
    has little loyalty to her own cult and may ally with servants of other
    Entities to delay rival world-ending rituals, but her volatility makes any
    alliance dangerous.</p><h3>Use</h3><p>Her intensity is a shadow of her real
    power. PCs who face her head-on will probably be burned
    alive.</p><h3>Notes</h3><p>Podcast name: Agnes Montague.</p><p>See Cult of
    the Lightless Flame (p171).</p><p><em>The Magnus Archives Roleplaying Game,
    p205.</em></p>
