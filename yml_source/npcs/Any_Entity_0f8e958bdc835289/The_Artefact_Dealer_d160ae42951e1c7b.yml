name: The Artefact Dealer
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>A huge, close-cropped, appraising man of Samoan ancestry with an eye for
    paranormal objects, who fences them to wealthy clients and to agents of the
    Entities alike.</p>
  notes: >-
    <p>A huge, close-cropped, appraising man of Samoan ancestry with an eye for
    paranormal objects, who fences them to wealthy clients and to agents of the
    Entities alike.</p><p><strong>Level:</strong> 5 (15)</p><p><strong>Related
    Entity:</strong> All</p><p><strong>Health:</strong> 21</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Occultism as level
    7</p><h3>Combat</h3><p>In a pinch he attacks with a retractable baton. He
    may also have these prepared.</p><p><strong>Associates:</strong> He works
    with two or three bodyguards (level 3).</p><p><strong>Useful
    Artefact:</strong> He uses an artefact he is holding before resale: for
    example the blood money pouch to turn a group of enemies on each other, or
    the boatswain's call to summon or disperse thick
    fog.</p><h3>Interaction</h3><p>Buyers are in luck if they find him. He says
    little about past or future sales, though everything has a
    price.</p><h3>Use</h3><p>A situation involving an artefact might trace back
    to him, and later he is a good source for something specific, as long as the
    PCs don't try to rob him. He is ruthless if his business is threatened. One
    or two artefacts are usually somewhere nearby.</p><h3>Notes</h3><p>Podcast
    name: Mikaele Salesa.</p><p>See Artefacts (p248), Blood money pouch (p251),
    Boatswain's call (p252).</p><p><em>The Magnus Archives Roleplaying Game,
    p199.</em></p>
