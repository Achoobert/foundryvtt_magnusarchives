name: Deceitful Arc
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>Forking, crackling figures of strobing white light, like lightning that
    stepped down to walk. They smell of a coming storm and haunt people afraid
    of storms, reliving old trauma in their minds.</p>
  notes: >-
    <p>Forking, crackling figures of strobing white light, like lightning that
    stepped down to walk. They smell of a coming storm and haunt people afraid
    of storms, reliving old trauma in their minds.</p><p><strong>Level:</strong>
    5 (15)</p><p><strong>Related Entity:</strong> The
    Spiral</p><p><strong>Stress on first realizing its horror:</strong> 3
    (usually on a failed Intellect defense roll)</p><p><strong>Health:</strong>
    21</p><p><strong>Damage Inflicted:</strong> Serious
    injury</p><p><strong>Movement:</strong> Long</p><h3>Combat</h3><p>It rarely
    starts violence, preferring to haunt someone marked by the Entity for weeks,
    months or years.</p><p><strong>Blinding Flash:</strong> It flashes
    lightning-bright. Creatures in short range must succeed on a Might defense
    roll or be blinded for about a minute, or until they succeed on a Might
    defense roll on their turn.</p><p><strong>Dread the Storm:</strong> A target
    in short range must succeed on an Intellect defense roll or be overcome for
    one minute by a vision of endlessly branching corridors of light. They gain
    2 Stress and are effectively helpless, though a successful Intellect defense
    roll on their turn ends it early.</p><p><strong>Live Electricity:</strong>
    Anyone who touches it, or whom it rakes with lightning claws, suffers a
    serious injury and, on a failed Might defense roll, is stunned and loses
    their next turn.</p><h3>Interaction</h3><p>It doesn't speak, but when hurt
    it groans like tearing sandpaper.</p><h3>Use</h3><p>It haunts a chosen
    target over long periods without becoming physically dangerous, so a lone PC
    could survive many encounters unless someone attacks
    it.</p><h3>Notes</h3><p>Twisting Deceit is a less common name for The
    Spiral.</p><p><em>The Magnus Archives Roleplaying Game, p211.</em></p>
