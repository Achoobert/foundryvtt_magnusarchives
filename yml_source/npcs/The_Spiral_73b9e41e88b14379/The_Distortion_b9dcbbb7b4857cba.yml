name: The Distortion
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>A small yellow door that wasn't there before, its attendant, and above
    all the endless, shifting maze of corridors behind it, all slowly bending
    left. Those lured in rarely escape unless it allows it.</p>
  notes: >-
    <p>A small yellow door that wasn't there before, its attendant, and above
    all the endless, shifting maze of corridors behind it, all slowly bending
    left. Those lured in rarely escape unless it allows
    it.</p><p><strong>Level:</strong> 6 (18)</p><p><strong>Related
    Entity:</strong> The Spiral</p><p><strong>Health:</strong>
    24</p><p><strong>Damage Inflicted:</strong> Serious
    injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Persuasion and deception as
    level 8</p><h3>Combat</h3><p>It rarely attacks physically, and then only in
    human guise, with a fist like a wet leather bag of sharp
    stones.</p><p><strong>Doors:</strong> As its action it makes one of its
    doors appear at a place it knows, or where someone it seeks is. It can keep
    up to fifteen doors at once, all leading to its Spiraling
    Maze.</p><p><strong>Manifestation:</strong> As its action it manifests its
    human form from any door or branching corridor, and escapes scrutiny by
    ducking into a door or a mirror in its maze.</p><p><strong>Spiraling
    Maze:</strong> Without its help, someone trying to escape may attempt a
    difficulty 8 Intellect roll each minute. Success finds a door or a mirror to
    break; failure costs 1 Stress. A few past victims, some of them agents of
    other Entities, are also lost inside.</p><h3>Interaction</h3><p>It may offer
    or ask for help, usually to gaslight a target into doubting others, the
    world or their own mind, but mostly it just takes victims and feeds as they
    grow more lost.</p><h3>Use</h3><p>It might genuinely help PCs against
    servants of other Entities, but every interaction with it is a grave
    risk.</p><h3>Notes</h3><p>Podcast name: Helen Richardson.</p><p><em>The
    Magnus Archives Roleplaying Game, p216.</em></p>
