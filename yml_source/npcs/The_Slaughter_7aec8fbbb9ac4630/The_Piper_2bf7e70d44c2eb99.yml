name: The Piper
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>The trauma of war personified, also called "The War": many-armed and
    three-faced, playing pipes of scrimshawed bone. To some it grants a brief
    reprieve, just long enough to learn they can never escape the war.</p>
  notes: >-
    <p>The trauma of war personified, also called "The War": many-armed and
    three-faced, playing pipes of scrimshawed bone. To some it grants a brief
    reprieve, just long enough to learn they can never escape the
    war.</p><p><strong>Level:</strong> 8 (24)</p><p><strong>Related
    Entity:</strong> The Slaughter</p><p><strong>Stress on first realizing its
    horror:</strong> 2 (usually on a failed Intellect defense
    roll)</p><p><strong>Health:</strong> 27</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong>
    Short</p><h3>Combat</h3><p>The Piper usually plays its pipes, but has other
    options.</p><p><strong>Weapons:</strong> It attacks twice with a sword,
    spear or long-range gun, usually at different targets.</p><p><strong>Pay The
    Piper:</strong> Once per hour it plays for a target in very long range. On a
    failed Intellect defense roll the target seeks out the bloodiest part of the
    nearest conflict, traveling if needed and ignoring caution, for up to ten
    hours, until the fighting stops, or until they succeed on an Intellect
    defense roll on their turn.</p><p><strong>Lambs to the Slaughter:</strong>
    Once per day, as its action, it plays and every creature in long range who
    fails an Intellect defense roll grabs whatever weapon is at hand and tries
    to slaughter the enemy it names (or each other) for one minute, or until
    they succeed on an Intellect defense roll on their
    turn.</p><p><strong>Fleeting Reprieve:</strong> A target in short range
    killed by violence in the last hour, or about to be, returns to life,
    knowing they have been spared by a power beyond them and will return to the
    grave whenever it calls in the debt.</p><h3>Interaction</h3><p>Its faint,
    piping tune urges listeners toward senseless slaughter. It will bargain,
    after its own fashion (see Fleeting Reprieve).</p><h3>Use</h3><p>PCs should
    keep their dealings with it to a minimum, if any.</p><p><em>The Magnus
    Archives Roleplaying Game, p232.</em></p>
