name: Silver Worm
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>Segmented, inch-long worms with blackened heads made for burrowing into
    flesh. Easy to crush in good light; dangerous when they drop from above or
    come as a swarm, since one inside a victim eventually bursts them open into
    a new colony.</p>
  notes: >-
    <p>Segmented, inch-long worms with blackened heads made for burrowing into
    flesh. Easy to crush in good light; dangerous when they drop from above or
    come as a swarm, since one inside a victim eventually bursts them open into
    a new colony.</p><p><strong>Level:</strong> 1 (3)</p><p><strong>Related
    Entity:</strong> The Corruption</p><p><strong>Health:</strong>
    3</p><p><strong>Damage Inflicted:</strong> 1 point of
    Stress</p><p><strong>Movement:</strong>
    Immediate</p><p><strong>Modifications:</strong> Speed defense and stealth as
    level 3 (due to size)</p><h3>Combat</h3><p>Silver worms
    bite.</p><p><strong>Ambush:</strong> A worm hiding in darkness, under a
    handrail or in a cupboard attacks as a level 3 creature dealing 2 Stress,
    and its first attack is eased by two steps.</p><p><strong>Burrowing
    Worms:</strong> A target bitten by worms must succeed on a difficulty 3
    Speed-based task the next round to remove them. If they (and any helping
    ally) fail, a worm gets inside: a level 5 disease needing three successful
    Might defense rolls (one per day) to clear. Each failure moves the target
    one step down the damage track, and three failures before three successes
    turn them into a colony under The Corruption's
    control.</p><p><strong>Writhing Worms:</strong> Fifty or more worms can
    attack once as a level 4 creature, dealing 3 Stress to one target, who is
    subject to Burrowing Worms with the removal task hindered by two
    steps.</p><h3>Interaction</h3><p>Parasites that see living things only as
    sacks of flesh to corrupt.</p><h3>Use</h3><p>Easy to kill, but they come in
    huge numbers, and their real horror lies in what they
    imply.</p><h3>Notes</h3><p>Colony: level 2; releases a level 3 worm swarm
    that attacks everything in short range for one round, destroying the colony;
    targets hit are subject to Burrowing Worms.</p><p><em>The Magnus Archives
    Roleplaying Game, p237.</em></p>
