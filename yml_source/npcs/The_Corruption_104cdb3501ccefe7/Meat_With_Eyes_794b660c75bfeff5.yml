name: Meat With Eyes
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>A heap of carefully gathered, rotting meat piled in an enclosed space,
    which wakes into golem-like life, opening all its eyes, when someone
    obsessed with carrion adds their own putrid corpse to the pile.</p>
  notes: >-
    <p>A heap of carefully gathered, rotting meat piled in an enclosed space,
    which wakes into golem-like life, opening all its eyes, when someone
    obsessed with carrion adds their own putrid corpse to the
    pile.</p><p><strong>Level:</strong> 4 (12)</p><p><strong>Related
    Entity:</strong> The Corruption</p><p><strong>Stress on first realizing its
    horror:</strong> 2 (usually on a failed Intellect defense
    roll)</p><p><strong>Health:</strong> 13</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Perception as level 7; Stealth
    as level 2 (due to stench)</p><h3>Combat</h3><p>It attacks with a rotting
    touch, and has these abilities.</p><p><strong>Engulf:</strong> It heaves its
    mass over a target in immediate range who fails a Speed defense roll. The
    covered target takes damage each round and can take no other physical
    actions until they squirm free with a Might roll as their action. A target
    killed this way becomes part of it.</p><p><strong>Overpowering
    Stench:</strong> It burps a toxic plume filling an immediate area. Targets
    who fail a Might defense roll lose their next turn
    retching.</p><p><strong>Regenerate:</strong> If it has absorbed living flesh
    in the last hour, it regains 3 health each round.</p><p><strong>Rotting
    Spittle:</strong> It spits acidic pus at a target in short range, dealing
    damage on a hit; on a failed Might defense roll the target also loses their
    next turn retching.</p><h3>Interaction</h3><p>It seeks to revolt, horrify
    and finally consume whatever it meets.</p><h3>Use</h3><p>Nauseating and
    reality-shaking, but beatable with determination, unless it slips away to
    find more carrion.</p><p><em>The Magnus Archives Roleplaying Game,
    p227.</em></p>
