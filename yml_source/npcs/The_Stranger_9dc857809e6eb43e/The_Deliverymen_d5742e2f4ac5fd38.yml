name: The Deliverymen
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>Two tall, hard-faced men in a grimy white van, delivering objects their
    recipients would have lived longer, and less afraid, without. This entry
    describes each of them.</p>
  notes: >-
    <p>Two tall, hard-faced men in a grimy white van, delivering objects their
    recipients would have lived longer, and less afraid, without. This entry
    describes each of them.</p><p><strong>Level:</strong> 5
    (15)</p><p><strong>Related Entity:</strong> Many over the centuries, most
    recently The Stranger</p><p><strong>Health:</strong> 18</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Tasks involving strength as
    level 7</p><h3>Combat</h3><p>They attack with a tire iron, a fire axe, or a
    two-handed punch like a baseball bat.</p><p><strong>Feeling No
    Pain:</strong> They can't be dazed or stunned by physical attacks and are
    immune to poisons and diseases.</p><p><strong>Hard to Drop:</strong> An
    attack that would reduce either to 0 health does so only if the attack roll
    was even; otherwise they drop to 1 health instead.</p><p><strong>Working
    Together:</strong> One leads in a given encounter and the other provides
    them one asset each round, whether for intimidation, defense or distracting
    a foe.</p><h3>Interaction</h3><p>They speak English with an exaggerated
    Cockney accent, or Russian with a cartoonish rural one. They have had many
    names and jobs, and always relish the fear they
    cause.</p><h3>Use</h3><p>Terrifying but not invincible; the GM may keep them
    as a veiled, ongoing threat. Their van might hold a months-old kidnap victim
    or an artefact on its way somewhere, such as the coffin of The Buried, the
    web table, or a Leitner.</p><h3>Notes</h3><p>Podcast names: Breekon &amp;
    Hope.</p><p>See Coffin of The Buried (p254), Web table (p264), Leitners
    (p267).</p><p><em>The Magnus Archives Roleplaying Game, p212.</em></p>
