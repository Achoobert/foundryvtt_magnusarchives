name: NotThem
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>A stranger has taken the place of someone close to you, a parent, a
    cousin, a child, and only you notice. Even old photos show the impostor.</p>
  notes: >-
    <p>A stranger has taken the place of someone close to you, a parent, a
    cousin, a child, and only you notice. Even old photos show the
    impostor.</p><p><strong>Level:</strong> 6 (18)</p><p><strong>Related
    Entity:</strong> The Stranger</p><p><strong>Stress on first realizing its
    horror:</strong> 2 (usually on a failed Intellect defense
    roll)</p><p><strong>Health:</strong> 21</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong> Short.
    Short when climbing.</p><p><strong>Modifications:</strong> Disguise as level
    8</p><h3>Combat</h3><p>In monstrous form, NotThem squeezes a foe in
    immediate range with long, spindly limbs.</p><p><strong>Monstrous
    Shape:</strong> To make a squeeze attack it stretches into a long, thin
    monster with too-many-jointed stick limbs. It may "wear" a target it kills,
    using that guise for its next victim.</p><p><strong>Stranger in Our
    Midst:</strong> Each time a target faces evidence that a stranger has
    replaced someone in their life, and that only they see it, they must succeed
    on an Intellect defense roll or gain 2 Stress. After gaining Stress this way
    they are immune for the next few days.</p><h3>Interaction</h3><p>It acts
    like the person it replaced until the target notices, then plays up the
    wrongness, subtly and then openly, over weeks or months until the target's
    fear peaks; then it moves on or kills them.</p><h3>Use</h3><p>Others rarely
    see the truth. PCs who do should flee unless they have a real
    plan.</p><p><em>The Magnus Archives Roleplaying Game, p230.</em></p>
