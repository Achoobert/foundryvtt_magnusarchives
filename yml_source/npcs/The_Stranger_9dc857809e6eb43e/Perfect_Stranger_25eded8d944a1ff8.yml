name: Perfect Stranger
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>Unremarkable people in jeans and white shirts who are hard to recall once
    you look away, apart from their unblinking stare and their silence, as if
    they forgot to breathe.</p>
  notes: >-
    <p>Unremarkable people in jeans and white shirts who are hard to recall once
    you look away, apart from their unblinking stare and their silence, as if
    they forgot to breathe.</p><p><strong>Level:</strong> 3
    (9)</p><p><strong>Related Entity:</strong> The Stranger</p><p><strong>Stress
    on first realizing its horror:</strong> 1 (usually on a failed Intellect
    defense roll)</p><p><strong>Health:</strong> 12</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Intellect defense as level
    7</p><h3>Combat</h3><p>It batters with its fists, careless of harm to
    itself.</p><p><strong>Disquieting Presence:</strong> After a couple of
    rounds of interaction, characters must succeed on an Intellect defense roll
    or take 1 Stress. Each further minute or new interaction requires another
    roll.</p><p><strong>Pliant Flesh:</strong> It regains 4 health if it spends
    its action concentrating.</p><p><strong>Shape Flesh:</strong> Concentrating
    for several hours, it grows new organs or tissue inside itself, where
    expected or where they shouldn't be. It can do the same to plants, such as
    teeth inside an apple.</p><h3>Interaction</h3><p>They exist mainly to
    unsettle and alienate ordinary people, but also help other servants of The
    Stranger, for instance in preparing the Unknowing.</p><h3>Use</h3><p>Ideal
    atmospheric encounters whose wrongness grows over several meetings. Tough,
    but beatable one on one.</p><h3>Notes</h3><p>Sample names: placeholder names
    such as Mario Rossi, Erika Mustermann, Jan Novak, Piotr Petrov, Pavel
    Petrov, Jane Citizen, Fulan al-Fulani, Juan Pérez, Monsieur Dupont, Hanako
    Yamada, Ram Sharma.</p><p>See The Unknowing (p175).</p><p><em>The Magnus
    Archives Roleplaying Game, p231.</em></p>
