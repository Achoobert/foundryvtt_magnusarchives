system:
  schemaVersion: 1
  description: >-
    <p>A scarred, hungry pig of about 880 pounds (400 kg) with pink saliva at
    its mouth and malice in its eyes. It slips into a herd and eats everything,
    including the other pigs and sometimes people.</p>
  notes: >-
    <p>A scarred, hungry pig of about 880 pounds (400 kg) with pink saliva at
    its mouth and malice in its eyes. It slips into a herd and eats everything,
    including the other pigs and sometimes people.</p><p><strong>Level:</strong>
    6 (18)</p><p><strong>Related Entity:</strong> The Flesh</p><p><strong>Stress
    on first realizing its horror:</strong> 1 (usually on a failed Intellect
    defense roll)</p><p><strong>Health:</strong> 30</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Speed defense as level 4 (due to
    tremendous size)</p><h3>Combat</h3><p>It butts with its massive bulk, and
    has these options.</p><p><strong>Crush:</strong> If the target fails a Speed
    defense roll, it pins them against a wall or the ground and damages them
    each round until they escape with a Might-based task as their
    action.</p><p><strong>Delivery of the Flesh:</strong> A target in long range
    it wants to eat who fails an Intellect defense roll sleepwalks for ten
    minutes, coming to it to lie down and be eaten while chanting a litany about
    long, short, wide and narrow pigs. They may attempt an Intellect defense
    roll each round to break free, and being shaken also breaks it (being eaten
    does not).</p><p><strong>Eternal Flesh:</strong> It regains 2 health each
    round, even at 0 health.</p><h3>Interaction</h3><p>It doesn't rampage; it
    settles into a herd and quietly eats, rarely touching the pig
    keeper.</p><h3>Use</h3><p>Not an immediate threat until its endless appetite
    is understood. Then it must be evaded, or perhaps lured into a pit of wet
    cement.</p><p><em>The Magnus Archives Roleplaying Game, p229.</em></p>
