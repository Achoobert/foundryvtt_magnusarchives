name: The Jigsaw Lady
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>A round-faced old woman in a lilac dressing gown, in a tidy suburban home
    full of jigsaws, who is a contract killer. Given an object from the victim,
    she curses them to lose body parts one parcel at a time until nothing is
    left.</p>
  notes: >-
    <p>A round-faced old woman in a lilac dressing gown, in a tidy suburban home
    full of jigsaws, who is a contract killer. Given an object from the victim,
    she curses them to lose body parts one parcel at a time until nothing is
    left.</p><p><strong>Level:</strong> 6 (18)</p><p><strong>Related
    Entity:</strong> The Flesh</p><p><strong>Health:</strong>
    18</p><p><strong>Damage Inflicted:</strong> 1 point of
    Stress</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Speed defense as level 2;
    Attacks as level 2</p><h3>Combat</h3><p>She rarely attacks directly, but her
    sorcerous defenses are potent.</p><p><strong>Amputating Defense:</strong>
    Anyone attacking her must first succeed on an Intellect defense roll. On a
    failure they instead spend the next minute chewing off their own hand,
    gaining 2 Stress each round. It ends early if they succeed on an Intellect
    defense roll on their turn, or once they have gained 6 Stress and the hand
    comes off, giving a serious injury.</p><p><strong>Jigsaw Curse:</strong>
    Given a name and an object stolen from that person, she performs a ritual
    and starts a new jigsaw. Every day or two the victim receives a parcel
    holding a severed body part, starting with extremities. On a failed
    Intellect defense roll they can't help opening it, and within hours lose
    that part by apparent accident, the wound already healed, gaining 1 Stress
    that can't be recovered until the curse lifts. Resisting five parcels ends
    the curse. If the victim is murdered first, the curse passes to the
    killer.</p><h3>Interaction</h3><p>She offers coffee or tea, but once
    business starts her stare turns flinty and dangerous.</p><h3>Use</h3><p>Easy
    to underestimate. Her true horror shows if a PC is
    cursed.</p><h3>Notes</h3><p>Podcast name: Angela.</p><p><em>The Magnus
    Archives Roleplaying Game, p223.</em></p>
