name: Possessed Cannibal
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>People who kill and eat others without knowing it. They live normal lives
    broken by visions and nightmares that hide their atrocities from their own
    minds.</p>
  notes: >-
    <p>People who kill and eat others without knowing it. They live normal lives
    broken by visions and nightmares that hide their atrocities from their own
    minds.</p><p><strong>Level:</strong> 4 (12)</p><p><strong>Related
    Entity:</strong> The Flesh and The Spiral</p><p><strong>Health:</strong>
    12</p><p><strong>Damage Inflicted:</strong> Serious
    injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Persuasion and initiative as
    level 6</p><h3>Combat</h3><p>When the possession takes over, they use
    improvised weapons such as fire pokers, cast-iron pots and kitchen
    knives.</p><p><strong>Completely Normal:</strong> Not knowing what they are,
    they can honestly offer friendship, then ambush, easing their first attack
    by two steps.</p><p><strong>Not Alone:</strong> Groups of them may converge
    on a party, bar, service or other gathering, making them far more
    dangerous.</p><p><strong>Realization:</strong> Made to see what they have
    done, by paranormal means or expert persuasion, most collapse in shock and
    are no longer a threat.</p><p><strong>Contagious Cannibalism:</strong> One
    made to understand their guilt and then killed or exorcised passes the
    condition to the person responsible if that person fails an Intellect
    defense roll. The afflicted must make an Intellect defense roll every few
    days or have a "hallucination" in which they obey cannibalistic
    commands.</p><h3>Interaction</h3><p>Between hunts they seem normal, if
    troubled by recent "concentration issues." Told what they are, they hear
    only bells or other deafening noise.</p><h3>Use</h3><p>One is little danger,
    except that a character may end up possessed. A character who realizes this
    might seek help from another Entity's agents or a
    dabbler.</p><h3>Notes</h3><p>Sample names: Edwin Burroughs, Bethany
    O'Connor, David Fabray, Erica Babcock, Luke MacBride, Jill Tamayo, Mark
    Wagner.</p><p><em>The Magnus Archives Roleplaying Game, p234.</em></p>
