name: The Boneturner
type: npc
img: systems/magnusarchives/assets/icons/magnusnpc.webp
system:
  schemaVersion: 1
  description: >-
    <p>A sculptor in flesh who twists his own body, sometimes a horror of extra
    limbs and bone, sometimes a very large, handsome man in a loose hoodie. He
    enjoys reshaping other people even more.</p>
  notes: >-
    <p>A sculptor in flesh who twists his own body, sometimes a horror of extra
    limbs and bone, sometimes a very large, handsome man in a loose hoodie. He
    enjoys reshaping other people even more.</p><p><strong>Level:</strong> 6
    (18)</p><p><strong>Related Entity:</strong> The Flesh</p><p><strong>Stress
    on first realizing its horror:</strong> 1 (usually on a failed Intellect
    defense roll)</p><p><strong>Health:</strong> 24</p><p><strong>Damage
    Inflicted:</strong> Serious injury</p><p><strong>Movement:</strong>
    Short</p><p><strong>Modifications:</strong> Biology as level
    8</p><h3>Combat</h3><p>He attacks with a boneturning touch that twists and
    pulls the target's flesh.</p><p><strong>Bone Souvenir:</strong> A target
    damaged by his touch must succeed on a Might defense roll or he removes a
    rib, cartilage or a piece of an organ, and the pain stuns them so they lose
    their next turn.</p><p><strong>Sculpt Flesh:</strong> Over a handful of
    hour-long sessions he reshapes a helpless or willing target without killing
    them, from added muscle and bone to a twisted, immobile "flesh orchid" or a
    headless, legless, many-armed mass.</p><p><strong>Survival of the
    Flesh:</strong> He regains 2 health each round (even at 0 health), or 7 on
    any round he takes a Bone Souvenir, which he adds to his own
    body.</p><h3>Interaction</h3><p>He will negotiate, but any request costs at
    least one willingly donated bone or piece of flesh.</p><h3>Use</h3><p>His
    threat seems subtle until he takes an interest in the PCs, which can be
    lethal even for an experienced group. He has, or knows where to find, The
    Boneturner's Tale.</p><h3>Notes</h3><p>Podcast name: Jared
    Hopworth.</p><p>See The Boneturner's Tale (p268).</p><p><em>The Magnus
    Archives Roleplaying Game, p201.</em></p>
