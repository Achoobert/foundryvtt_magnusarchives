  slug: occultist-shatter
  description: >-
    <p><strong>Cost:</strong> 2+ Intellect points and 3 Stress.</p><p>Detonate a
    small mundane object of uniform material (a cup, a doorknob, a rock) within
    long range. It deals 1 point of damage to every creature and object within
    immediate radius, even if the attack roll fails. Each level of Effort
    applied to damage adds 2 points instead of 3. Action.</p><p><em>Supernatural
    ability:</em> available only once you have gained 10 levels of Stress from
    supernatural sources (p27), or from first tier with the Occultist's Already
    Tainted.</p>
