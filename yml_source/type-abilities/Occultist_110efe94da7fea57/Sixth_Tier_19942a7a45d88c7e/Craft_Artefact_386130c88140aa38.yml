  slug: occultist-craft-artefact
  description: >-
    <p>You create one artefact; take this again for each further one. Work out
    the details with the GM, but expect: hard-won plans or visions from a past
    Avatar, occultist or Entity; months or years of work; money on the scale of
    an exorbitant item; and likely 3 points of Stress per day of work plus a
    permanent loss of 3 points from your stat Pools. The result produces one
    effect equal to a sixth-tier type or focus ability, costing 3 Stress to
    use.</p>
