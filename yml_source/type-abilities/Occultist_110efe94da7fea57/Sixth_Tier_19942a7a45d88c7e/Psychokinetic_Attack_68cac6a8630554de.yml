  slug: occultist-psychokinetic-attack
  description: >-
    <p><strong>Cost:</strong> 6 Might points and 5 Stress.</p><p>Either hurl a
    heavy object at someone within short range as an Intellect action, dealing 6
    points of damage to both target and object (throwing a foe at another foe
    takes two rolls), or unleash a burst that destroys an inanimate object no
    larger than half your size on an Intellect roll eased by three steps
    compared to breaking it by force. Action.</p><p><em>Supernatural
    ability:</em> available only once you have gained 10 levels of Stress from
    supernatural sources (p27), or from first tier with the Occultist's Already
    Tainted.</p>
