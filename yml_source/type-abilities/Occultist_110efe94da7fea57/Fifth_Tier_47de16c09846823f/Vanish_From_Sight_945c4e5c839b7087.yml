  slug: occultist-vanish-from-sight
  description: >-
    <p><strong>Cost:</strong> 5 Intellect points and 4 Stress.</p><p>You turn
    invisible for up to one minute. You can only move or gently handle objects
    (open doors); doing anything else, like talking or attacking, reveals you,
    but an action spent hiding resumes the remaining time. Action to
    initiate.</p><p><em>Supernatural ability:</em> available only once you have
    gained 10 levels of Stress from supernatural sources (p27), or from first
    tier with the Occultist's Already Tainted.</p>
