  description: >-
    <p><strong>Cost:</strong> 5 Intellect points and 3 Stress.</p><p>You control
    the actions of a creature within short distance who understands you, for ten
    minutes or until it leaves range. Making it do something it never normally
    would needs another roll to keep control. Action.</p><p><em>Supernatural
    ability:</em> available only once you have gained 10 levels of Stress from
    supernatural sources (p27), or from first tier with the Occultist's Already
    Tainted.</p>
