  description: >-
    <p><strong>Cost:</strong> 6 Intellect points and 3 Stress.</p><p>Drawing on
    dark forces, you tell someone something horrifying about themselves (true or
    not) that they come to believe deeply. They lose their next action, and all
    their actions afterward are hindered by two steps. Most flee if they can.
    Action.</p><p><em>Supernatural ability:</em> available only once you have
    gained 10 levels of Stress from supernatural sources (p27), or from first
    tier with the Occultist's Already Tainted.</p>
