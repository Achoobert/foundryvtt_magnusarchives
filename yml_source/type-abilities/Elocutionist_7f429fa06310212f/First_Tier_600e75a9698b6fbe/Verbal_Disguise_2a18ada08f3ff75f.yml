system:
  schemaVersion: 1
  slug: elocutionist-verbal-disguise
  description: >-
    <p><strong>Cost:</strong> 1 Intellect point.</p><p>Mimic the voice and
    speech of someone you've heard to make one significant statement; each
    further important statement costs 1 more Intellect point. Anyone who sees
    you isn't fooled, so it suits phones, darkness or a heavy disguise. It
    doesn't make you more persuasive. If the GM rules the speaker would never
    say something, you fail at once, and if you said several things, the
    listener knows none came from them. Enabler.</p>
