  slug: investigator-see-the-past
  description: >-
    <p><strong>Cost:</strong> 5 Intellect points and 3 Stress.</p><p>Touch an
    object and ask the GM a question about its past; you get a general answer,
    often as brief images or sensations. The GM sets the question's level:
    something findable elsewhere is level 1, obscure history level 7. Afterward
    you have an asset on identifying the object. Action.</p><p><em>Supernatural
    ability:</em> available only once you have gained 10 levels of Stress from
    supernatural sources (p27), or from first tier with the Occultist's Already
    Tainted.</p>
