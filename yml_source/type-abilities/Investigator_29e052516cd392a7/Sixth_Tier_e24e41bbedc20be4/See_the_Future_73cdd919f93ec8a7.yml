  slug: investigator-see-the-future
  description: >-
    <p><strong>Cost:</strong> 6 Intellect points and 3 Stress.</p><p>You read
    the variables around you and predict the next few minutes. For ten minutes
    your defense rolls gain an asset; you gain an asset to see through deception
    and betrayal and to avoid traps and ambushes; and you gain an asset on
    interaction and deception tasks because you know what people will say.
    Enabler.</p><p><em>Supernatural ability:</em> available only once you have
    gained 10 levels of Stress from supernatural sources (p27), or from first
    tier with the Occultist's Already Tainted.</p>
