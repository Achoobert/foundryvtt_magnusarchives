  slug: investigator-supernatural-senses
  description: >-
    <p><strong>Cost:</strong> 4 Intellect points and 3 Stress.</p><p>While
    exploring, you stretch your senses up to 1 mile (1.6 km) in any direction
    and ask the GM a simple, usually yes-or-no question about that area. If the
    answer isn't there, you learn nothing. Action.</p><p><em>Supernatural
    ability:</em> available only once you have gained 10 levels of Stress from
    supernatural sources (p27), or from first tier with the Occultist's Already
    Tainted.</p>
