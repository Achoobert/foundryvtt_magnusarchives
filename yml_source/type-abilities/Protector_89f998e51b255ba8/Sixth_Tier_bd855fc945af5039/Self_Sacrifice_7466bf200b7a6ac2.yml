  slug: protector-self-sacrifice
  description: >-
    <p><strong>Cost:</strong> 6 Might points and 5 Stress.</p><p>You do nothing
    but stand and defend for one round. Every foe within long range attacks you
    instead of your allies, no roll needed. That round you ignore minor injuries
    (Stress other than this ability's cost) and the first serious injury you
    take. Action.</p><p><em>Supernatural ability:</em> available only once you
    have gained 10 levels of Stress from supernatural sources (p27), or from
    first tier with the Occultist's Already Tainted.</p>
