  slug: protector-savagery
  description: >-
    <p><strong>Cost:</strong> 5 Might points and 3 Stress.</p><p>You become a
    savage, inhuman beast for an hour: +8 Might Pool, +2 Might Edge, +4 Speed
    Pool, +2 Speed Edge. You can spend Intellect only to try to change back
    early (difficulty 2), and you attack every living creature within short
    range. Afterward you have -1 to all rolls for an hour, or -2 for 24 hours if
    you didn't kill and eat a substantial creature. Eating an intelligent
    creature gives you 3 points of Stress. Action to change or change
    back.</p><p><em>Supernatural ability:</em> available only once you have
    gained 10 levels of Stress from supernatural sources (p27), or from first
    tier with the Occultist's Already Tainted.</p>
