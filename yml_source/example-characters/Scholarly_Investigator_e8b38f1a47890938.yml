_id: e8b38f1a47890938
name: Scholarly Investigator
type: character
img: systems/magnusarchives/assets/icons/magnuspc.webp
system:
  schemaVersion: 1
  description: >-
    <p>The sample starting Character from the printed sheet (p379): a Scholarly
    Investigator who Explores Dark Places. Tier 1, ready to play.</p>
  notes: >-
    <h2>Background</h2><p>Your mother was an Egyptologist who kept bringing home
    odd little finds from her digs. Her stories are the reason you went looking
    into the past yourself, and into the dark places where the past is still
    waiting.</p><h2>Connections</h2><p>Pick one other PC. They have been your
    companion on earlier investigations, and the pair of you work together well
    enough that you each gain an asset on any roll made while collaborating on
    the same noncombat task.</p><h2>Character Arc</h2><p><strong>Assist an
    Organization:</strong> your research lines up neatly with the group you
    belong to, which exists to document supernatural events.</p><h2>Equipment
    Notes</h2><p><strong>Provided by the organization:</strong> laptop, secure
    briefcase.</p><p><strong>Additional:</strong> a replica hieroglyph stamp
    set, a gift from your mother.</p>
