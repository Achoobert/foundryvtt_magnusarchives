      description: >-
        <p>You studied, alone or with an instructor, and you are an expert in a
        couple of fields.</p><p><strong>You gain the following
        characteristics:</strong></p><ul><li><p><strong>Studied:</strong>
        Scholarly offers no initial stat Pool bonus, but another skill
        instead.</p></li><li><p><strong>Skill:</strong> You're trained in One
        knowledge skill, such as philosophy, geography, or
        history.</p></li><li><p><strong>Skill:</strong> You're trained in
        Another, different knowledge skill, such as astronomy, biology, or
        geology.</p></li><li><p><strong>Suggested Second Skill:</strong>
        Identifying or researching.</p></li><li><p><strong>Suggested
        Inability:</strong> You spend too long on scholarly pursuits to trust
        your empathy. You have an inability in
        @UUID[Compendium.magnusarchives.skills.Item.952bfb5f1296eb5b]{Discerning
        motive}.</p></li></ul>
