  - _id: 7c93bd6219153203
    name: Explores Dark Places
    type: focus
    img: systems/magnusarchives/assets/icons/magnusfocus.webp
    system:
      schemaVersion: 1
      slug: explores-dark-places
      description: >-
        <p>Cellars, empty houses, tunnels and caves feel like home to you, and
        open skies may make you uneasy. The dark is where lost things turn up.
        You wear dark clothes to blend in, or sensible gear for serious work
        below ground.</p><p><strong>Connection:</strong> Choose one of the
        following with your group.</p><ol><li><p>Another PC has been your
        partner on past expeditions. When you both work on the same noncombat
        task, you each gain an asset.</p></li><li><p>You think you once saw two
        other PCs doing something illegal through a keyhole. You choose whether
        to share it; they choose whether it was really them.</p></li><li><p>One
        other PC always seems to hear you, however quietly you
        move.</p></li><li><p>One other PC is so loud that you feel bound to
        teach them to move quietly, whether they want lessons or
        not.</p></li></ol><p><strong>Minor Effect Suggestion:</strong> The
        target is dazed for a round, and all its tasks are
        hindered.</p><p><strong>Major Effect Suggestion:</strong> The target is
        stunned and loses its next turn.</p><p><strong>GM Intrusions:</strong>
        Belongings slip out of pockets in the dark and maps go missing.
        Information you gather leaves out something
        important.</p><p><strong>Abilities by
        tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
        @UUID[Compendium.magnusarchives.focus-abilities.Item.177c6d616b7ea295]{Superb
        Explorer}</p></li><li><p><strong>Tier 2:</strong>
        @UUID[Compendium.magnusarchives.focus-abilities.Item.406f4c11055802e3]{Superb
        Infiltrator},
        @UUID[Compendium.magnusarchives.focus-abilities.Item.7afc68f67536dac4]{Eyes
        Adjusted}</p></li><li><p><strong>Tier 3:</strong> Choose
        @UUID[Compendium.magnusarchives.focus-abilities.Item.69c487f075621bc6]{Nightstrike}
        or
        @UUID[Compendium.magnusarchives.focus-abilities.Item.68c5e57a37cff69a]{Slippery
        Customer}.</p></li><li><p><strong>Tier 4:</strong>
        @UUID[Compendium.magnusarchives.focus-abilities.Item.8a97b3af2d216f7f]{Hard-Won
        Resilience}</p></li><li><p><strong>Tier 5:</strong>
        @UUID[Compendium.magnusarchives.focus-abilities.Item.4d30c3af0857106a]{Dark
        Explorer}</p></li><li><p><strong>Tier 6:</strong> Choose
        @UUID[Compendium.magnusarchives.focus-abilities.Item.519151d6f159967e]{Blinding
        Attack} or
        @UUID[Compendium.magnusarchives.focus-abilities.Item.441d7c0b205fb29a]{Dark
        Flow}.</p></li></ul>
      source:
        uuid: ''
        book: The Magnus Archives Roleplaying Game
        page: 63-64
        license: original
