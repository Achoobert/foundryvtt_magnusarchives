name: Would Rather Be Reading
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: would-rather-be-reading
  description: >-
    <p>People have always asked why you read so much, and whether you'd rather
    read about life than live it. Yes, you think. Books are your friends,
    fiction for escape and nonfiction for knowledge, and nothing matters more
    than learning. You always have something to read on
    you.</p><p><strong>Connection:</strong> Choose one of the following with
    your group.</p><ol><li><p>Another PC understands that you need time and
    space alone to read.</p></li><li><p>Another PC gave you a book that became a
    favourite.</p></li><li><p>Another PC reminds you of the hero of a favourite
    book, and you can't help liking them.</p></li><li><p>Another PC borrowed a
    book, never returned it, and has no good story about what
    happened.</p></li></ol><p><strong>Additional Equipment:</strong> A couple of
    books on topics of your choice.</p><p><strong>Minor Effect
    Suggestion:</strong> Something you've read eases your next
    action.</p><p><strong>Major Effect Suggestion:</strong> A book trips up the
    foe somehow (they slip on it, or are too startled to act) and they're
    stunned, losing their next turn.</p><p><strong>GM Intrusions:</strong> Books
    burn, get wet or go missing. Devices break or run out of power. Glasses
    break.</p><p><strong>Abilities by tier:</strong></p><ul><li><p><strong>Tier
    1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.91e71c4f90c99c4c]{Knowledge
    Is Power}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.25aadd2b7bbc1519]{Greater
    Enhanced Intellect}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.3b007db624281429]{Applying
    Your Knowledge} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.40884ccaca03be03]{Flex
    Skill}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.91e71c4f90c99c4c]{Knowledge
    Is Power},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.f7e36afa5a769fb0]{Knowing
    the Unknown}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.25aadd2b7bbc1519]{Greater
    Enhanced Intellect}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.c9ca1a9f3778d1bb]{Tower
    of Intellect} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.c9849969a1265c22]{Credible
    Hypothesis}. Either way, you also gain
    @UUID[Compendium.magnusarchives.focus-abilities.Item.91e71c4f90c99c4c]{Knowledge
    Is Power}.</p></li></ul>
  source:
