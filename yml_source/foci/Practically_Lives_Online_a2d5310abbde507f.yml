name: Practically Lives Online
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: practically-lives-online
  description: >-
    <p>The internet has been your home since you first opened a browser.
    Websites, social media, gaming, streaming, forums, apps: you know the latest
    news, jokes and places that matter. You dress so casually it's sometimes
    inappropriate, and you may forget mirrors
    exist.</p><p><strong>Connection:</strong> Choose one of the following with
    your group.</p><ol><li><p>You knew another PC online long before you met in
    person.</p></li><li><p>Another PC says you spend too much time online and
    tells you to go outside. Charming or just annoying? You
    decide.</p></li><li><p>Another PC believes you've dug up their personal
    information. You decide whether they're right.</p></li><li><p>Another PC is
    hopeless with tech and keeps asking you to fix their computer or explain
    things.</p></li></ol><p><strong>Additional Equipment:</strong> A
    top-of-the-line laptop and smartphone, beyond what an average character
    could afford.</p><p><strong>Minor Effect Suggestion:</strong> Your next
    attempt at anything involving computers is eased.</p><p><strong>Major Effect
    Suggestion:</strong> Thinking about how you'll brag online about this, you
    immediately restore 1d6 + 1 points to your Intellect Pool.</p><p><strong>GM
    Intrusions:</strong> Hackers get hacked. Paying attention to the internet
    leads to doing or saying exactly the wrong thing in real
    life.</p><p><strong>Abilities by tier:</strong></p><ul><li><p><strong>Tier
    1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.66723c188ed301d6]{Online
    Research},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.994675998a6a0a0a]{Tech
    Skill}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.d5878b17fa525771]{Hacking}</p></li><li><p><strong>Tier
    3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.0bc79a45de0e0459]{Online
    Contacts} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.5fe8e4c376c3bb73]{Crowdsourcing}.</p></li><li><p><strong>Tier
    4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.382b6278bc9375e2]{Deep
    Dive}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.f466e36ca5a33cbc]{Better
    Hacking}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.9249767ae46ee354]{Read
    It Somewhere} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.970a01e3a7d3a8a6]{Brain
    Food}.</p></li></ul>
