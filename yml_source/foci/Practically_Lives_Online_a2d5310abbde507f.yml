      - id: t1-online-research
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.66723c188ed301d6
        abilitySnapshot:
          name: Online Research
          description: All researching tasks are eased when you have internet access.
        tier: 1
        position:
          x: 0
          'y': null
      - id: t1-tech-skill
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.994675998a6a0a0a
        abilitySnapshot:
          name: Tech Skill
          description: >-
            You're trained in one of these skills of your choice: electronics,
            engineering, programming or researching.
        tier: 1
        position:
          x: 1
          'y': null
      - id: t2-hacking
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.d5878b17fa525771
        abilitySnapshot:
          name: Hacking
          description: >-
            You can pose as someone else online, which might get you into their
            information, money or credit cards, or let you tip off the
            authorities about crimes they (probably didn't) commit. Less
            harmfully, you can learn about them: address, routine, current
            location. It takes from a minute to many hours, and the difficulty
            depends on the person's level and their online security; reading
            someone's email is harder than tracing their family history, and
            their bank account harder still.
        tier: 2
        position:
          x: 0
          'y': null
      - id: t3-online-contacts
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.0bc79a45de0e0459
        abilitySnapshot:
          name: Online Contacts
          description: >-
            You have three contacts you know only online, each with an area of
            expertise you choose. With online access you can ask them about
            their field and get a detailed answer within an hour, and answers to
            follow-up questions within another hour.
        tier: 3
        position:
          x: 0
          'y': null
      - id: t3-crowdsourcing
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.5fe8e4c376c3bb73
        abilitySnapshot:
          name: Crowdsourcing
          description: >-
            You post a question online and let others help. If you wait for the
            answers (up to 24 hours), any information-related task, research
            included, is eased by two steps. Action to initiate.
        tier: 3
        position:
          x: 1
          'y': null
      - id: t4-deep-dive
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.382b6278bc9375e2
        abilitySnapshot:
          name: Deep Dive
          description: >-
            Through the internet, ask the GM one question and get a general
            answer. The GM sets the level by how obscure it is: something
            findable elsewhere is level 1, obscure knowledge of the past is
            level 7. Knowledge of the future is impossible.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t5-better-hacking
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.f466e36ca5a33cbc
        abilitySnapshot:
          name: Better Hacking
          description: >-
            With electronic access to a system, you try to take control of it:
            cameras, alarms, electronic locks, tracking, whole email servers,
            website back ends, databases and so on. The difficulty depends on
            its protections, usually 3 to 9, and it may take one action or
            hours.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t6-read-it-somewhere
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.9249767ae46ee354
        abilitySnapshot:
          name: Read It Somewhere
          description: >-
            After a round of concentration, you recall obscure facts from the
            internet that ease the task you attempt next round by three steps.
        tier: 6
        position:
          x: 0
          'y': null
      - id: t6-brain-food
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.970a01e3a7d3a8a6
        abilitySnapshot:
          name: Brain Food
          description: Gain 6 points to your Intellect Pool.
        tier: 6
        position:
          x: 1
          'y': null
