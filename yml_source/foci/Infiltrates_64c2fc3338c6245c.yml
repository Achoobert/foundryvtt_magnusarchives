name: Infiltrates
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: infiltrates
  description: >-
    <p>Subtlety, guile and stealth are your trade, honed over years of practice.
    You use disguises and tools, but your training matters most. Infiltrators
    are often spies, agents or undercover officers, and sometimes thieves or
    assassins.</p><p><strong>Connection:</strong> Choose one of the following
    with your group.</p><ol><li><p>You watched another PC from a distance for a
    while before you met and became allies. You decide whether to tell
    them.</p></li><li><p>However hard you try, you can't hide from one other
    PC.</p></li><li><p>You and two other PCs once worked a mission together,
    then fell out.</p></li><li><p>Another PC is your sibling (if their player
    agrees), and you look very alike.</p></li></ol><p><strong>Minor Effect
    Suggestion:</strong> Your moves startle the opponent so much that they're
    dazed and their tasks are hindered.</p><p><strong>Major Effect
    Suggestion:</strong> Every opponent within short range is startled and
    dazed, with their tasks hindered.</p><p><strong>GM Intrusions:</strong>
    Spies are punished harshly when caught, and allies disown infiltrators who
    get caught. Some secrets are better left buried.</p><p><strong>Abilities by
    tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.b68e008aa4c32e97]{Stealthy},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.d5641a784f86f54e]{Sense
    Attitudes}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.32dfd30c4f9a9327]{Impersonate},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.299ce9cbfa0bdcb9]{Flight
    Not Fight}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.778d2fca9f86cc75]{Awareness}
    or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.bf4c9ed156dd4dcd]{Skill
    With Attacks}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.983fa61357867e75]{Nearly
    Invisible}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.29728ac9a4334f38]{Evasion}</p></li><li><p><strong>Tier
    6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.cc8cfcd73554b632]{Brainwashing}
    or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.5b1c6de3437b1cb0]{Spring
    Away}.</p></li></ul>
