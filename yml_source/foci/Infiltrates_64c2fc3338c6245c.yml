          name: Sense Attitudes
          description: You're trained in discerning motive.
        tier: 1
        position:
          x: 1
          'y': null
      - id: t2-impersonate
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.32dfd30c4f9a9327
        abilitySnapshot:
          name: Impersonate
          description: >-
            For one hour you change your voice, posture and mannerisms and throw
            together a disguise, gaining an asset to pass as someone else,
            either a specific person or a general role. Action to initiate.
        tier: 2
        position:
          x: 0
          'y': null
      - id: t2-flight-not-fight
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.299ce9cbfa0bdcb9
        abilitySnapshot:
          name: Flight Not Fight
          description: >-
            If you use your action only to move, your Speed defense tasks are
            eased.
        tier: 2
        position:
          x: 1
          'y': null
      - id: t3-awareness
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.778d2fca9f86cc75
        abilitySnapshot:
          name: Awareness
          description: >-
            When you spend a level of Effort on a perception task, you get one
            extra free level of Effort on it.
        tier: 3
        position:
          x: 0
          'y': null
      - id: t3-skill-with-attacks
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.bf4c9ed156dd4dcd
        abilitySnapshot:
          name: Skill With Attacks
          description: >-
            Pick one attack type you aren't trained in: light, medium or heavy,
            each bashing, bladed or ranged. You become trained in attacks with
            that type of weapon. You can take this ability more than once,
            choosing a different attack type each time.
        tier: 3
        position:
          x: 1
          'y': null
      - id: t4-nearly-invisible
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.983fa61357867e75
        abilitySnapshot:
          name: Nearly Invisible
          description: >-
            For ten minutes you commit fully to staying unseen. While hiding,
            you're specialized in stealth and Speed defense tasks. The effect
            ends if you reveal yourself (attacking, using an ability, moving
            something large), but you can take an action to hide again and
            restore it. Action to initiate or reinitiate.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t5-evasion
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.29728ac9a4334f38
        abilitySnapshot:
          name: Evasion
          description: You're trained in all defense tasks.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t6-brainwashing
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.cc8cfcd73554b632
        abilitySnapshot:
          name: Brainwashing
          description: >-
            With trickery and smooth lies, you make a target of level 3 or lower
            do as you say. On a successful Intellect attack, you direct the
            actions of a target you speak to for one minute, letting them act
            freely or overriding them case by case, as long as you can see and
            direct them. If someone challenges what they're doing, you need
            another successful Intellect attack to reassure them or they stop.
            Each extra level of Effort can raise the target's maximum level by 1
            or add a minute. Action to initiate. The book advises handling this
            with care and never using it on PCs.
        tier: 6
        position:
          x: 0
          'y': null
      - id: t6-spring-away
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.5b1c6de3437b1cb0
        abilitySnapshot:
          name: Spring Away
          description: >-
            Whenever you succeed on a Speed defense roll, you can immediately
            move up to a short distance. Once per round.
        tier: 6
        position:
          x: 1
          'y': null
