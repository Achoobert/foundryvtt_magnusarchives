name: Wears a Badge
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: wears-a-badge
  description: >-
    <p>You're a police officer. It's a hard and often thankless job, made worse
    when bad apples abuse their power, but you take enforcing the law and
    keeping the peace seriously. Hard questions and your commanding presence
    often get confessions. On duty you're in uniform with your badge or warrant
    card on show; off duty you still carry
    them.</p><p><strong>Connection:</strong> Choose one of the following with
    your group.</p><ol><li><p>Another PC once trained under you as a cadet (if
    they agree they were in law enforcement), but has since moved
    on.</p></li><li><p>You know another PC spent several months in prison, but
    not why.</p></li><li><p>Another PC is an old friend who hates that you're a
    cop and keeps trying to get you to quit.</p></li><li><p>There's a warrant on
    record for another PC, probably unpaid parking fines. You've chosen not to
    raise it, for now.</p></li></ol><p><strong>Additional Equipment:</strong>
    Police uniform and duty belt (handcuffs, radio, holster, torch), a badge, a
    gun (medium ranged weapon you're licensed to carry) and a baton (light melee
    weapon).</p><p><strong>Minor Effect Suggestion:</strong> The next time you
    command the same foe, the task is eased.</p><p><strong>Major Effect
    Suggestion:</strong> The foe surrenders, or your ability affects them for
    twice as long.</p><p><strong>GM Intrusions:</strong> Bystanders react badly
    when you reveal your authority. A more urgent situation demands your
    attention.</p><p><strong>Abilities by
    tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.43a9c23160cc519d]{Authority},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.51dd19ab2e359b3a]{Driver},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.c73e543e4d3800d1]{Armed
    Response}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.731998d2f651843f]{Command}</p></li><li><p><strong>Tier
    3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.2a82e9a2546507fe]{Cool
    Under Fire} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.71d39d3b2f8e97b4]{Insider}.</p></li><li><p><strong>Tier
    4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.0932f9b16bf17947]{Rapid
    Attack}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.f1da9727bccfe419]{Encouraging
    Presence},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.40d86c27707e362c]{Skill
    With Defense}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.feab8d677b18b295]{Greater
    Enhanced Might or Speed} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.8089438094ff5cf0]{Close
    to the Chief}.</p></li></ul><p><strong>Badge or warrant card:</strong> a
    real one requires ongoing employment with a police force, though leave,
    sabbaticals and holidays don't put it at risk. If it's taken away and you
    use a fake, someone may spot the fraud, though most NPCs won't.</p><p>Taking
    Close to the Chief makes you part of the problem: special treatment is
    likely a sign of corruption.</p>
