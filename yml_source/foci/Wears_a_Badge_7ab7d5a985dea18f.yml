        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.43a9c23160cc519d
        abilitySnapshot:
          name: Authority
          description: >-
            Your air of authority is an asset on all social interactions. Some
            people react the opposite way, such as criminals or those the police
            have wronged, and your interactions with them are hindered instead.
        tier: 1
        position:
          x: 0
          'y': null
      - id: t1-driver
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.51dd19ab2e359b3a
