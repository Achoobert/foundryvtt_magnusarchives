          x: 1
          'y': null
      - id: t1-armed-response
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.c73e543e4d3800d1
        abilitySnapshot:
          name: Armed Response
          description: You're practiced with guns and take no penalty when you use one.
        tier: 1
        position:
          x: 2
          'y': null
      - id: t2-command
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.731998d2f651843f
        abilitySnapshot:
          name: Command
          description: >-
            Using your authority as an officer, you give one simple command to a
            target within short range who can understand you. On a successful
            Intellect attack, they try to carry it out as their next action. The
            command can't directly harm them or their allies ("Flee" might work,
            "Stab yourself" won't) and must be a single action. They can still
            defend themselves and strike back if attacked.
        tier: 2
        position:
          x: 0
          'y': null
      - id: t3-cool-under-fire
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.2a82e9a2546507fe
        abilitySnapshot:
          name: Cool Under Fire
          description: You're trained in Speed defense tasks.
        tier: 3
        position:
          x: 0
          'y': null
      - id: t3-insider
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.71d39d3b2f8e97b4
        abilitySnapshot:
          name: Insider
          description: >-
            You can get information only law enforcement has: past cases and
            crimes, identities from licence plates, missing persons details and
            so on.
        tier: 3
        position:
          x: 1
          'y': null
      - id: t4-rapid-attack
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.0932f9b16bf17947
        abilitySnapshot:
          name: Rapid Attack
          description: Once per round, you can make an extra attack with your gun.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t5-encouraging-presence
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.f1da9727bccfe419
        abilitySnapshot:
          name: Encouraging Presence
          description: >-
            For one minute, allies within short range gain an asset on defense
            rolls.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t5-skill-with-defense
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.40d86c27707e362c
        abilitySnapshot:
          name: Skill With Defense
          description: >-
            Pick one defense task you aren't trained in: Might defense, Speed
            defense or Intellect defense. You become trained in it.
        tier: 5
        position:
          x: 1
          'y': null
      - id: t6-greater-enhanced-might-or-speed
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.feab8d677b18b295
        abilitySnapshot:
          name: Greater Enhanced Might or Speed
          description: >-
            Gain 6 points to your Might Pool, 6 to your Speed Pool, or split 6
            points between them.
        tier: 6
        position:
          x: 0
          'y': null
      - id: t6-close-to-the-chief
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.8089438094ff5cf0
        abilitySnapshot:
          name: Close to the Chief
          description: >-
            The chief of police (or equivalent) respects and likes you. Beyond
            sharing information, they give you room to bend or break the rules.
            Through them you can see almost any case file, in your department or
            other agencies (national police, Interpol and the like), and call in
            backup or help, kept confidential if needed.
        tier: 6
        position:
          x: 1
          'y': null
