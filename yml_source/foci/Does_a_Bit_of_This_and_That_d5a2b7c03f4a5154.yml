      - id: t3-skill-with-attacks
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.c8549d179a90b471
        abilitySnapshot:
          name: Skill With Attacks
          description: >-
            Pick one attack type you aren't trained in: light, medium or heavy,
            each bashing, bladed or ranged. You become trained in attacks with
            that type of weapon. You can take this ability more than once,
            choosing a different attack type each time.
        tier: 3
        position:
          x: 0
          'y': null
      - id: t3-improvise
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.ecb1812c8e976d37
        abilitySnapshot:
          name: Improvise
          description: >-
            When you attempt a task you're not trained in, you can improvise (a
            makeshift tool, a flash of insight, plain dumb luck) to gain an
            asset on it.
        tier: 3
        position:
          x: 1
          'y': null
      - id: t4-life-lessons
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.b44d70c2b67b0eb6
        abilitySnapshot:
