          description: Pick any two noncombat skills. You become trained in both.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t4-greater-skill-with-defense
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.169427dfaf340df4
        abilitySnapshot:
          name: Greater Skill With Defense
          description: >-
            Pick one defense task (Might, Speed or Intellect), even one you're
            trained in. You become trained in it, or specialized if you were
            already trained. You can take this up to three times, picking a
            different defense each time.
        tier: 4
        position:
          x: 1
          'y': null
      - id: t5-greater-enhanced-potential
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.e8b379590eebe466
        abilitySnapshot:
          name: Greater Enhanced Potential
          description: Gain 6 points to split among your stat Pools however you like.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t6-drawing-on-lifes-experiences
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.98c387f9f580474e
        abilitySnapshot:
          name: Drawing on Life's Experiences
          description: >-
            Ask the GM one question and get a general answer. The GM sets the
            task level by how obscure the answer is: something you could look up
            elsewhere is level 1, obscure knowledge of the past is level 7. The
            player is encouraged to describe the past experience that supplies
            the answer.
        tier: 6
        position:
          x: 0
          'y': null
      - id: t6-quick-wits
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.0493897952566309
        abilitySnapshot:
          name: Quick Wits
          description: >-
            When a task would normally cost points from your Intellect Pool, you
            can pay with Speed points instead.
        tier: 6
        position:
          x: 1
          'y': null
