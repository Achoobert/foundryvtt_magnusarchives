name: Does a Bit of This and That
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: does-a-bit-of-this-and-that
  description: >-
    <p>You've drifted through plenty of jobs and nothing has stuck. You take
    life easy, pick things up, and move on when they get dull, so you know a
    little about a lot. You dress casually and might be fit or bookish,
    whichever suits you.</p><p><strong>Connection:</strong> Choose one of the
    following with your group.</p><ol><li><p>Another PC has always been there
    for you and has bailed you out more than once.</p></li><li><p>Another PC is
    far too uptight. You hope to be the one who teaches them to
    relax.</p></li><li><p>You're a bit jealous of another PC, who beats you at
    your favourite hobby.</p></li><li><p>You owe another PC money and fully mean
    to pay it back once things go your way.</p></li></ol><p><strong>Minor Effect
    Suggestion:</strong> Something you've lived through eases your next
    action.</p><p><strong>Major Effect Suggestion:</strong> You get a free
    recovery roll that takes no action.</p><p><strong>GM Intrusions:</strong>
    New situations confuse and stress you. Past actions, or failures to act,
    come back to haunt you.</p><p><strong>Abilities by
    tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.b44d70c2b67b0eb6]{Life
    Lessons}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.9862dfd1e512227c]{Totally
    Chill}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.c8549d179a90b471]{Skill
    With Attacks} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.ecb1812c8e976d37]{Improvise}.</p></li><li><p><strong>Tier
    4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.b44d70c2b67b0eb6]{Life
    Lessons},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.169427dfaf340df4]{Greater
    Skill With Defense}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.e8b379590eebe466]{Greater
    Enhanced Potential}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.98c387f9f580474e]{Drawing
    on Life's Experiences} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.0493897952566309]{Quick
    Wits}.</p></li></ul>
