    nodes:
      - id: t1-stealthy
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.c72e6aa6e75891fc
        abilitySnapshot:
          name: Stealthy
          description: >-
            You're trained in two of these skills of your choice: deception,
            discerning motive, disguise, lockpicking, pickpocketing or stealth.
            You can take this ability more than once, choosing different skills
            each time.
        tier: 1
        position:
          x: 0
          'y': null
      - id: t2-underworld-contacts
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.ee99b0311dd8d906
        abilitySnapshot:
          name: Underworld Contacts
          description: >-
            You know many people involved in illegal activity. They aren't
            necessarily friends or trustworthy, but they see you as one of their
            own and may owe you a favour. Work out three or four of these
            contacts with the GM.
        tier: 2
        position:
          x: 0
          'y': null
      - id: t3-pull-a-fast-one
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.8b748eada00da2c1
        abilitySnapshot:
          name: Pull a Fast One
          description: >-
            When you run a con, pick a pocket, trick a mark, sneak something
            past a guard and the like, you gain an asset on the task.
        tier: 3
        position:
          x: 0
          'y': null
      - id: t3-i-know-a-guy
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.2fd91c5cc43438a9
        abilitySnapshot:
          name: I Know a Guy
          description: >-
            Facing a difficult problem that isn't urgent, you reach someone you
            know, or know of, who might solve it. They're nearly always on the
            edges of society: criminals, ex-convicts and the like. Typical help
            includes fencing or buying illegal goods, forgeries and fake IDs,
            breaking into computers or phones, getting confidential information,
            or hiring criminals from burglars to hitmen. Finding them, meeting
            and agreeing terms usually takes three to seven days, and they
            expect payment or a favour.
        tier: 3
        position:
          x: 1
          'y': null
      - id: t4-master-thief
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.085d888edb3f4157
        abilitySnapshot:
          name: Master Thief
          description: You're trained in gymnastics and lockpicking.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t5-dirty-fighter
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.a08c2162014b0977
        abilitySnapshot:
          name: Dirty Fighter
          description: >-
            You distract, blind, annoy or otherwise hamper a foe, hindering
            their attacks and defenses for one minute.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t6-alley-rat
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.194258389f79cf80
        abilitySnapshot:
          name: Alley Rat
          description: >-
            In a city, you find or make a major shortcut, secret way in or
            emergency escape route where none seemed to exist. It takes a
            successful Intellect action at a difficulty the GM sets. Work out
            the details with the GM.
        tier: 6
        position:
          x: 0
          'y': null
      - id: t6-all-out-con
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.85b0c4e437be54c4
        abilitySnapshot:
          name: All-Out Con
          description: >-
            You put everything in: add three free levels of Effort to your next
            task. You can't use this again until after a ten-hour recovery.
        tier: 6
        position:
          x: 1
          'y': null
