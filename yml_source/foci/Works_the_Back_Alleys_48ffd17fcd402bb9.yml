name: Works the Back Alleys
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: works-the-back-alleys
  description: >-
    <p>Thief, burglar, pickpocket: you've made a living in the back alleys at
    the expense of the rich and careless, whether out of danger or desperation.
    Those talents serve you well in plenty of other work too. You dress to blend
    in, and in black when you're on a job.</p><p><strong>Connection:</strong>
    Choose one of the following with your group.</p><ol><li><p>Another PC knew
    you before and helped you leave crime behind, at least for
    now.</p></li><li><p>You once tried to steal from another PC, and they caught
    you.</p></li><li><p>You can never hide from one particular
    PC.</p></li><li><p>Another PC knows your real identity or that you work
    undercover (if either is secret), and has kept quiet so
    far.</p></li></ol><p><strong>Additional Equipment:</strong> A bag of light
    tools, including lockpicks.</p><p><strong>Minor Effect Suggestion:</strong>
    You can immediately try to hide after this action.</p><p><strong>Major
    Effect Suggestion:</strong> You can immediately take a second action this
    turn.</p><p><strong>GM Intrusions:</strong> Thieves end up in jail. Powerful
    enemies are made.</p><p><strong>Abilities by
    tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.c72e6aa6e75891fc]{Stealthy}</p></li><li><p><strong>Tier
    2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.ee99b0311dd8d906]{Underworld
    Contacts}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.8b748eada00da2c1]{Pull
    a Fast One} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.2fd91c5cc43438a9]{I
    Know a Guy}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.085d888edb3f4157]{Master
    Thief}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.a08c2162014b0977]{Dirty
    Fighter}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.194258389f79cf80]{Alley
    Rat} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.85b0c4e437be54c4]{All-Out
    Con}.</p></li></ul><p>Underworld contacts are lasting additions to the
    campaign, limited to what those people know and can do. I Know a Guy is
    deliberately more open-ended, but its help is temporary.</p>
