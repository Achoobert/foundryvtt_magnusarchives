name: Carries a Gun
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: carries-a-gun
  description: >-
    <p>You're dangerous with a firearm in hand. Long practice keeps you steady
    under fire. You might be a cop, a criminal, a hunter or someone who decided
    to protect themselves, and you dress so the gun is hidden, close at hand, or
    both.</p><p><strong>Connection:</strong> Choose one of the following with
    your group.</p><ol><li><p>You once winged another PC during target practice
    and badly hurt them. They decide whether they resent, fear or forgive
    you.</p></li><li><p>You overheard another PC say nobody should own a gun.
    You can prove them right or wrong.</p></li><li><p>Another PC's mother gave
    you the gun you carry.</p></li><li><p>Another PC thinks you're famous for
    something you never did. You decide whether to correct
    them.</p></li></ol><p><strong>Additional Equipment:</strong> A firearm and
    three magazines of ammunition.</p><p><strong>Minor Effect
    Suggestion:</strong> A blow to the side of the head leaves the target
    deafened for a few minutes.</p><p><strong>Major Effect Suggestion:</strong>
    You hit an artery. The foe bleeds for 1 point of damage each round until
    they bind the wound with a difficulty 3 Intellect or Speed
    task.</p><p><strong>GM Intrusions:</strong> The gun misfires or jams: the
    attack fails, the action is lost, and another action is needed to clear
    it.</p><p><strong>Abilities by tier:</strong></p><ul><li><p><strong>Tier
    1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.bba2d3c921cb8b99]{Gunner},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.837f22c351f71648]{Practiced
    With Guns}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.6d6c75cf1404893e]{Careful
    Shot}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.8886ebc970bae8a9]{Trained
    Gunner} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.21181a41c62b3af7]{Damage
    Dealer}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.ace0569a3c669a58]{Snap
    Shot}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.5b00f0e0d4dd9960]{Arc
    Spray}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.905f003d3fec0aa2]{Special
    Shot} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.277f4b7b0409c561]{Lethal
    Damage}.</p></li></ul>
