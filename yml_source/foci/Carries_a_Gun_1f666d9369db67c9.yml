          name: Arc Spray
          description: >-
            With a rapid-fire weapon, you shoot at up to three targets standing
            next to one another. Make a separate attack roll for each; every
            attack is hindered.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t6-special-shot
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.905f003d3fec0aa2
        abilitySnapshot:
          name: Special Shot
          description: >-
            When you hit with a gun, you can deal 1 less point of damage to
            strike a precise spot. For example, you can knock an object out of a
            hand, hit a limb the target moves with so its top speed drops to
            immediate for a few days (or until it gets expert medical care), or
            sever a strap so a pack or worn device falls off.
        tier: 6
