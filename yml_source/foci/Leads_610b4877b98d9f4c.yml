          x: 1
          'y': null
      - id: t2-enhanced-potential
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.62dc55bc1fb84fca
        abilitySnapshot:
          name: Enhanced Potential
          description: Gain 3 points to split among your stat Pools however you like.
        tier: 2
        position:
          x: 0
          'y': null
      - id: t2-basic-follower
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.265d686160cd7a6d
        abilitySnapshot:
          name: Basic Follower
          description: >-
            You gain a level 2 follower, and one of their modifications must be
            persuasion. You can take this ability more than once, gaining
            another level 2 follower each time.
        tier: 2
        position:
          x: 1
          'y': null
      - id: t3-advanced-command
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.ec964341892a4aac
        abilitySnapshot:
          name: Advanced Command
          description: >-
            On a successful Intellect attack, a target within short range who
            can hear and understand you obeys any command you give. While you
            keep doing nothing but issue commands, you can give that target a
            new one each turn. It ends when you stop or they leave short range.
            Action to initiate.
        tier: 3
        position:
          x: 0
          'y': null
      - id: t3-expert-follower
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.39207905d160ff36
        abilitySnapshot:
          name: Expert Follower
          description: >-
            You gain a level 3 follower with no restriction on their
            modifications. You can take this more than once. Instead of a new
            level 3 follower, you can raise an existing level 2 follower to
            level 3 and gain a new level 2 follower.
        tier: 3
        position:
          x: 1
          'y': null
      - id: t4-captivate-or-inspire
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.8c3de0e98bc29ddd
        abilitySnapshot:
          name: Captivate or Inspire
          description: >-
            Use your words one of two ways. Either all NPCs of level 2 or lower
            who hear you stay fixed on you for as long as you keep talking, or
            all NPCs who hear you act as one level higher for the next hour. You
            pick which NPCs are affected. Attacking anyone in the crowd breaks
            their attention. Action to initiate.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t5-greater-enhanced-potential
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.4eb7ed8beccc224f
        abilitySnapshot:
          name: Greater Enhanced Potential
          description: Gain 6 points to split among your stat Pools however you like.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t6-band-of-followers
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.06641901f56f49d8
        abilitySnapshot:
          name: Band of Followers
          description: >-
            You gain four level 3 followers with no restriction on their
            modifications.
        tier: 6
        position:
          x: 0
          'y': null
      - id: t6-mind-of-a-leader
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.238c3e01df68ff06
        abilitySnapshot:
          name: Mind of a Leader
          description: >-
            When you plan how to handle a future situation, ask the GM one very
            general question about how the plan is likely to go and get a short
            answer.
        tier: 6
        position:
          x: 1
          'y': null
