name: Leads
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: leads
  description: >-
    <p>Through charisma, natural authority and maybe some training, you get
    others to follow you willingly. You might be a politician, captain or
    manager. You carry yourself to inspire, charm or intimidate, and your voice
    carries over any noise.</p><p><strong>Connection:</strong> Choose one of the
    following with your group.</p><ol><li><p>Another PC used to follow you, but
    now you see them as an equal.</p></li><li><p>Another PC recently mocked you
    in a way that really hurt. How you deal with it is up to
    you.</p></li><li><p>Another PC introduces you to the follower you gain at
    tier 2.</p></li><li><p>Another PC looks so much like you that you suspect
    you're half-siblings.</p></li></ol><p><strong>Minor Effect
    Suggestion:</strong> The next time you try to influence the same foe, the
    task is eased.</p><p><strong>Major Effect Suggestion:</strong> The foe stays
    persuaded, deceived, intimidated or otherwise influenced for twice as
    long.</p><p><strong>GM Intrusions:</strong> Followers fail, betray you, lie,
    become corrupted, get kidnapped or die.</p><p><strong>Abilities by
    tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.6546569e7c7ba80e]{Natural
    Charisma},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.44424144db44f9af]{Good
    Advice}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.62dc55bc1fb84fca]{Enhanced
    Potential},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.265d686160cd7a6d]{Basic
    Follower}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.ec964341892a4aac]{Advanced
    Command} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.39207905d160ff36]{Expert
    Follower}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.8c3de0e98bc29ddd]{Captivate
    or Inspire}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.4eb7ed8beccc224f]{Greater
    Enhanced Potential}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.06641901f56f49d8]{Band
    of Followers} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.238c3e01df68ff06]{Mind
    of a Leader}.</p></li></ul><p><strong>Followers (p71):</strong> Followers
    don't need pay, food or housing. The PC usually rolls for a follower. A
    follower's level is how many tasks they have a modification in, chosen when
    you gain them. When helping you, a follower grants an asset on a task they
    have a modification for, and acts as if they had an inability in everything
    else. Acting on their own, a modification raises their effective level by
    one for that task.</p><p>A follower can't grant an asset to attacks or
    defense until they're level 3, and then only with a matching modification. A
    follower gains a level (and a new modification) each time you advance two
    tiers after gaining them. The GM may occasionally offer an exceptional
    follower, one level higher than normal. A follower can be a pet if it makes
    sense.</p><p>The GM may ask you to actually go and find a suitable follower
    when you take Basic Follower.</p>
