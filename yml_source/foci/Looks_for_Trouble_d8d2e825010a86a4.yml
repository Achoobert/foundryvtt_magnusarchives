name: Looks for Trouble
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: looks-for-trouble
  description: >-
    <p>You're a scrapper who meets problems head-on and physically. You don't
    hide or back down, and your friends feel safer heading into danger with you
    beside them. You probably dress loud so you stand
    out.</p><p><strong>Connection:</strong> Choose one of the following with
    your group.</p><ol><li><p>Past events made you watch over another PC.
    They're your default charge for your tier 2 Protector
    ability.</p></li><li><p>One or two other PCs seem tough, and you secretly
    hope to find out who's tougher.</p></li><li><p>When another PC is within
    immediate range during a fight, they sometimes ease your attacks and
    sometimes accidentally hinder them (50% chance each way, rolled per
    fight).</p></li><li><p>You used to be in a relationship with another PC. It
    ended long ago.</p></li></ol><p><strong>Additional Equipment:</strong> A
    melee weapon of your choice.</p><p><strong>Minor Effect Suggestion:</strong>
    The target is dazed for a round, with all its tasks
    hindered.</p><p><strong>Major Effect Suggestion:</strong> A piece of
    equipment your opponent wears or holds is destroyed.</p><p><strong>GM
    Intrusions:</strong> Weapons break or fly out of your grip. Brawlers trip.
    Things on the battlefield fall or collapse.</p><p><strong>Abilities by
    tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.380f5a1f8b9cee96]{Fists
    of Fury},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.6a199ba448392f9a]{Wound
    Tender}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.58c56216d8bca651]{Protector},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.34a0072f08f96158]{Breaking}</p></li><li><p><strong>Tier
    3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.81ad7e3007edb695]{Skill
    With Attacks} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.4a6b58cf42912f64]{Greater
    Enhanced Potential}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.d1d30c5cf8983813]{Knock
    Out}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.157171a38d55310c]{Mastery
    With Attacks}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.e7cd4881b2203ed8]{Greater
    Enhanced Might} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.ef4834625aa29668]{Lethal
    Damage}.</p></li></ul>
