      - id: t4-hurl-into-the-void
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.919615407cbb190f
        abilitySnapshot:
          name: Hurl Into the Void
          description: >-
            A close creature that you can see, and that can see you, believes
            it's been flung backward into an endless fall. It loses its next
            action flailing and takes 3 points of damage from the shock (3
            points of Stress for a PC).
        tier: 4
        position:
          x: 0
          'y': null
      - id: t4-image-of-a-colossus
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.2cab4bf5279e1c18
        abilitySnapshot:
          name: Image of a Colossus
          description: >-
            A creature you touch sees an impossibly huge being in the distance.
            Terrified, it freezes or flees at full speed (your choice) this
            round, and keeps doing so each round you keep making successful
            rolls against it. You must use your action each round to
            concentrate. Action to initiate.
        tier: 4
