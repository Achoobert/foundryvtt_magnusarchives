      - id: t4-brackish-gloom
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.e5cbad37e2f18773
        abilitySnapshot:
          name: Brackish Gloom
          description: >-
            Cold, black, salty water seeps from you into a small pool around
            you. It doesn't slow you, but foes' attacks against you are hindered
            by two steps while it lasts: up to ten minutes, until you end it, or
            until you move more than an immediate distance. Action to initiate.
        tier: 4
