name: 'Serves as an Avatar: The Dark'
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: avatar-the-dark
  description: >-
    <p>The Entities sometimes give a person a share of their power, spreading
    fear in the world. That person is an Avatar. Each Entity makes its own
    Avatars, directly or not, and may have several or none. The Avatar chooses
    to accept the gift, even without grasping what it means. Some serve their
    Entity like a god; unwilling ones hold great power knowing each use feeds
    something malevolent.</p><p>"Serves as an Avatar" is an extra focus added on
    top of the character's normal focus. This one is for an Avatar of The
    Dark.</p><p><strong>Requirements:</strong></p><ul><li><p>Tier 4 or
    higher.</p></li><li><p>Has gained 10 levels of Stress from paranormal
    experiences over time.</p></li><li><p>Has at least one supernatural ability
    from their type.</p></li><li><p>Has died and been reborn, physically or
    metaphorically: something drastic has changed them in body or mind. A
    character who seems to die in play and meets the other requirements may
    return changed, likely only once.</p></li></ul><p><strong>Feeding:</strong>
    An Avatar must feed their Entity or be fed upon. If you don't use your
    Entity power at least once a week, you gain 3 points of Stress, and 3 more
    each following day you go without using it.</p><p><strong>All Avatars
    gain:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.7874e3210961b887]{Sense
    Avatar} and
    @UUID[Compendium.magnusarchives.focus-abilities.Item.2155ece099f298bc]{Sense
    Supernatural Activity}.</p><p><strong>The Dark power:</strong> Choose one of
    @UUID[Compendium.magnusarchives.focus-abilities.Item.694be3852090dcb2]{Blinding
    Touch},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.e5cbad37e2f18773]{Brackish
    Gloom},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.933617939dfab3b9]{The
    Unseen}, or customise one with the GM.</p><p>The Entity powers are
    suggestions. Work with the GM to customise your Entity-specific power to fit
    your idea of the Avatar.</p>
