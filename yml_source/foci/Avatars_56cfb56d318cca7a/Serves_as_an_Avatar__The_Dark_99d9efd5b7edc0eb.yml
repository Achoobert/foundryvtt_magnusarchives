          name: Blinding Touch
          description: >-
            A creature you touch is blinded for one minute. During that time it
            suffers 1 point of Stress every few rounds, up to 3 (damage instead
            for an NPC), from fear or from stumbling into things.
        tier: 4
        position:
          x: 0
