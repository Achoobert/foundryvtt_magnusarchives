      - id: t4-deathless-avatar
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.24ffae39138392cd
        abilitySnapshot:
          name: Deathless Avatar
          description: >-
            If you go all the way down the damage track and die, you return to
            life next round at debilitated, provided you have at least 4 points
            in your Intellect Pool and spend 4 of them to trigger it. Each use
            permanently reduces your Intellect Pool by 2.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t4-the-inevitable
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.bd762dfe161b6246
        abilitySnapshot:
          name: The Inevitable
          description: >-
            A creature of level 3 or lower that you touch takes 5 points of
            damage, and 5 more each round you keep making successful rolls
            against it. You must use your action each round to concentrate. Each
            extra level of Effort raises the maximum target level by 1.
        tier: 4
        position:
          x: 1
          'y': null
      - id: t4-skull-visage
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.f24486917f9c6f74
        abilitySnapshot:
          name: Skull Visage
          description: >-
            Your face briefly flickers into a terrifying animated skull. Up to
            five chosen targets who see you and are affected by your attack are
            frozen by fear of death for the next two rounds.
        tier: 4
        position:
          x: 2
          'y': null
