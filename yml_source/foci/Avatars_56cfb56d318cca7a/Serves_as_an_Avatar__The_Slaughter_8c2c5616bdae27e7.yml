          name: Sense Supernatural Activity
          description: >-
            You sense the presence of any supernatural creature, artefact, book
            or effect within immediate range.
        tier: 1
        position:
          x: 1
          'y': null
      - id: t4-fatigue-of-battle
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.8e73dd1c0d700c6d
        abilitySnapshot:
          name: Fatigue of Battle
          description: >-
            A target you touch relives a past trauma (or someone else's, if they
            have none) for about a minute. Their tasks are hindered, and they
            suffer 1 point of Stress every round or two, up to 4 (damage instead
            for an NPC).
        tier: 4
        position:
          x: 0
          'y': null
      - id: t4-march-to-the-pipes
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.4c7a1c9a7f3ee958
        abilitySnapshot:
          name: March to the Pipes
          description: >-
            You make music (whistling, singing, bagpipes) and up to five targets
            of level 3 or lower within long range march in a regimented way in
            the direction you choose, doing nothing else on their turn. They
            keep marching each round you keep making successful rolls; you must
            use your action each round to concentrate. Each extra level of
            Effort raises the maximum target level by 1. Marching someone
            straight to their doom, such as off a cliff, takes one more
            successful roll. Action to initiate.
        tier: 4
        position:
          x: 1
          'y': null
      - id: t4-the-spirit-of-war
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.b9d8aa7454ebee33
        abilitySnapshot:
          name: The Spirit of War
          description: >-
            A creature within short range is overcome by rage and, as its next
            action, attacks the nearest creature (you, if no one is nearer) by
            the most harmful means it has. Each creature near it already engaged
            in violence adds a round, up to three rounds in total.
        tier: 4
        position:
          x: 2
          'y': null
