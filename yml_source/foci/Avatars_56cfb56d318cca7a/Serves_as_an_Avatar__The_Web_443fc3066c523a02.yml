        abilitySnapshot:
          name: Sense Avatar
          description: >-
            You can tell another Avatar is one if you can perceive them normally
            and are nearby, usually with no roll or action. An Avatar can try to
            hide what they are, but you can still spend an action on an
            Intellect-based task to identify them.
        tier: 1
