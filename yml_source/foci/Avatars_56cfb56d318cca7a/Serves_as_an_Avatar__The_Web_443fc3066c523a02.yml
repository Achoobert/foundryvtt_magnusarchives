      - id: t1-sense-supernatural-activity
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.2155ece099f298bc
        abilitySnapshot:
          name: Sense Supernatural Activity
          description: >-
            You sense the presence of any supernatural creature, artefact, book
            or effect within immediate range.
        tier: 1
        position:
          x: 1
          'y': null
      - id: t4-friend-to-the-bewebbed
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.697e0bbd63f0ba43
        abilitySnapshot:
          name: Friend to the Bewebbed
          description: >-
            You summon a bewebbed puppet (p200). It arrives within a few rounds,
            as if it was already nearby, and obeys you for one hour or until you
            dismiss it or it's destroyed.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t4-many-eyed-spies
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.cc684570e2257c0b
        abilitySnapshot:
          name: Many-eyed Spies
          description: >-
            Extra spiders gather within the hour at a place you're familiar
            with. Unless every one is found and killed, you know what happens
            there for the next day. If they can't find the place, it may be
            protected, too little known to you, or gone.
        tier: 4
        position:
          x: 1
          'y': null
      - id: t4-puppet-on-a-string
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.06e9f1c7cc03ea36
        abilitySnapshot:
          name: Puppet on a String
          description: >-
            You silently implant a command in a creature you touch, set to fire
            on a trigger you can sum up in one short sentence. When it happens,
            the target carries out the command as best it can. The command can
            be fairly complex and take up to 24 hours, but can't directly harm
            the target or anyone important to it, or be obviously impossible.
        tier: 4
        position:
          x: 2
          'y': null
