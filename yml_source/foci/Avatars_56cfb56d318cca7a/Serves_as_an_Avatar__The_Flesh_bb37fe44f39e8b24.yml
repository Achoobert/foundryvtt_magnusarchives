      - id: t4-crawling-form
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.88108b2500575863
        abilitySnapshot:
          name: Crawling Form
          description: >-
            A creature you touch has its limbs fuse together for at least ten
            minutes. It can only move by squirming and rolling.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t4-twisted-form
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.87bd30f72ca670d8
        abilitySnapshot:
          name: Twisted Form
          description: >-
            You reshape a creature you touch however you choose. The change is
            mostly cosmetic but agonising: 4 points of damage (a serious injury
            for a PC). Improving, or at least not worsening, its looks takes a
            full minute and a difficulty 6 Intellect-based roll. Action (or
            action to initiate).
        tier: 4
        position:
          x: 1
          'y': null
      - id: t4-unholy-hunger
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.a3c3bbc0e5a68193
        abilitySnapshot:
          name: Unholy Hunger
          description: >-
            A creature of level 4 or lower that you touch bites into its own
            flesh, taking 3 points of damage, and 3 more each round you keep
            making successful rolls against it. You must use your action each
            round to concentrate. Each extra level of Effort raises the maximum
            target level by 1. Action to initiate.
        tier: 4
        position:
          x: 2
          'y': null
