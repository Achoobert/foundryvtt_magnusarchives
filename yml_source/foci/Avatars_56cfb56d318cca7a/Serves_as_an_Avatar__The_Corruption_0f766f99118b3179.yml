      - id: t4-crawling-corruption
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.b14663d80c3ba2b5
        abilitySnapshot:
          name: Crawling Corruption
          description: >-
            Insects associated with rot burst from a creature's body where you
            touch it. It suffers a serious injury (6 points of damage for an
            NPC).
        tier: 4
        position:
          x: 0
          'y': null
      - id: t4-touch-of-decay
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.518a64a83d2d3554
        abilitySnapshot:
          name: Touch of Decay
          description: >-
            An object no larger than you that you touch decays as if five
            hundred years passed at once: wood and cloth crumble, metal
            corrodes, stone weathers a little. A living creature you touch
            suffers a serious injury (6 points of damage for an NPC).
        tier: 4
        position:
          x: 1
          'y': null
      - id: t4-vile-fondness
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.a57efde17784fb01
        abilitySnapshot:
          name: Vile Fondness
          description: >-
            A creature you touch becomes drawn to something most find vile, like
            an infectious disease ward or a toxic former lover. They seek it out
            as soon as their circumstances reasonably allow, and stay infatuated
            for about a day or until the fondness causes them a serious
            consequence.
        tier: 4
        position:
          x: 2
          'y': null
