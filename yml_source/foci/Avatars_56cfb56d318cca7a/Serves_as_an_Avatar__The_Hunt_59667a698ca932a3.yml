      - id: t4-hairy-on-the-inside
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.0b725cb0c68da494
        abilitySnapshot:
          name: Hairy on the Inside
          description: >-
            For ten minutes you become more beast-like: +8 to your Might Pool,
            +1 Might Edge, +2 to your Speed Pool and +1 Speed Edge. Meanwhile
            you can't spend Intellect points except to try to change back early
            (a difficulty 2 task). Action to change; action to change back.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t4-hunting-scream
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.c3e02a7c14a79119
        abilitySnapshot:
          name: Hunting Scream
          description: >-
            Up to three targets within long range who hear your scream, whistle
            or song and whom you successfully attack are terrified for two
            rounds, freezing or fleeing as fast as they can (your choice).
        tier: 4
        position:
