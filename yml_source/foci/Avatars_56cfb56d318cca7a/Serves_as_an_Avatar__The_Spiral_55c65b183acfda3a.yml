        abilitySnapshot:
          name: Sense Avatar
          description: >-
            You can tell another Avatar is one if you can perceive them normally
            and are nearby, usually with no roll or action. An Avatar can try to
            hide what they are, but you can still spend an action on an
            Intellect-based task to identify them.
        tier: 1
        position:
          x: 0
          'y': null
      - id: t1-sense-supernatural-activity
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.2155ece099f298bc
        abilitySnapshot:
          name: Sense Supernatural Activity
          description: >-
            You sense the presence of any supernatural creature, artefact, book
            or effect within immediate range.
        tier: 1
        position:
          x: 1
          'y': null
      - id: t4-door-to-elsewhere
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.15ecc1e8cd16446c
        abilitySnapshot:
          name: Door to Elsewhere
          description: >-
            A door appears within immediate range and another at a place you
            know about. They last one minute or until you step through as
            another action. If no door forms, the place may be protected, too
            little known to you, or gone.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t4-inverted-world
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.e47e715a44b94694
        abilitySnapshot:
          name: Inverted World
          description: >-
            For one minute (six rounds) you control every sense of a creature
            you touch. If what you show them is hindering or distracting, their
            actions are hindered; otherwise you can make them experience horrors
            for 1 point of Stress per round (1 point of damage for an NPC).
        tier: 4
        position:
          x: 1
          'y': null
      - id: t4-send-to-the-maze
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.63ab7cc22ffc07f9
        abilitySnapshot:
          name: Send to the Maze
          description: >-
            A creature of level 3 or lower that you touch is banished into The
            Spiral's realm, taking 3 points of damage, and 3 more each round you
            keep making successful rolls against it. You must use your action
            each round to concentrate. Each extra level of Effort raises the
            maximum target level by 1. When it ends, the target reappears where
            it vanished or somewhere you've met it before.
        tier: 4
        position:
          x: 2
          'y': null
