name: Never Says Die
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: never-says-die
  description: >-
    <p>When others give up, you're only getting started. Resilience and stubborn
    determination carry you through. You don't fuss over your appearance and
    you're not much of a talker. You act.</p><p><strong>Connection:</strong>
    Choose one of the following with your group.</p><ol><li><p>You feel an
    overwhelming need to impress another PC, and you're not sure
    why.</p></li><li><p>Another PC is capable but needs motivating, and you keep
    urging them to keep going.</p></li><li><p>You feel protective of another PC
    and don't want to see them hurt.</p></li><li><p>Another PC says they've
    known you for years, but you barely remember
    them.</p></li></ol><p><strong>Minor Effect Suggestion:</strong> You restore
    2 points to your Might Pool.</p><p><strong>Major Effect Suggestion:</strong>
    Your next action is eased by two steps.</p><p><strong>GM
    Intrusions:</strong> Sometimes it's your equipment or weapons that give
    out.</p><p><strong>Abilities by tier:</strong></p><ul><li><p><strong>Tier
    1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.b9ad37b8ca830ddf]{Improved
    Recovery},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.7c2be6d145440f5d]{Push
    on Through}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.8ecd619162a2e17d]{Tough}</p></li><li><p><strong>Tier
    3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.6530d8ea3e1d3984]{Stand
    Like Iron} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.17e83b9807bc5109]{Hidden
    Reserves}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.59d974bf1cabfd75]{Outlast
    the Foe}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.921146801407b0dc]{Not
    Dead Yet}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.5e55bf90ffc56428]{Final
    Defiance} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.6565702f22c8e50f]{Ignore
    Affliction}.</p></li></ul>
