    nodes:
      - id: t1-improved-recovery
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.b9ad37b8ca830ddf
        abilitySnapshot:
          name: Improved Recovery
          description: >-
            Your ten-minute recovery roll takes one action instead, so your
            first two recovery rolls take one action each, the third one hour
            and the fourth ten hours.
        tier: 1
        position:
          x: 0
          'y': null
      - id: t1-push-on-through
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.7c2be6d145440f5d
        abilitySnapshot:
          name: Push on Through
          description: For one hour you ignore the effects of terrain while moving.
        tier: 1
        position:
          x: 1
          'y': null
      - id: t2-tough
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.8ecd619162a2e17d
        abilitySnapshot:
          name: Tough
          description: >-
            You gain an extra step on your damage track, called hurt, between
            hale and impaired. Hurt has no other effect; you're sore and bruised
            but fine.
        tier: 2
        position:
          x: 0
          'y': null
      - id: t3-stand-like-iron
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.6530d8ea3e1d3984
        abilitySnapshot:
          name: Stand Like Iron
          description: >-
            The next attack this encounter that would give you a serious injury
            gives you 2 points of Stress instead.
        tier: 3
        position:
          x: 0
          'y': null
      - id: t3-hidden-reserves
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.17e83b9807bc5109
        abilitySnapshot:
          name: Hidden Reserves
          description: >-
            When you make a recovery roll, you also gain +1 to your Might Edge
            and your Speed Edge for the next ten minutes.
        tier: 3
        position:
          x: 1
          'y': null
      - id: t4-outlast-the-foe
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.59d974bf1cabfd75
        abilitySnapshot:
          name: Outlast the Foe
          description: >-
            After five full rounds of combat, you have an asset on all tasks for
            the rest of that combat and deal 1 extra point of damage per attack.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t5-not-dead-yet
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.921146801407b0dc
        abilitySnapshot:
          name: Not Dead Yet
          description: >-
            While debilitated, you can act as if you were only impaired. You're
            still one step from death.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t6-final-defiance
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.5e55bf90ffc56428
        abilitySnapshot:
          name: Final Defiance
          description: >-
            When you would die, you stay conscious and active, debilitated, for
            one more round, plus another round each time you succeed on a
            difficulty 5 Might task. If someone else succeeds on a difficulty 5
            healing task on you during that time, you survive, still
            debilitated. If you reach dead again while in this state, you can't
            be saved.
        tier: 6
        position:
          x: 0
          'y': null
      - id: t6-ignore-affliction
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.6565702f22c8e50f
        abilitySnapshot:
          name: Ignore Affliction
          description: >-
            Ignore an unwanted condition or affliction (disease, paralysis, mind
            control, a broken limb and so on, but not Stress or the damage
            track) and act as if it doesn't affect you for one hour. A condition
            that would last less than an hour is negated entirely.
        tier: 6
        position:
          x: 1
          'y': null
