        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.8a97b3af2d216f7f
        abilitySnapshot:
          name: Hard-Won Resilience
          description: >-
            Exposure to terrible things has toughened you. Reduce any Stress you
            gain, from any source, by 1 point.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t5-dark-explorer
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.4d30c3af0857106a
        abilitySnapshot:
          name: Dark Explorer
          description: >-
            You ignore penalties for any action, including fighting, in very dim
            light or cramped spaces. With Eyes Adjusted, that holds even in
            total darkness. You're trained in stealth tasks while in dim light
            or none.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t6-blinding-attack
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.519151d6f159967e
        abilitySnapshot:
          name: Blinding Attack
          description: >-
            Using a light source, you make a melee attack. It deals no damage,
            but if it hits, the target is blinded for one minute.
        tier: 6
        position:
          x: 0
          'y': null
      - id: t6-dark-flow
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.441d7c0b205fb29a
        abilitySnapshot:
          name: Dark Flow
          description: >-
            For one hour you're immersed in working in the dark. When you apply
            a level of Effort to stealth, lockpicking, endurance or perception
            tasks in dim light or darkness, you get two free levels of Effort on
            that task. Action to initiate.
        tier: 6
        position:
          x: 1
          'y': null
