name: Runs Away
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: runs-away
  description: >-
    <p>Running isn't always your answer, but it's your first instinct, and it
    has saved you more than once. Caution is an art form to you. Once you've
    judged a threat from somewhere safe, you'll deal with it. You're no coward;
    you just choose when to engage. You wear comfortable, neutral clothes you
    can run and hide in.</p><p><strong>Connection:</strong> Choose one of the
    following with your group.</p><ol><li><p>While fleeing a threat, you left
    another PC to fend for themselves. They barely survived. Their player
    decides whether they resent or forgive you.</p></li><li><p>Another PC
    recently put you in danger, by accident or not. You're fine now, but wary of
    them.</p></li><li><p>Another PC seems even more nervous than you about
    something. You'd like to teach them your measured approach to
    fear.</p></li><li><p>Another PC doubts your caution is thoughtful and laughs
    when you explain it. They may have called you a
    coward.</p></li></ol><p><strong>Additional Equipment:</strong> A pair of
    running shoes that fit perfectly.</p><p><strong>Minor Effect
    Suggestion:</strong> You can attempt a stealth task any time before the end
    of next round.</p><p><strong>Major Effect Suggestion:</strong> You take an
    extra action, used only to move a short distance, attempt a stealth action,
    or move an immediate distance and attempt a stealth action.</p><p><strong>GM
    Intrusions:</strong> Quick movements lead to dropped items, slips on uneven
    ground or wrong turns.</p><p><strong>Abilities by
    tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.339b928115fd9611]{Go
    Defensive}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.b52540ae74938277]{Enhanced
    Speed},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.01d880cc253a6bea]{Quick
    to Flee}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.cb8d5012171a2016]{Incredible
    Running Speed} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.ada9fb67a51f974d]{Greater
    Enhanced Speed}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.0b5dfb12c738e3a0]{Increasing
    Determination},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.aac86d412cc547f3]{Quick
    Wits}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.59fb968f1bfbb416]{Go to
    Ground}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.6b1007abbc0cba5f]{Burst
    of Escape} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.4844f30e2d8765f8]{Skill
    With Defense}.</p></li></ul>
