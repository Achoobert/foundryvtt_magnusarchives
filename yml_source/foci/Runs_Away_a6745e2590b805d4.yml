        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.339b928115fd9611
        abilitySnapshot:
          name: Go Defensive
          description: >-
            In combat, you can enter a state of heightened alertness whenever
            you like. While in it you can't use Intellect points, but you gain
            +1 to your Speed Edge and two assets on Speed defense tasks. It
            lasts until you choose to end it, you attack a foe, or no combat is
            going on within range of your senses. After it ends, you can't use
            it again until you've made a recovery roll.
        tier: 1
