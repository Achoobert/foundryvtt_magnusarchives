name: Moves Like a Cat
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: moves-like-a-cat
  description: >-
    <p>You have uncanny balance and coordination. You move with grace, rarely
    knock anything over, land well when you fall and often avoid danger
    altogether. You wear close-fitting clothes and carry
    little.</p><p><strong>Connection:</strong> Choose one of the following with
    your group.</p><ol><li><p>Another PC's clumsiness and noise annoy
    you.</p></li><li><p>Another PC comes from the same place as you, and you
    knew each other as children.</p></li><li><p>You help another PC with advice
    and a steadying hand. When you're next to each other, their
    @UUID[Compendium.magnusarchives.skills.Item.DbWx19J2Bkv12OpZ]{gymnastics}
    tasks are eased.</p></li><li><p>Another PC owes you a lot of
    money.</p></li></ol><p><strong>Minor Effect Suggestion:</strong> You restore
    2 points to your Speed Pool.</p><p><strong>Major Effect Suggestion:</strong>
    You can take a second action this round.</p><p><strong>GM
    Intrusions:</strong> Even a cat can be clumsy. A jump is harder than it
    looks, or an escape move overshoots straight into
    danger.</p><p><strong>Abilities by tier:</strong></p><ul><li><p><strong>Tier
    1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.2f26e25349dd07e3]{Greater
    Enhanced Speed},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.84a6fccadbab9b04]{Balance}</p></li><li><p><strong>Tier
    2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.43c26f0099f9401c]{Grit},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.01fde00541ee42e5]{Safe
    Fall}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.2ac539dbb5fdef49]{Enhanced
    Speed Edge} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.2f26e25349dd07e3]{Greater
    Enhanced Speed}. Either way, you also gain
    @UUID[Compendium.magnusarchives.focus-abilities.Item.09a7344d7cf1d5d9]{Hard
    to Hit}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.97f7d56a7ff22af8]{Quick
    Strike}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.38062e924fda82cb]{Slippery}</p></li><li><p><strong>Tier
    6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.70050201e32563fd]{Perfect
    Speed Burst} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.2f26e25349dd07e3]{Greater
    Enhanced Speed}.</p></li></ul>
