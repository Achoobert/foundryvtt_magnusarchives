_id: edb9b0a622fe37a9
name: Helps Their Friends
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: helps-their-friends
  description: >-
    <p>Helping your friends with small things and big ones is simply who you
    are. Maybe you always had friends, maybe you never did until now, or maybe
    you lost them and want another chance. When a friend needs a hand, you offer
    it without thinking.</p><p><strong>Connection:</strong> Choose one of the
    following with your group.</p><ol><li><p>The first time you saw a friend in
    trouble, you didn't help. You suspect another PC (that friend) doesn't know,
    and you're thinking of telling them.</p></li><li><p>You helped another PC
    with something mildly illegal. You feel guilty, and a little angry at them,
    though it was your choice.</p></li><li><p>Another PC has always been there
    for you when you couldn't help yourself.</p></li><li><p>You and another PC
    tried to help a mutual friend and failed. That friend is gone now, and you
    feel it's your fault. You don't know if they blame
    you.</p></li></ol><p><strong>Additional Equipment:</strong> A photo of you
    and your friends.</p><p><strong>Optional:</strong> You can swap one ability
    from your type for Advice From a Friend.
    @UUID[Compendium.magnusarchives.focus-abilities.Item.aeba27869b0a6672]{Advice
    From a Friend}.</p><p><strong>Minor Effect Suggestion:</strong> Your
    coaching eases a friend's next action.</p><p><strong>Major Effect
    Suggestion:</strong> Your help gives a friend a free recovery roll that
    takes no action.</p><p><strong>GM Intrusions:</strong> Others sometimes have
    hidden motives. The law takes too much interest. Even when everything goes
    right, there are repercussions.</p><p><strong>Abilities by
    tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.733aaa700fffe462]{Friendly
    Help},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.6d3ded424a064085]{Courageous}</p></li><li><p><strong>Tier
    2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.9f502919c33401a2]{Weather
    the Vicissitudes}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.9c5f3ea54132c617]{Buddy
    System} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.ef373524cb87ea89]{Skill
    With Attacks}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.90b4ceb3883f2456]{In
    Harm's Way},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.f19fdab1e8bdffe5]{Enhanced
    Physique}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.341d1b80a54ca67d]{Inspire
    Action}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.7f27c6deedf006ec]{Deep
    Consideration} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.71856f93044add01]{Skill
    With Defense}.</p></li></ul>
