    nodes:
      - id: t1-friendly-help
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.733aaa700fffe462
        abilitySnapshot:
          name: Friendly Help
          description: >-
            If a friend fails a task and you help, they can retry it without
            spending Effort for the retry. This works even if you're not trained
            in the task.
        tier: 1
        position:
          x: 0
          'y': null
      - id: t1-courageous
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.6d3ded424a064085
        abilitySnapshot:
          name: Courageous
          description: You're trained in Intellect defense and initiative tasks.
        tier: 1
        position:
          x: 1
          'y': null
      - id: t2-weather-the-vicissitudes
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.9f502919c33401a2
        abilitySnapshot:
          name: Weather the Vicissitudes
          description: >-
            Ignore the first point of Stress you gain each day. This resets
            after your ten-hour rest.
        tier: 2
        position:
          x: 0
          'y': null
      - id: t3-buddy-system
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.9c5f3ea54132c617
        abilitySnapshot:
          name: Buddy System
          description: >-
            Pick a character next to you to be your buddy for ten minutes.
            You're trained in all tasks to find, heal, interact with or protect
            them, and while you stand next to each other you both have an asset
            on Speed defense tasks. You can have only one buddy at a time.
            Action to initiate.
        tier: 3
        position:
          x: 0
          'y': null
      - id: t3-skill-with-attacks
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.ef373524cb87ea89
        abilitySnapshot:
          name: Skill With Attacks
          description: >-
            Pick one attack type you aren't trained in: light, medium or heavy,
            each bashing, bladed or ranged. You become trained in attacks with
            that type of weapon. You can take this ability more than once,
            choosing a different attack type each time.
        tier: 3
        position:
          x: 1
          'y': null
      - id: t4-in-harms-way
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.90b4ceb3883f2456
        abilitySnapshot:
          name: In Harm's Way
          description: >-
            When you spend your action putting your friends first, defense tasks
            are eased for any adjacent characters you choose until the end of
            your next turn. During that time, if one of those friends gains
            Stress you can take up to half of it (rounded up) instead, and if
            one would suffer a serious injury you can take it instead, as long
            as you're not already impaired or debilitated.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t4-enhanced-physique
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.f19fdab1e8bdffe5
        abilitySnapshot:
          name: Enhanced Physique
          description: >-
            Gain 3 points to split between your Might and Speed Pools however
            you like.
        tier: 4
        position:
          x: 1
          'y': null
      - id: t5-inspire-action
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.341d1b80a54ca67d
        abilitySnapshot:
          name: Inspire Action
          description: >-
            Tell one ally who can see and understand you to take an action. If
            they take exactly that action, they do it immediately as an extra
            action, and it doesn't use up their normal action on their turn.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t6-deep-consideration
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.7f27c6deedf006ec
        abilitySnapshot:
          name: Deep Consideration
          description: >-
            When you plan with your friends to reach a goal together, ask the GM
            one very general question about how the plan is likely to go and get
            a short answer. Each of you also gains an asset on one roll that
            carries out the plan, if you act on it within a few days.
        tier: 6
        position:
          x: 0
          'y': null
      - id: t6-skill-with-defense
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.71856f93044add01
        abilitySnapshot:
          name: Skill With Defense
          description: >-
            Pick one defense task you aren't trained in: Might defense, Speed
            defense or Intellect defense. You become trained in it.
        tier: 6
        position:
          x: 1
          'y': null
