name: Needs No Weapon
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: needs-no-weapon
  description: >-
    <p>You are the weapon. Punches, kicks and full-body moves let you hurt foes
    badly without draining yourself. You learned through training, the military
    or a rough upbringing, and you keep your body in top shape. You wear loose
    clothes and rarely carry anything but maybe knuckle or boot
    weapons.</p><p><strong>Connection:</strong> Choose one of the following with
    your group.</p><ol><li><p>Another PC thinks a real weapon is something you
    hold, and may look down on you.</p></li><li><p>Another PC is so unaware of
    their body that they keep getting in your way. If you miss and hit someone
    nearby by accident, it's likely them.</p></li><li><p>You once trained with a
    close friend of another PC, and you owe that friend a great
    deal.</p></li><li><p>Two other PCs asked to become your students, but only
    one shows any talent.</p></li></ol><p><strong>Minor Effect
    Suggestion:</strong> You trip the target and knock it
    prone.</p><p><strong>Major Effect Suggestion:</strong> You strike a limb,
    making it useless for the next minute.</p><p><strong>GM Intrusions:</strong>
    Hitting some foes hurts you as much as them. Armed opponents have longer
    reach. Complicated moves can throw you off balance.</p><p><strong>Abilities
    by tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.665c70188f828820]{Fists
    of Fury},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.3a519343c3cba70e]{Scarred
    and Hardened}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.008069c90d155613]{Advantage
    to Disadvantage},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.17aa16b31801e8ca]{Unarmed
    Fighting Style}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.04e62e868433ad5d]{Moving
    Like Water} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.8d97774f6ea80bd6]{Greater
    Enhanced Potential}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.1d9fb9c8410e5153]{Stand
    Like Iron}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.2ccd5f6b5d80f155]{Stun
    Attack}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.f70ca63d0f475330]{Master
    of Unarmed Fighting Style} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.81920ca524e8a45d]{Lethal
    Damage}.</p></li></ul>
