      - id: t3-you-studied
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.23de1c4ccf683536
        abilitySnapshot:
          name: You Studied
          description: >-
            You're trained in two areas of knowledge of your choice (not
            physical or combat skills), or specialized in one.
        tier: 3
        position:
          x: 0
          'y': null
      - id: t3-skill-with-attacks
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.59b7dca327310ed1
        abilitySnapshot:
          name: Skill With Attacks
          description: >-
            Pick one attack type you aren't trained in: light, medium or heavy,
            each bashing, bladed or ranged. You become trained in attacks with
            that type of weapon. You can take this ability more than once,
            choosing a different attack type each time.
        tier: 3
        position:
          x: 1
          'y': null
      - id: t4-draw-conclusion
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.4669e65e63ae1f8e
        abilitySnapshot:
          name: Draw Conclusion
          description: >-
            After a few minutes of careful observation and investigation
            (questioning NPCs, searching a room or file), a difficulty 3
            Intellect task teaches you a pertinent fact. Each further use is
            hindered by an extra step, until you rest for ten hours and the
            difficulty resets to 3.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t5-defuse-situation
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.c818f3f232a19d97
        abilitySnapshot:
          name: Defuse Situation
          description: >-
            When questioning provokes anger or violence, you deflect with
            distraction or evasion. On a successful Intellect attack, a living
            foe can't attack anyone or anything for one round.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t6-seize-the-initiative
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.9dffc1771b3c42f7
        abilitySnapshot:
          name: Seize the Initiative
          description: >-
            Within one minute of successfully using Draw Conclusion, you can
            take one extra, immediate action, even out of turn. You can't use
            this again until you've rested for ten hours.
        tier: 6
        position:
          x: 0
          'y': null
      - id: t6-greater-skill-with-defense
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.1d50b67524cd04a6
        abilitySnapshot:
          name: Greater Skill With Defense
          description: >-
            Pick one defense task (Might, Speed or Intellect), even one you're
            trained in. You become trained in it, or specialized if you were
            already trained. You can take this up to three times, picking a
            different defense each time.
        tier: 6
        position:
          x: 1
          'y': null
