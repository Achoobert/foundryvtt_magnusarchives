name: Solves Mysteries
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: solves-mysteries
  description: >-
    <p>You're a master of deduction. A sharp eye and quick wit let you piece
    clues together while others are stumped. You might be a detective, but a
    professor or scientist fits too. You dress practically with a touch of
    style, maybe carrying a briefcase of
    tools.</p><p><strong>Connection:</strong> Choose one of the following with
    your group.</p><ol><li><p>Another PC is the friend who got you reading
    detective fiction, which became your obsession.</p></li><li><p>Another PC
    doesn't seem to trust or like you, and you feel you must win them
    over.</p></li><li><p>Another PC is a great sounding board. After an hour
    talking with them, you gain an asset on any knowledge-based task you're
    trained in.</p></li><li><p>You and another PC were rivals in some past
    endeavour.</p></li></ol><p><strong>Minor Effect Suggestion:</strong> You
    find an additional clue about the mystery you're working
    on.</p><p><strong>Major Effect Suggestion:</strong> When you reveal a
    solution in front of its subject, they're stunned by your brilliance and
    can't move or act for a round.</p><p><strong>GM Intrusions:</strong>
    Evidence disappears, red herrings confuse, witnesses lie, and early research
    is wrong.</p><p><strong>Abilities by
    tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.3ad216ea0f7655b3]{Investigate},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.c2a3d1edacabc904]{Sleuth}</p></li><li><p><strong>Tier
    2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.b5d8edbc3c2d5b64]{Out
    of Harm's Way}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.23de1c4ccf683536]{You
    Studied} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.59b7dca327310ed1]{Skill
    With Attacks}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.4669e65e63ae1f8e]{Draw
    Conclusion}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.c818f3f232a19d97]{Defuse
    Situation}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.9dffc1771b3c42f7]{Seize
    the Initiative} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.1d50b67524cd04a6]{Greater
    Skill With Defense}.</p></li></ul>
