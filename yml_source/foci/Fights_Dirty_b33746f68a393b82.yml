name: Fights Dirty
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: fights-dirty
  description: >-
    <p>The only thing that matters in a fight is who wins. You bite, trip, throw
    dirt, taunt and lie, and you keep a few nasty surprises hidden on you: a
    blade in a boot, a razor in a hem, powder in a secret
    pocket.</p><p><strong>Connection:</strong> Choose one of the following with
    your group.</p><ol><li><p>Another PC is good in a fight, and a few of your
    tricks would make them great.</p></li><li><p>Another PC taught you some of
    your tricks.</p></li><li><p>Another PC doesn't seem to approve of your
    methods.</p></li><li><p>You beat another PC in a fight long ago, using your
    tactics. They want a friendly rematch and say they're ready for
    you.</p></li></ol><p><strong>Additional Equipment:</strong> An easily hidden
    weapon and one dose of level 3 poison that inflicts 6 points of
    damage.</p><p><strong>Minor Effect Suggestion:</strong> Your foe trips and
    falls prone.</p><p><strong>Major Effect Suggestion:</strong> You tangle the
    foe's legs. They fall and lose their next turn.</p><p><strong>GM
    Intrusions:</strong> People think poorly of cheats. Sometimes a dirty trick
    backfires.</p><p><strong>Abilities by
    tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.19e254bec4853e5d]{Taking
    Advantage}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.1fec08041be818f2]{Eye
    Gouge}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.165de0e266fc09fe]{Spot
    Weakness} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.a9ccff49eb5dca7a]{Surprise
    Attack}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.a5845015e6b98a75]{Mind
    Games},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.3f31c348a8c54450]{Capable
    Fighter}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.efb3b8b3b29413dd]{Using
    the Environment}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.65d3a790b610d92d]{Twisting
    the Knife} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.7c11e1b124690ed0]{Murderer}.</p></li></ul>
