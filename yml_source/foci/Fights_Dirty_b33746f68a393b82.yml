    nodes:
      - id: t1-taking-advantage
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.19e254bec4853e5d
        abilitySnapshot:
          name: Taking Advantage
          description: >-
            When a foe is prone, weakened, dazed, stunned, moved down the damage
            track or otherwise at a disadvantage, your attacks against it are
            eased, on top of any other modifiers from that disadvantage.
        tier: 1
        position:
          x: 0
          'y': null
      - id: t2-eye-gouge
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.1fec08041be818f2
        abilitySnapshot:
          name: Eye Gouge
          description: >-
            You attack a creature that has an eye. The attack is hindered, but
            on a hit the creature struggles to see for the next hour, and its
            tasks that rely on sight (most of them) are hindered.
        tier: 2
        position:
          x: 0
          'y': null
      - id: t3-spot-weakness
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.165de0e266fc09fe
        abilitySnapshot:
          name: Spot Weakness
          description: >-
            If a creature you can see has a special weakness, such as a
            vulnerability to fire or a poor perception, you know it. Ask and the
            GM tells you.
        tier: 3
        position:
          x: 0
          'y': null
      - id: t3-surprise-attack
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.a9ccff49eb5dca7a
        abilitySnapshot:
          name: Surprise Attack
          description: >-
            When you attack from hiding, with surprise, or before your opponent
            has acted, you gain an asset on the attack and deal 2 extra points
            of damage on a hit.
        tier: 3
        position:
          x: 1
          'y': null
      - id: t4-mind-games
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.a5845015e6b98a75
        abilitySnapshot:
          name: Mind Games
          description: >-
            You hit a foe that understands you with lies, mockery or vile
            language. On a success it is stunned and can't act for one round,
            then dazed the following round, with its tasks hindered.
        tier: 4
        position:
          x: 0
          'y': null
      - id: t4-capable-fighter
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.3f31c348a8c54450
        abilitySnapshot:
          name: Capable Fighter
          description: Your attacks deal 1 extra point of damage.
        tier: 4
        position:
          x: 1
          'y': null
      - id: t5-using-the-environment
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.efb3b8b3b29413dd
        abilitySnapshot:
          name: Using the Environment
          description: >-
            You turn your surroundings to your advantage. For ten minutes, your
            attack rolls and Speed defense rolls are eased. Action to initiate.
        tier: 5
        position:
          x: 0
          'y': null
      - id: t6-twisting-the-knife
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.65d3a790b610d92d
        abilitySnapshot:
          name: Twisting the Knife
          description: >-
            In a round after you hit a foe with a melee weapon, you can
            automatically deal that weapon's standard damage to it again, with
            no modifiers: 2 points for a light weapon, 4 for medium, 6 for
            heavy.
        tier: 6
        position:
          x: 0
          'y': null
      - id: t6-murderer
        abilityUuid: Compendium.magnusarchives.focus-abilities.Item.7c11e1b124690ed0
        abilitySnapshot:
          name: Murderer
          description: >-
            A sudden strike to a vital spot kills a target of level 4 or lower
            outright. Each extra level of Effort raises the maximum target level
            by 1.
        tier: 6
        position:
          x: 1
          'y': null
