name: Learns Quickly
type: focus
img: systems/magnusarchives/assets/icons/magnusfocus.webp
system:
  schemaVersion: 1
  slug: learns-quickly
  description: >-
    <p>You don't have your dream job, but you get by. Events may have pushed you
    here, or your break just hasn't come yet. You work hard, handle trouble as
    it comes and pick things up fast. You dress to blend in, because standing
    out draws the wrong attention.</p><p><strong>Connection:</strong> Choose one
    of the following with your group.</p><ol><li><p>Another PC helped you land
    your current job.</p></li><li><p>Through no fault of their own, another PC
    got you fired from your last job.</p></li><li><p>Another PC is your
    cousin.</p></li><li><p>You're fairly sure another PC hates you, though you
    don't know why.</p></li></ol><p><strong>Additional Equipment:</strong> Two
    tickets to a show at a local cinema.</p><p><strong>Minor Effect
    Suggestion:</strong> Your next task, attack or defense roll within one
    minute is eased.</p><p><strong>Major Effect Suggestion:</strong> Treat your
    next task, attack or defense roll within one minute as a natural
    18.</p><p><strong>GM Intrusions:</strong> Accidents and mistakes are great
    teachers.</p><p><strong>Abilities by
    tier:</strong></p><ul><li><p><strong>Tier 1:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.de0f872612d2735b]{Enhanced
    Intellect},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.20d7cf2e29919e17]{Picked
    Up a Few Things}</p></li><li><p><strong>Tier 2:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.490a0233e825dfe5]{Quick
    Study}</p></li><li><p><strong>Tier 3:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.3dea4b4e79974cc6]{Enhanced
    Intellect Edge} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.f573d22d877760cc]{Flex
    Skill}. Either way, you also gain
    @UUID[Compendium.magnusarchives.focus-abilities.Item.1eca5da328efaa0d]{Hard
    to Distract}.</p></li><li><p><strong>Tier 4:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.56006ee2b86bf474]{Pay
    It Forward}</p></li><li><p><strong>Tier 5:</strong>
    @UUID[Compendium.magnusarchives.focus-abilities.Item.de0f872612d2735b]{Enhanced
    Intellect},
    @UUID[Compendium.magnusarchives.focus-abilities.Item.5e627109d9f33691]{Learned
    a Few Things}</p></li><li><p><strong>Tier 6:</strong> Choose
    @UUID[Compendium.magnusarchives.focus-abilities.Item.d2e084e19ba616be]{Two
    Things at Once} or
    @UUID[Compendium.magnusarchives.focus-abilities.Item.048954c5a7324f64]{Skill
    With Defense}.</p></li></ul>
