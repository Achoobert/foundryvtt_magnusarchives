  slug: avatar-the-spiral-send-to-the-maze
  description: >-
    <p><strong>Cost:</strong> 4+ Intellect points and 3 Stress.</p><p>A creature
    of level 3 or lower that you touch is banished into The Spiral's realm,
    taking 3 points of damage, and 3 more each round you keep making successful
    rolls against it. You must use your action each round to concentrate. Each
    extra level of Effort raises the maximum target level by 1. When it ends,
    the target reappears where it vanished or somewhere you've met it
    before.</p><p>Action.</p><p><em>Supernatural ability.</em></p>
