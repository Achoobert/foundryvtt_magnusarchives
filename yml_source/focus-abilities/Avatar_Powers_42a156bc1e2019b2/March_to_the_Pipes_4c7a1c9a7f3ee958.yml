  slug: avatar-the-slaughter-march-to-the-pipes
  description: >-
    <p><strong>Cost:</strong> 4+ Intellect points and 3 Stress.</p><p>You make
    music (whistling, singing, bagpipes) and up to five targets of level 3 or
    lower within long range march in a regimented way in the direction you
    choose, doing nothing else on their turn. They keep marching each round you
    keep making successful rolls; you must use your action each round to
    concentrate. Each extra level of Effort raises the maximum target level by
    1. Marching someone straight to their doom, such as off a cliff, takes one
    more successful roll. Action to
    initiate.</p><p>Action.</p><p><em>Supernatural ability.</em></p>
