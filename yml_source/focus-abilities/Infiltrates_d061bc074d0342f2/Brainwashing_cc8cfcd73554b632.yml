  slug: infiltrates-brainwashing
  description: >-
    <p><strong>Cost:</strong> 5+ Intellect points.</p><p>With trickery and
    smooth lies, you make a target of level 3 or lower do as you say. On a
    successful Intellect attack, you direct the actions of a target you speak to
    for one minute, letting them act freely or overriding them case by case, as
    long as you can see and direct them. If someone challenges what they're
    doing, you need another successful Intellect attack to reassure them or they
    stop. Each extra level of Effort can raise the target's maximum level by 1
    or add a minute. Action to initiate. The book advises handling this with
    care and never using it on PCs.</p><p>Action.</p>
