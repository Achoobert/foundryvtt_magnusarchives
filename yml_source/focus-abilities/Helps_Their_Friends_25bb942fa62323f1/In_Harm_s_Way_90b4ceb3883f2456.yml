  slug: helps-their-friends-in-harms-way
  description: >-
    <p><strong>Cost:</strong> 3 Might points.</p><p>When you spend your action
    putting your friends first, defense tasks are eased for any adjacent
    characters you choose until the end of your next turn. During that time, if
    one of those friends gains Stress you can take up to half of it (rounded up)
    instead, and if one would suffer a serious injury you can take it instead,
    as long as you're not already impaired or debilitated.</p><p>Enabler.</p>
