  description: >-
    <p><strong>Cost:</strong> 1 Intellect point.</p><p>In combat, you can enter
    a state of heightened alertness whenever you like. While in it you can't use
    Intellect points, but you gain +1 to your Speed Edge and two assets on
    @UUID[Compendium.magnusarchives.skills.Item.ce059fe6f2651325]{Speed defense}
