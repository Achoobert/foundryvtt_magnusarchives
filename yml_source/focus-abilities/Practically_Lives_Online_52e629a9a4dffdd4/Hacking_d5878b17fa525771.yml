  slug: practically-lives-online-hacking
  description: >-
    <p><strong>Cost:</strong> 3 Intellect points.</p><p>You can pose as someone
    else online, which might get you into their information, money or credit
    cards, or let you tip off the authorities about crimes they (probably
    didn't) commit. Less harmfully, you can learn about them: address, routine,
    current location. It takes from a minute to many hours, and the difficulty
    depends on the person's level and their online security; reading someone's
    email is harder than tracing their family history, and their bank account
    harder still.</p><p>Enabler.</p>
