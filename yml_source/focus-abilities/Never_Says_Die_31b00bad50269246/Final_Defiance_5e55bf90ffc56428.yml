  slug: never-says-die-final-defiance
  description: >-
    <p>When you would die, you stay conscious and active, debilitated, for one
    more round, plus another round each time you succeed on a difficulty 5 Might
    task. If someone else succeeds on a difficulty 5 healing task on you during
    that time, you survive, still debilitated. If you reach dead again while in
    this state, you can't be saved.</p><p>Enabler.</p>
