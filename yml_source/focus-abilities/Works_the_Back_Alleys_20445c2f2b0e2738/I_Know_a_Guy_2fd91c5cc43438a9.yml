  slug: works-the-back-alleys-i-know-a-guy
  description: >-
    <p><strong>Cost:</strong> 4 Intellect points.</p><p>Facing a difficult
    problem that isn't urgent, you reach someone you know, or know of, who might
    solve it. They're nearly always on the edges of society: criminals,
    ex-convicts and the like. Typical help includes fencing or buying illegal
    goods, forgeries and fake IDs, breaking into computers or phones, getting
    confidential information, or hiring criminals from burglars to hitmen.
    Finding them, meeting and agreeing terms usually takes three to seven days,
    and they expect payment or a favour.</p><p>Enabler.</p>
