  slug: wears-a-badge-command
  description: >-
    <p><strong>Cost:</strong> 3 Intellect points.</p><p>Using your authority as
    an officer, you give one simple command to a target within short range who
    can understand you. On a successful Intellect attack, they try to carry it
    out as their next action. The command can't directly harm them or their
    allies ("Flee" might work, "Stab yourself" won't) and must be a single
    action. They can still defend themselves and strike back if
    attacked.</p><p>Action.</p>
