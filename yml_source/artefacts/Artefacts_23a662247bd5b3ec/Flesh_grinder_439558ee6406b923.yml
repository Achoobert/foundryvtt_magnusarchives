  slug: flesh-grinder
  description: >-
    <p><strong>Level:</strong> 5</p><p><strong>Related Entity:</strong> The
    Flesh</p><p><strong>Stress:</strong> 3 on recognizing what it can do; 2 with
    each use.</p><p>A rusty antique iron meat grinder with a vise clamp and
    crank. While no one has claimed it, each new person who sees it must succeed
    on an Intellect defense roll or become fascinated and claim it.</p><p>Its
    claimant (or anyone who identifies it) can regrow a lost finger, hand, foot,
    arm or leg by feeding the stump into the funnel and cranking until a new
    limb emerges from the mince. The new tissue can be reattached with full use,
    or put to some other purpose.</p><p>Someone fascinated with the grinder must
    succeed on an Intellect defense roll each day or use it even when they have
    no need.</p><p><strong>Fear:</strong> The user can't stop themselves feeding
    another hand, foot or limb into the grinder, destroying the original.</p>
