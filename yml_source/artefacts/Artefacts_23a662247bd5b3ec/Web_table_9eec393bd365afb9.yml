  description: >-
    <p><strong>Level:</strong> 7</p><p><strong>Related Entity:</strong> The
    Web</p><p><strong>Stress:</strong> 1 on studying the table; 1 when using
    it.</p><p>A large dark-wood table carved with a hypnotic pattern that draws
    the eye to a small square recess at its center. Someone who knows about the
    Entities, such as a dabbler (p209), or who has identified the table, can
    make an Intellect-based attack against an Avatar or aspect of an Entity
    within short range. On a success the target is swallowed by the table, able
    to see and hear what happens around it but not act.</p><p>An Avatar or
    similarly powerful being can still remanifest, but can't stray more than
    very long range from the table, has all its tasks hindered by three steps,
    and can't harm the table itself.</p><p><strong>Fear:</strong> By accident,
    design or misunderstanding, the table is destroyed, freeing at least one
    bound Avatar or aspect, such as an angry NotThem (p230).</p>
