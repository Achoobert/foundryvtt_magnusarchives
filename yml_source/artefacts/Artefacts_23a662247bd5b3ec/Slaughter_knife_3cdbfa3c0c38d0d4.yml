  description: >-
    <p><strong>Level:</strong> 5</p><p><strong>Related Entity:</strong> The
    Slaughter</p><p><strong>Stress:</strong> 3 on acquiring the knife and
    realizing its power.</p><p>A rusted military trench knife (a light weapon,
    p100). Anyone who handles it directly must succeed on an Intellect defense
    roll or attack every living creature within short range with it. Each round
    they can make an Intellect defense roll to drop it and end the
    compulsion.</p><p><strong>Fear:</strong> The wielder turns the knife on
    themself and takes a serious injury, and keeps doing so each round until
    they drop it with an Intellect defense roll or an ally wrestles it away.</p>
