  slug: yushanka-chatbot
  description: >-
    <p><strong>Level:</strong> 4</p><p><strong>Related Entity:</strong> The
    Spiral and The Flesh</p><p><strong>Stress:</strong> 1 the first time the
    chat window is opened and used; 1 for every few hours of the video watched
    (seventeen hours in all); 1 each time the video starts playing on another
    screen near the victim.</p><p>A basic chatbot program, found in several
    digital forms such as a file named YushankasDespair.exe. A prompt is
    answered with a scrolling jumble of symbols in which words and phrases
    surface, until a video starts: a weeping man eating keyboard keys.</p><p>If
    the viewer shuts the computer down, the video moves to another nearby screen
    (even one switched off or unplugged), visible only to them, and follows them
    wherever they go with growing sounds and muttering. The haunting ends only
    when the viewer sits through all seventeen hours, however sick and dizzy it
    makes them.</p><p><strong>Fear:</strong> The viewer is compelled to eat
    their own keyboard; if they go through with it, they take a serious
    injury.</p>
