  description: >-
    <p><strong>Level:</strong> 4</p><p><strong>Related Entity:</strong> The
    Dark</p><p><strong>Stress:</strong> 3 on acquiring it and realizing no light
    can exist inside.</p><p>An ordinary-seeming oak wardrobe, except that no
    light reaches its interior, so everything stored inside must be found by
    touch.</p><p>After a couple of days, probably while the owner is away, it
    spawns a lightless beast (p224) that slithers off to menace the owner or
    someone they know. Later it may spawn another, this time waiting until
    someone is there to watch it emerge.</p><p><strong>Fear:</strong> The
    Sandman (p236) emerges instead of a lightless beast.</p>
