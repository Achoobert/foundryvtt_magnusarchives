  slug: web-tape-recorder
  description: >-
    <p><strong>Level:</strong> 1d6+2</p><p><strong>Related Entity:</strong> The
    Web</p><p><strong>Stress:</strong> 1 each time someone notices one that
    shouldn't be there, or it starts recording by itself.</p><p>These look and
    work like 1980s cassette recorders. Most people never notice anything odd,
    except that they capture statements of supernatural events (or the events
    themselves) with less distortion than digital recorders.</p><p>Once someone
    draws the attention of The Weaver or another powerful Avatar of The Web, the
    recorders begin creeping into their life, at first plausibly, later
    appearing from nowhere to record. The sending Avatar hears everything they
    record.</p><p><strong>Fear:</strong> Someone who realizes where the
    recorder's loyalty lies forgets the incident that revealed it.</p>
