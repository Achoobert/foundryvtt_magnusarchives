  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong> The
    Corruption</p><p><strong>Stress:</strong> 1 on recognizing it as a
    supernatural object; 3 on realizing its protection is gone after losing
    it.</p><p>A well-kept Victorian syringe in its own small case, said to have
    belonged to the physician John Snow. Whoever holds it eases their defense
    tasks against disease by three steps, and nearby manifestations of The
    Corruption (disease, paranormal rot, insect swarms and the like) are
    suppressed or hindered by three steps.</p><p><strong>Fear:</strong> The
    syringe is lost, sold or goes missing, and the owner draws the vengeful
    attention of The Corruption or one of its Avatars, such as The Plaguebearer
    (p233).</p>
