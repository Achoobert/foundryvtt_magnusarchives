  slug: camera-of-occultation
  description: >-
    <p><strong>Level:</strong> 8</p><p><strong>Related Entity:</strong> The
    Spiral</p><p><strong>Stress:</strong> 3 on recognizing what the camera can
    do; 1 for each week of using it.</p><p>An old camera with a cracked lens. It
    hides everything within very long range from being sensed by the Entities
    (The Spiral included) and their Avatars and aspects, and it blocks the
    active use of paranormal abilities in that
    area.</p><p><strong>Fear:</strong> The camera stores up the worry of a life
    in hiding. When it is taken or stolen, it releases all of it to feed The
    Spiral: the owner dies on a failed Intellect defense roll, and everyone in
    short range takes a serious injury on a failed Speed defense roll.</p>
