  slug: pestilent-scalpel
  description: >-
    <p><strong>Level:</strong> 5</p><p><strong>Related Entity:</strong> The
    Corruption</p><p><strong>Stress:</strong> 3 on acquiring it and realizing it
    can't be sterilized; 1 each time it is used to attack someone.</p><p>A
    corroded, pitted scalpel, usually kept in a sealed plastic box. Whenever
    it's exposed to air (and about once a day while it stays exposed), it sheds
    a new airborne disease. Everyone in immediate range must succeed on a Might
    defense roll or catch it (a level 5 disease) and immediately take 2 Stress.
    Each day the sick must succeed on a Might defense roll or take a serious
    injury; three successes and they shake it off.</p><p>It works as a light
    weapon (p100). Each hit gives the target another new disease on a failed
    Might defense roll.</p><p><strong>Fear:</strong> The sealed box holding the
    scalpel cracks, leaks or shatters.</p>
