  description: >-
    <p><strong>Level:</strong> 1d6+2</p><p><strong>Related Entity:</strong> The
    End</p><p><strong>Stress:</strong> 3 on acquiring one of the pieces and
    understanding how to use it; 1 for each game played with it.</p><p>A domino,
    die, chess piece or similar token carved from old bone. While a game using
    one is played, its players are wrapped in a bubble of timelessness; no time
    passes outside. The bubble collapses if a player tries to affect anyone or
    anything outside it, if anyone leaves, or if someone
    wins.</p><p><strong>Fear:</strong> Death (p210) takes an interest in one of
    the players.</p>
