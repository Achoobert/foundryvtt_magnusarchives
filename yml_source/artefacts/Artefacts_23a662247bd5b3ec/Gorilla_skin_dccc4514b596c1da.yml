  description: >-
    <p><strong>Level:</strong> 5</p><p><strong>Related Entity:</strong> The
    Stranger</p><p><strong>Stress:</strong> 1 on acquiring it and recognizing
    its significance; 1 with each use.</p><p>An ancient taxidermized gorilla
    hide. Worn like a cape, it makes the wearer appear as a stranger even to
    people who know them; not anyone in particular, just someone nobody knows.
    Where it matters, the wearer's stealth and disguise tasks are eased by three
    steps.</p><p>It can serve as the Unknowing ritual's "costume of special
    power or distinction" (p175).</p><p><strong>Fear:</strong> The wearer stops
    recognizing themself in the mirror, and their body sometimes acts as if it
    belongs to someone else, randomly hindering some tasks and easing
    others.</p>
