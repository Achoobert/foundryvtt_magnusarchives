  slug: blood-money-pouch
  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong> The
    Slaughter</p><p><strong>Stress:</strong> 3 on understanding how to use the
    pouch (or recognizing what a given coin, or the pouch, has been doing); 2
    with each use.</p><p>A leather pouch of 1888 Morgan silver dollars. Someone
    who is given one of the coins (as a gift, as payment, or slipped among their
    things) makes an Intellect defense roll each night they keep it. On a
    failure they sleepwalk and attempt something grisly (roll a d6
    below).</p><p>Each time someone calls the sleepwalker's name or tells them
    to stop, they get another Intellect defense roll; a success wakes them with
    no memory. Otherwise they finish the deed if they can and go back to bed,
    even if seriously wounded, and wake remembering nothing.</p><p>Giving the
    coin away spares the recipient further direct harm and passes the curse on.
    If a recipient dies, the coin returns to the pouch after a few days unless
    someone else claims it first.</p><ul><li><p>1: Tries to remove the face of
    the nearest living creature.</p></li><li><p>2: Stealthily waylays the
    nearest stranger and brings their tongue home to hide under the
    bed.</p></li><li><p>3: Tries to drain and drink the blood of the nearest
    living creature.</p></li><li><p>4: Tries to kill the nearest living creature
    and hang it up like game, perhaps cooking some of it.</p></li><li><p>5:
    Takes a vehicle and attempts a string of hit-and-runs.</p></li><li><p>6:
    Breaks every nearby mirror, collects the shards and "drinks" them, taking a
    serious injury.</p></li></ul><p><strong>Fear:</strong> The pouch's owner
    suffers as if they had been given a coin, until they give up the pouch.</p>
