  slug: patterned-rug
  description: >-
    <p><strong>Level:</strong> 5</p><p><strong>Related Entity:</strong> The
    Spiral</p><p><strong>Stress:</strong> 3 on recognizing the pattern as a
    personal threat; 3 on seeing the pattern attack someone else.</p><p>When
    this old rug is unrolled and its pattern of squares and diamonds is glanced
    at, an aspect of The Spiral (level 5, stealth as level 7; an immediate-range
    gaze attack dealing 3 Stress) forms from the design and looks back. If
    several people look, it fixes on the nearest; the rest see only a
    pattern.</p><p>Within three hours (perhaps at once) the aspect leaves the
    rug to hunt its chosen target. If it kills them, the pattern enters the
    corpse, which thrashes for about a minute and goes still. Within an hour, a
    deceitful arc (p211) blazing with the rug's pattern bursts from the body,
    burning it to ash, and escapes into the sky unless the rug binds
    it.</p><p><strong>Fear:</strong> Whatever holds the rug closed (container,
    strap or similar) fails, and it flops out and unrolls.</p>
