  slug: thrumming-cocoon
  description: >-
    <p><strong>Level:</strong> 5</p><p><strong>Related Entity:</strong> The
    Web</p><p><strong>Stress:</strong> 3 on seeing the cocoon and recognizing it
    as a threat; 1 when deliberately revealing it to someone else.</p><p>A
    silk-wrapped object usually kept in a steamer trunk. When first seen it
    begins to vibrate and thrum. The viewer (or whoever is nearest, if several
    see it) is frozen with horror on a failed Intellect defense roll as the silk
    falls away from an animate metal spider (level 5, health 20).</p><p>The
    spider hollows out and drinks the helpless victim, inflicting a serious
    injury every few rounds, unless others distract or destroy it. The victim
    can retry the Intellect defense roll each round to break free of their
    paralysis.</p><p><strong>Fear:</strong> The metal spider animates by itself
    and stealthily seeks out someone who saw it and survived, someone otherwise
    marked by The Web, or a random victim.</p>
