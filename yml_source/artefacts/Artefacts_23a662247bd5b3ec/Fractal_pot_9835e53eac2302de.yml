  slug: fractal-pot
  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong> The
    Spiral</p><p><strong>Stress:</strong> 3 on acquiring the pot and
    understanding how to use it (or realizing what it has been doing); 1 for
    each object it annuls.</p><p>A Ming-style ceramic pot painted with blue
    geometric lines that converge endlessly. Whoever first claims it must
    succeed on an Intellect defense roll; on a failure it starts erasing things
    they value, about one a day, so thoroughly that the objects never existed
    except in the owner's memory.</p><p>If the owner tries to destroy the pot,
    watches it closely for several hours, or gives it away after it has begun
    taking things, it spits everything back out. A round later, long pale
    fingers creep over the rim and an aspect of The Stranger (level 6) emerges,
    impossible to remember once someone looks away. It tries to drag the owner
    into the pot; enough force drives it back, otherwise the owner vanishes. An
    owner who flees is safe, and the pot can then be claimed by or sold to
    someone else.</p><p><strong>Fear:</strong> Someone the owner cares about is
    erased from existence.</p>
