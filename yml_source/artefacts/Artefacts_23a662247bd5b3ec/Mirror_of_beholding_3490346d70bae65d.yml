  description: >-
    <p><strong>Level:</strong> 1d6</p><p><strong>Related Entity:</strong> The
    Eye</p><p><strong>Stress:</strong> 2 on recognizing the mirror's horrible
    reflection; 1 when using it on someone else.</p><p>Anyone who sees their own
    reflection in this antique hand mirror also sees a huge staring face
    somewhere behind them. Whatever they do next, even smashing the mirror, they
    become the observed subject of a mirror haunt (p228) on a failed Intellect
    defense roll.</p><p><strong>Fear:</strong> Despite every precaution, an
    accident leaves the bearer (or someone nearby) looking at their own
    reflection in the mirror.</p>
