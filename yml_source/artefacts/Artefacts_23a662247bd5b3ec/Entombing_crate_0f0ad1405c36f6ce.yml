  slug: entombing-crate
  description: >-
    <p><strong>Level:</strong> 1d6</p><p><strong>Related Entity:</strong> The
    Buried</p><p><strong>Stress:</strong> 3 on realizing the threat the crate
    poses (and/or on being entombed).</p><p>Opening this old wooden crate while
    it's empty draws The Buried's attention to the opener for four days,
    wherever they go. If they stay awake for all 96 hours, nothing happens. If
    they doze off, they wake sealed inside the crate in total darkness, pressed
    in on every side by splintering wood.</p><p>One day passes outside for every
    four inside. A trapped victim can try a Might-based escape, hindered by two
    steps; each failure deals 1 Stress from splinters. They also take 1 Stress
    for each hour of confinement as the space shrinks. Otherwise they must wait
    for someone outside to open the crate. Anyone who dies in there isn't in the
    crate when it's next opened.</p><p><strong>Fear:</strong> A distraction or
    accident means the marked character falls asleep.</p>
