  slug: lonely-painting
  description: >-
    <p><strong>Level:</strong> 1d6</p><p><strong>Related Entity:</strong> The
    Lonely</p><p><strong>Stress:</strong> 3 on acquiring the painting and
    understanding its effect.</p><p>A drab landscape with no people, animals or
    action in it. After owning it for a few days, the owner is pulled into The
    Lonely on a failed Intellect defense roll, wandering alone through a muted,
    misted mirror of the painted scene. They take 1 Stress each hour they fail
    an Intellect defense roll, and can make an Intellect-based task each minute
    they search for a way out; on a success they reappear between a few yards
    and a few miles from where they vanished.</p><p><strong>Fear:</strong>
    However it was stored, covered or hidden, the painting is inexplicably back
    on full display.</p>
