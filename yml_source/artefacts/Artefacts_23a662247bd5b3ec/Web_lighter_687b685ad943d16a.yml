  description: >-
    <p><strong>Level:</strong> 1d6+3</p><p><strong>Related Entity:</strong> The
    Web</p><p><strong>Stress:</strong> 3 on realizing its true nature.</p><p>A
    gold flip lighter embossed with a spiderweb. It never runs out of fuel, and
    if lost or stolen it quietly turns up among its owner's things
    again.</p><p>The owner never consciously notices they carry it; if someone
    points it out, they change the subject on a failed Intellect defense roll.
    Yet it is always to hand when fire would only make things worse. Avatars of
    The Web, including The Weaver, can track its owner and manifest their power
    around them.</p><p><strong>Fear:</strong> Even when deliberately left behind
    it finds its way back. If destroyed, a new one is delivered.</p>
