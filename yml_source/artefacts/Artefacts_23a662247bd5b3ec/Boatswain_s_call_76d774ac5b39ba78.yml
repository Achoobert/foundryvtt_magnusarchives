  slug: boatswains-call
  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong> The
    Lonely</p><p><strong>Stress:</strong> 3 on acquiring the whistle and
    understanding how to use it; 1 with each use.</p><p>Blowing this tarnished
    brass nautical whistle raises heavy rolling fog about 3 miles (5 km) in
    radius for one hour. Visibility in the fog drops to immediate
    range.</p><p>Anyone alone in the fog (at least a long distance from everyone
    else) is banished into The Lonely on a failed Intellect defense roll: a
    muted, misted mirror of reality with no one else in it. They take 1 Stress
    each hour they fail an Intellect defense roll, and can make an
    Intellect-based task each minute they search for a way out. On a success
    they reappear somewhere between a few yards and a few miles from where they
    vanished.</p><p><strong>Fear:</strong> The user loses track of their allies
    and risks ending up alone in the fog.</p>
