  description: >-
    <p><strong>Level:</strong> 4</p><p><strong>Related Entity:</strong> The
    Web</p><p><strong>Stress:</strong> 1 the first time the novella is read; 1
    on realizing spiders are drawn to the book.</p><p>A thin hardcover novella
    about spiders, from ordinary to house-sized, eating everyone in a small
    town. Left alone for more than a few hours, it is always found crawling with
    spiders, however it was sealed away.</p><p>After about a week with a new
    owner, it manifests a monstrous spider nearly twice a person's size in the
    nearest basement, cellar or other hidden place (level 4, stealth as level 7;
    climbs a short distance each round; an immediate-range web catches a target
    on a failed Speed defense roll, preventing physical actions until they
    escape, and each round it adds a layer that hinders escape by another step).
    It webs up and eats people nearby at its leisure, saving the owner for last,
    and crumbles to dust and cobwebs if defeated.</p><p><strong>Fear:</strong>
    Someone the owner knows is found completely cocooned in web, dry and drained
    of blood.</p>
