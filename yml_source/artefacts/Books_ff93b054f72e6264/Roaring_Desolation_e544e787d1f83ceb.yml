  slug: roaring-desolation
  description: >-
    <p><strong>Level:</strong> 5</p><p><strong>Related Entity:</strong> The
    Desolation</p><p><strong>Stress:</strong> 3 on realizing the book's power; 3
    each day the owner doesn't burn something.</p><p>A small red-leather book of
    biblical-style verses praising "The Lightless Flame". After reading a few
    pages, the reader becomes supernaturally fascinated with fire: each day they
    don't burn something new, they take 3 Stress that can't be recovered until
    they do. Burning the same thing again (a cigarette, say) only counts the
    first time.</p><p>Passing the book to someone else, or ridding themself of
    it permanently (sinking it at sea, sealing it in concrete), ends the
    fascination.</p><p><strong>Fear:</strong> The owner decides to set part or
    all of themself alight, and does so on a failed Intellect defense roll.</p>
