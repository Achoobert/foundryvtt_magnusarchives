    <p><strong>Level:</strong> 3</p><p><strong>Related Entity:</strong> The
    Flesh</p><p><strong>Stress:</strong> 3 on realizing the book materializes
    bones.</p><p>An unremarkable book of Sanskrit poems about dead animals. If
    passed through a shadow before being opened, a handful of slightly warped
    small-animal bones falls out. This can be repeated; after a few times in one
    encounter, Horror Mode begins, or if already active its range increases by 1
    until the encounter ends.</p><p><strong>Fear:</strong> A nearby animal a
    character noticed is gone, leaving only a small pile of fur, feathers or
    scales.</p>
