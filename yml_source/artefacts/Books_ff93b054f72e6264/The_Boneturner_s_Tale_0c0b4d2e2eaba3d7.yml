  slug: the-boneturners-tale
  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong> The
    Flesh</p><p><strong>Stress:</strong> 3 on realizing the book's power; 1 with
    each use.</p><p>A thick, anonymous black paperback in which a new pilgrim,
    the Bonesmith, joins the Canterbury pilgrims, with grisly results. Each hour
    spent studying it lets the reader attempt one permanent gross change to
    their own body: taller by up to a foot (30 cm), sharpened fingers, more
    attractive, extra muscle, an extra organ, eye or mouth, and so on.</p><p>A
    purely cosmetic change takes a difficulty 2 Intellect-based roll. A change
    with a basic mechanical benefit (easing Might-based tasks from muscle,
    easing interaction from uncanny symmetry, +1 damage from sharpened fingers)
    takes difficulty 4. Each further change made while benefiting from an
    earlier one is hindered by an additional step.</p><p>On a failure, the
    reader takes 3 Stress as their body slumps like wet clay, hindering all
    physical tasks and undoing earlier benefits for about ten hours, during
    which no more changes can be tried.</p><p>The reader can change a willing
    person the same way. Against an unwilling one, they must first hit with an
    attack roll, then make the Intellect-based roll.</p><p>If stored with
    ordinary books after use, the books around it start to
    bleed.</p><p><strong>Fear:</strong> The reader draws an Entity's attention.
    They must stop using the book entirely, or keep going knowing they are
    entering a contract with The Flesh that may demand they become an
    Avatar.</p>
