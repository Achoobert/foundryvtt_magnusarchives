  description: >-
    <p><strong>Level:</strong> 4</p><p><strong>Related Entity:</strong> The
    Slaughter</p><p><strong>Stress:</strong> 3 on understanding and claiming the
    book; 1 with each use, successful or not.</p><p>A neglected old paperback
    following a nameless character through ever more brutal fights, growing
    eager for each one, until a gruesome death.</p><p>Once it's identified,
    reading a few pages and succeeding at a difficulty 4 Intellect-based task
    eases the reader's attack rolls for about an hour. On a failure, the reader
    attacks every living creature within short range with whatever is at hand,
    and can make an Intellect defense roll each round to come back to their
    senses.</p><p><strong>Fear:</strong> An affected reader rips the book in two
    down the spine, releasing an invisible manifestation of The Slaughter.
    Everyone in very long range who fails an Intellect defense roll attacks
    everyone and everything within short range, then themselves; each can make
    another Intellect defense roll each round to stop.</p>
