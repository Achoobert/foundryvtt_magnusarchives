  slug: security-camera-instruction-manual
  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong> The
    Eye</p><p><strong>Stress:</strong> 2 on seeing one's own face in it; 3 on
    realizing what it can do; 1 with each use.</p><p>A yellowed, water-damaged
    ten-page pamphlet for a multicamera recorder. Anyone who glances through it
    has an even chance of finding a black-and-white photo of their own face
    inside.</p><p>Whoever identifies or studies it can use the abilities below
    while carrying it, without needing access or a device. Each use begins
    Horror Mode, or if it's already active increases its range by 1 until the
    end of the day or encounter, whichever is longer.</p><ul><li><p>Use an
    action to see through any camera within very long
    range.</p></li><li><p>Delete or insert sound and images, up to a couple of
    rounds per use, in digital footage from any security camera within very long
    range.</p></li></ul><p><strong>Fear:</strong> The owner becomes fascinated
    with the manual and with watching others through surveillance, neglecting
    everything else. Each day someone tries to convince them this is strange,
    they can make an Intellect roll; three successes end it. Three failures (or
    three days without a roll) and the nearest CCTV system consumes them bodily,
    their spirit watching from it forever.</p>
