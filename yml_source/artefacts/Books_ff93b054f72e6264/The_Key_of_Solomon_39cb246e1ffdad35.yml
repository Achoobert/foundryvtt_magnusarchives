  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong>
    Potentially all the Entities</p><p><strong>Stress:</strong> 3 on realizing
    the book's true nature; 1 for each attempt to summon a monster.</p><p>What
    looks like an English edition of a demonology grimoire is really a treatise
    on the Entities. Spending a minute searching it per specific question eases
    a related knowledge task about the Entities, their Avatars and
    aspects.</p><p>Reading from it for a minute and succeeding at an
    Intellect-based roll (eased by prior study of the book and other
    sorcery-related skills) summons a monster of level 5 or lower tied to an
    Entity, arriving in a way that suits it (out of the shadows for The Dark,
    rising from a corpse for The End). It obeys until its task is done or a day
    passes, whichever comes first.</p><p><strong>Fear:</strong> The monster
    ignores the summoner and attacks the nearby ally with the lowest Might, or
    finishes its task and then returns to destroy the summoner.</p>
