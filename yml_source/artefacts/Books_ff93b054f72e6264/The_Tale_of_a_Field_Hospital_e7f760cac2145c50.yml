  description: >-
    <p><strong>Level:</strong> 5</p><p><strong>Related Entity:</strong> The
    Corruption</p><p><strong>Stress:</strong> 1 from each papercut; 3 on
    realizing the papercut is horribly infected.</p><p>What seems a proof or
    draft of Sir Frederick Treves's account of the Second Boer War, with pages
    printed at different times. Its anecdotes dwell on sudden deaths from
    sepsis, fever and stranger diseases, and keep returning to a Private Amherst
    who dies, comes back with a new ailment, and dies
    again.</p><p><strong>Fear:</strong> The reader gets a papercut from its
    pages that quickly putrefies. Each day they must succeed on a Might defense
    roll or take a serious injury; three successes before dying and they
    survive, perhaps only by losing a finger, hand or arm to amputation.</p>
