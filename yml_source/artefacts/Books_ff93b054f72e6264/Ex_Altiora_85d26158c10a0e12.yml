  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong> The
    Vast</p><p><strong>Stress:</strong> 3 each time the woodcut of the clear
    night sky is examined carefully.</p><p>A calf-bound Latin poem in the style
    of Virgil about a creature so vast its head is lost in the clouds, ending
    with villagers throwing themselves off a cliff. It includes woodcuts of
    mountains, cliffs and an empty night sky. A glance at the night-sky woodcut
    brings a brief feeling of falling.</p><p>Studying that woodcut carefully
    calls for an Intellect defense roll. On a success, for seven days the reader
    can land safely from a fall of any height, taking only 3 Stress. On a
    failure, extreme vertigo hinders all their physical tasks by three steps for
    an hour.</p><p><strong>Fear:</strong> Someone using the book's protection
    instead falls endlessly for an hour through a seemingly infinite layer of
    The Vast. They can make an Intellect defense roll each round to end it, and
    otherwise take 1 Stress every ten minutes.</p>
