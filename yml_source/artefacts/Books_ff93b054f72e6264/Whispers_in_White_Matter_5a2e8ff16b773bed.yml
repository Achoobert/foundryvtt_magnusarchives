  description: >-
    <p><strong>Level:</strong> 5</p><p><strong>Related Entity:</strong> The
    Spiral</p><p><strong>Stress:</strong> 3 on realizing the book's power; 1
    each time it is deliberately used to add or remove a memory.</p><p>A
    scuffed, bulky journal, its title in black marker, filled with handwritten
    entries by several different people. On realizing this, the reader must
    succeed on an Intellect defense roll or the last entry they read vanishes
    from the page and becomes their own memory.</p><p>Someone who understands it
    can erase memories from their own mind by writing them in it, or take on
    memories written there (without knowing what they'll get until they read).
    After a couple of rounds of uninterrupted writing, the owner can make an
    Intellect attack against someone in short range; on a success they delete a
    simple memory from that person or plant a simple false
    one.</p><p><strong>Fear:</strong> The reader takes on a horrifying entry
    about getting ever more lost in The Spiral's endless corridors. On a failed
    Intellect defense roll they are catatonic, wandering The Spiral in their
    memory, until a third party removes it.</p>
