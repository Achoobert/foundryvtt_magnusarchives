  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong> The
    Corruption</p><p><strong>Stress:</strong> 3 on realizing the book's power; 1
    with each use.</p><p>A unique copy of Defoe's novel of the London plague.
    Reading a couple of pages makes the reader immune to disease and poison for
    seven days, but on a failed Might defense roll they also become a
    symptomless carrier of a new airborne disease for that time.</p><p>Anyone
    who comes within immediate range of a carrier must succeed on a Might
    defense roll or catch it and immediately take 2 Stress. Each day they fail a
    Might defense roll they take a serious injury; three successes and they
    recover. Someone who knows the book can try to keep to themselves for the
    week.</p><p>The owner can instead take a disease from someone infected,
    curing them but becoming a carrier of a virulent strain of it.</p><p>Left
    open and unattended in one place for more than a day, the book infects the
    building itself, which rots and, within seven days, collapses into rotten
    wood and powdered stone.</p><p><strong>Fear:</strong> The reader risks
    catching the disease they once carried unless they read a few more pages and
    spawn a new pathogen.</p>
