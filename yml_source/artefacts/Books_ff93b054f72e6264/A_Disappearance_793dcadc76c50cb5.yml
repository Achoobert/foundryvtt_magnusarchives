  slug: a-disappearance
  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong> The
    Lonely</p><p><strong>Stress:</strong> 3 on realizing the book's power; 1
    with each use.</p><p>A twelve-page 1910 pamphlet. Reading just a word or two
    makes the reader invisible and intangible, beyond the reach even of spells
    and abilities that normally find hidden things, until they choose to reveal
    themself.</p><p>Reading it cover to cover (about a minute) removes the
    reader from the world, with no defense roll, into The Lonely. They wander
    alone through a muted, misted mirror of reality, taking 1 Stress each hour
    they fail an Intellect defense roll, and can make an Intellect-based task
    each minute they search for a way out; on a success they reappear between a
    few yards and a few miles from where they
    vanished.</p><p><strong>Fear:</strong> Whether they mean to or not, the
    reader starts reading the whole pamphlet on a failed Intellect defense
    roll.</p>
