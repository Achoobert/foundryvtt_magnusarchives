  description: >-
    <p><strong>Level:</strong> 5</p><p><strong>Related Entity:</strong> The
    Flesh</p><p><strong>Stress:</strong> 1 each time someone understands a
    recipe; 3 if the book tries to eat the cook.</p><p>A glossy modern cookbook
    whose cover chef is not smiling but grimacing in terror. Every recipe uses
    meat. Understanding a recipe takes a successful Intellect defense roll each
    time it's attempted; if the dish is then made that day, everyone who eats it
    gains a free one-action recovery roll (once per
    day).</p><p><strong>Fear:</strong> The book begins eating the reader,
    starting with their hands, its letters gnashing like teeth. Each round they
    fail a Might defense roll they take a serious injury; three successes before
    they die and they pull free.</p>
