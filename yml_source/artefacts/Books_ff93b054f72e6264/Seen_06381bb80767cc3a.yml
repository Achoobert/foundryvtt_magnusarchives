  description: >-
    <p><strong>Level:</strong> 4</p><p><strong>Related Entity:</strong> The
    Eye</p><p><strong>Stress:</strong> 3 on becoming fascinated with the book; 1
    each time someone tries to tell the fascinated reader its pages are
    blank.</p><p>An old, crumbling book with blank pages. Anyone who looks
    through it must succeed on an Intellect defense roll or become fascinated,
    convinced it holds a revolutionary work on something they care about. They
    can barely think or talk of anything else, hindering all their
    Intellect-based tasks.</p><p>Each day someone tries to persuade them the
    pages are blank, they can make another Intellect roll; after three successes
    the fascination ends.</p><p><strong>Fear:</strong> A watcher's husk (p245)
    rises in a distant tomb and slowly stalks the reader, who sees it drawing
    closer whenever they close their eyes.</p>
