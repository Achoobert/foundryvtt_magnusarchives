  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong> The
    Buried</p><p><strong>Stress:</strong> 3 on realizing the book's abilities; 1
    each time the reader feels the walls pressing in; 1 each time one of its
    abilities is used.</p><p>An impossible early edition of Ruskin's book with
    handwritten notes in its margins. Touching or reading it inside a building
    means a Might defense roll or labored breathing and the sense of walls
    closing in, hindering physical tasks until the reader has been outside for
    about a minute.</p><p>Someone who identifies it can use these abilities
    while they have it:</p><ul><li><p>After concentrating for a few rounds, find
    the way through a structure or artificial tunnel to a known room, area,
    person or object, with an Intellect-based task at the level of the structure
    or the thing sought.</p></li><li><p>After reading for one round, make an
    attack roll to reshape the building or tunnel they're in, walling off
    someone they can see inside it. The victim must overcome a level 6 doorless
    room (or sometimes a maze) or wait to be freed by someone with the same book
    or ability.</p></li></ul><p><strong>Fear:</strong> Read too recklessly
    (flipped through, or its powers called on too often), it entombs the reader
    in a lightless cavity inside the walls, too narrow to move or read in.</p>
