  description: >-
    <p><strong>Level:</strong> 4</p><p><strong>Related Entity:</strong> The
    Flesh and The Hunt</p><p><strong>Stress:</strong> 2 each time a topic in it
    is read; 1 each time knowledge from it is put to use.</p><p>A leather-bound
    book of grisly hunting anecdotes, some about animals and a few about people,
    most ending with the prey butchered for a meal. Reading an anecdote (about
    ten minutes) and succeeding at a difficulty 4 Intellect-based task to
    understand it eases the reader's tracking tasks for one
    day.</p><p><strong>Fear:</strong> A manifestation of The Flesh and The Hunt
    marks the reader as prey, and if it catches them does to them what the
    almanac describes.</p>
