  description: >-
    <p><strong>Level:</strong> 4</p><p><strong>Related Entity:</strong> The
    Vast</p><p><strong>Stress:</strong> 3 on realizing most of the book shows
    strange constellations; 1 each time a reader gains the ability to see in the
    dark.</p><p>A modern coffee-table book of color-corrected telescope
    photographs. After the first few, the constellations match nothing on Earth
    and carry names like Corpse King and Fang in the Night.</p><p>A reader who
    realizes this (or anyone who flips through a handful of pages) can see in
    the dark for a day and can always see the stars overhead, even indoors or
    underground, day or night. Meanwhile the strange constellations are
    reflected in their eyes.</p><p><strong>Fear:</strong> A reader who still
    owns the book is whisked up into what seems like open space but is a
    breathable layer of The Vast. They make an Intellect defense roll each
    round: three successes before three failures returns them; three failures
    first leaves them spinning there forever, or until rescued.</p>
