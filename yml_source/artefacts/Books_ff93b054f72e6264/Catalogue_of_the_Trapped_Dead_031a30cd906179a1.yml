  description: >-
    <p><strong>Level:</strong> 7</p><p><strong>Related Entity:</strong> The
    End</p><p><strong>Stress:</strong> 3 on acquiring the book and realizing its
    power; 3 when performing the ritual to make a new page; 1 each time a spirit
    is questioned.</p><p>A large, misshapen book of crude parchment pages
    handwritten in Sanskrit and other languages; anyone can read a page whether
    or not they know the language. Each page describes how one person
    died.</p><p>Reading a page thickens the air with a smell of wet earth and
    summons that person's immaterial spirit, which the reader can question about
    anything it knew in life. It needn't answer, and may beg or bargain instead.
    Most spirits are in constant pain and want release; removing and burning
    their page frees them, while a removed page that is kept can still summon
    them later.</p><p>A spirit (or another source) can teach the binding ritual:
    kill someone, ink a description of their death onto their skin, cut that
    skin away, dry it and stitch it in as a new
    page.</p><p><strong>Fear:</strong> The Tome Hoarder (p240) appears to
    reclaim what she considers her property.</p>
