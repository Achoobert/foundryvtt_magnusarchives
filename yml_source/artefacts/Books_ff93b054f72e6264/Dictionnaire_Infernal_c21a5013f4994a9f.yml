  description: >-
    <p><strong>Level:</strong> 4</p><p><strong>Related Entity:</strong> The
    Eye</p><p><strong>Stress:</strong> 3 on realizing the book's power; 1 with
    each use.</p><p>A unique edition of de Plancy's "Infernal Dictionary", dated
    1908. Reading a few words from it eases the reader's tasks to perceive
    abnormal presences and influences for one hour, including ones normally
    imperceptible. For the same hour, tasks to hide from or defend against those
    presences and influences are hindered.</p><p><strong>Fear:</strong> The book
    summons an aspect of an Entity, such as a lightless beast (p224), greyling
    (p220) or buried thing (p204), which attacks the reader.</p>
