  description: >-
    <p><strong>Level:</strong> 6</p><p><strong>Related Entity:</strong> The
    Flesh</p><p><strong>Stress:</strong> 3 on realizing the book's power; 3 the
    first time a reader eats human brain.</p><p>An early-1900s study of the
    nervous system and brain. Anyone who skims a page or two must succeed on an
    Intellect defense roll or, unless stopped, read it all, which takes a couple
    of hours.</p><p>Finishing it brings numbness, tingling and weakness in the
    hands and feet, hindering physical tasks. The reader becomes convinced that
    eating untainted nerve tissue will cure them, and is right: animal brains
    give a few hours' relief, human brains a real cure.</p><p>A reader who stops
    after just a page or two instead eases their Intellect defense rolls by two
    steps for one day.</p><p><strong>Fear:</strong> Human brains relieve the
    affliction for only about a month before it returns, and the relief gets
    shorter each time, demanding more brains.</p>
