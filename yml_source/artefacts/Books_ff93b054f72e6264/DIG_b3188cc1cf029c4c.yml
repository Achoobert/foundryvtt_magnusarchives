  description: >-
    <p><strong>Level:</strong> 4</p><p><strong>Related Entity:</strong> The
    Buried</p><p><strong>Stress:</strong> 1 after reading a few pages; 1 each
    time a defense roll against its compulsion is failed.</p><p>Every page holds
    the single word DIG. Anyone who reads a few pages slowly develops an
    obsession with digging down to somewhere safe beneath the crushing earth.
    Once a day they make an Intellect defense roll; three successes before three
    failures breaks the obsession.</p><p>After three failures, they find
    somewhere to bury themself in the earth (or whatever is nearest), with bare
    fingernails if need be. Those who do it unobserved usually smother. Someone
    saved by a third party gets three more Intellect defense rolls to shake the
    fascination.</p><p><strong>Fear:</strong> The book's containment (a
    wrapping, a welded metal box) is disturbed and the blurred letters of its
    cover are left on view, inviting the curious.</p>
