  description: >-
    <p><strong>Level:</strong> 5</p><p><strong>Related Entity:</strong> The
    Eye</p><p><strong>Stress:</strong> 3 if a reader resists the book's attempt
    to read them; none if they succumb.</p><p>A unique Russian translation of
    Robert Burton's study of melancholy. Anyone who glances at a page, even
    without reading the language, must succeed on an Intellect defense roll or
    be "read back" and drained of emotion for about an hour.</p><p>A drained
    victim can't act on their own will. They carry out tasks others command,
    without feeling, but lapse into stillness unless the command is constantly
    repeated. They can make an Intellect defense roll each minute to end the
    effect early.</p><p><strong>Fear:</strong> On a failed Might defense roll,
    the book reads more than emotion and physically erases part of the reader's
    body: an ear, an eye, a hand, or sometimes all of them.</p>
