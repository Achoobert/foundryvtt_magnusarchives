  slug: elocutionist
  description: >-
    <p>Getting people to talk about the strange things that happened to them is
    half the job, and you're good at it. Elocutionists are charming, perceptive
    spokespeople and fast talkers who read what goes unsaid, invent cover
    stories and keep their allies' spirits up.</p><p><strong>Starting
    Pools:</strong> Might 8, Speed 9, Intellect 11, plus 6 points to assign as
    you wish.</p><h3>First-Tier
    Elocutionist</h3><ul><li><p><strong>Effort:</strong> Your Effort is
    1.</p></li><li><p><strong>Fit:</strong> Edge Might 0, Speed 0, Intellect
    1.</p></li><li><p><strong>People Skills:</strong> You're trained in two of
    @UUID[Compendium.magnusarchives.skills.Item.9NS4fm5VOrlzRwHv]{Deception},
    @UUID[Compendium.magnusarchives.skills.Item.952bfb5f1296eb5b]{Discerning
    motive},
    @UUID[Compendium.magnusarchives.skills.Item.TxjNz86eOB6UwTGb]{Intimidation},
    @UUID[Compendium.magnusarchives.skills.Item.c4b6b98d92624257]{Persuasion},
    @UUID[Compendium.magnusarchives.skills.Item.WPrgzmkLT8BNjGu5]{Performance}.</p></li><li><p><strong>Cypher
    Use:</strong> You can have 2 cyphers at a
    time.</p></li><li><p><strong>Weapons:</strong> You're practiced with light
    and medium weapons, and have an inability with heavy
    weapons.</p></li><li><p><strong>Locution Abilities:</strong> Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.a9da64489c9fb572]{Connected},
    @UUID[Compendium.magnusarchives.type-abilities.Item.35bdf7e9d1dc9edc]{De-Stress},
    @UUID[Compendium.magnusarchives.type-abilities.Item.3fca02011da01cba]{Encouragement},
    @UUID[Compendium.magnusarchives.type-abilities.Item.765aedb68f91fdcc]{Enthrall},
    @UUID[Compendium.magnusarchives.type-abilities.Item.40658738b65bc2d4]{Inner
    Defense},
    @UUID[Compendium.magnusarchives.type-abilities.Item.d0b88c4bda1cd074]{Knowledge
    Skills},
    @UUID[Compendium.magnusarchives.type-abilities.Item.8045eec1c43e1130]{Secret
    Agendas},
    @UUID[Compendium.magnusarchives.type-abilities.Item.97ec69e342ac084b]{Understanding},
    @UUID[Compendium.magnusarchives.type-abilities.Item.2a18ada08f3ff75f]{Verbal
    Disguise}.</p></li></ul><h3>Second-Tier
    Elocutionist</h3><ul><li><p><strong>Locution Abilities:</strong> Choose two
    of
    @UUID[Compendium.magnusarchives.type-abilities.Item.8a69862d6b8aa91f]{Agitate},
    @UUID[Compendium.magnusarchives.type-abilities.Item.bc6b1a7a63c9a592]{Cold
    Reading},
    @UUID[Compendium.magnusarchives.type-abilities.Item.a183ffdebb3135f2]{Defuse},
    @UUID[Compendium.magnusarchives.type-abilities.Item.d96dc22870c5f2fe]{Disincentivize},
    @UUID[Compendium.magnusarchives.type-abilities.Item.c9ab330ae2c5ccb9]{Gather
    Intelligence},
    @UUID[Compendium.magnusarchives.type-abilities.Item.951f1d616c4dbd8f]{Inspire
    Aggression},
    @UUID[Compendium.magnusarchives.type-abilities.Item.e625b67b193fd2da]{Inspiring
    Ease},
    @UUID[Compendium.magnusarchives.type-abilities.Item.fa4ee6a38062d492]{Quick
    Wits},
    @UUID[Compendium.magnusarchives.type-abilities.Item.a19701cab0085d16]{Skill
    With Defense}, or from a lower tier. You can also swap one lower-tier
    ability for another from a lower tier.</p></li></ul><h3>Third-Tier
    Elocutionist</h3><ul><li><p><strong>Expert Cypher Use:</strong> You can have
    3 cyphers at a time.</p></li><li><p><strong>Locution Abilities:</strong>
    Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.999d777e24103bd1]{Blend
    In},
    @UUID[Compendium.magnusarchives.type-abilities.Item.31b5b2e3a52d67ba]{Communication},
    @UUID[Compendium.magnusarchives.type-abilities.Item.87b850182a0ac6eb]{Grand
    Deception},
    @UUID[Compendium.magnusarchives.type-abilities.Item.ca13e3ef0ef9f431]{Mind
    Games},
    @UUID[Compendium.magnusarchives.type-abilities.Item.d42e9a448812cf25]{Oratory},
    @UUID[Compendium.magnusarchives.type-abilities.Item.0215b48bcde7698d]{Seen
    Some . . . Stuff},
    @UUID[Compendium.magnusarchives.type-abilities.Item.e87c75be34343299]{Slip
    of the Tongue},
    @UUID[Compendium.magnusarchives.type-abilities.Item.f05479c95732618c]{Surveillance},
    @UUID[Compendium.magnusarchives.type-abilities.Item.2355d9b365b879c2]{Irresistible
    Question}, or from a lower tier. You can also swap one lower-tier ability
    for another from a lower tier.</p></li></ul><h3>Fourth-Tier
    Elocutionist</h3><ul><li><p><strong>Locution Abilities:</strong> Choose two
    of
    @UUID[Compendium.magnusarchives.type-abilities.Item.498974570d0d020a]{Anticipate
    Attack},
    @UUID[Compendium.magnusarchives.type-abilities.Item.24f213dd2347b6fe]{Cover
    Story},
    @UUID[Compendium.magnusarchives.type-abilities.Item.ad8e776cd9291120]{Heightened
    Skills},
    @UUID[Compendium.magnusarchives.type-abilities.Item.7f3a67c7b60f9cf9]{Look
    for the Tell},
    @UUID[Compendium.magnusarchives.type-abilities.Item.7ace1b60b158fcf4]{Scarred
    and Hardened},
    @UUID[Compendium.magnusarchives.type-abilities.Item.00b948ff530ed790]{Skill
    With Attacks},
    @UUID[Compendium.magnusarchives.type-abilities.Item.1425a024fdb122f7]{Spur
    Effort},
    @UUID[Compendium.magnusarchives.type-abilities.Item.66781b46370dd4e6]{Stress},
    @UUID[Compendium.magnusarchives.type-abilities.Item.78bdadd15562cc81]{Understanding
    Why},
    @UUID[Compendium.magnusarchives.type-abilities.Item.75b3bd8b832114c0]{Terrorize},
    or from a lower tier. You can also swap one lower-tier ability for another
    from a lower tier.</p></li></ul><h3>Fifth-Tier
    Elocutionist</h3><ul><li><p><strong>Adroit Cypher Use:</strong> You can have
    4 cyphers at a time.</p></li><li><p><strong>Locution Abilities:</strong>
    Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.d0f02c9277f9a46c]{Performance},
    @UUID[Compendium.magnusarchives.type-abilities.Item.1aa036c7687b4b9a]{Shrug
    It Off},
    @UUID[Compendium.magnusarchives.type-abilities.Item.6955750bfb20d18a]{Soft
    Speech},
    @UUID[Compendium.magnusarchives.type-abilities.Item.bcded2d583fc2df3]{Stimulate},
    @UUID[Compendium.magnusarchives.type-abilities.Item.a80912af84f7c94d]{Think
    Your Way Out},
    @UUID[Compendium.magnusarchives.type-abilities.Item.4da1a9ade4d8dd1f]{Control},
    or from a lower tier. You can also swap one lower-tier ability for another
    from a lower tier.</p></li></ul><h3>Sixth-Tier
    Elocutionist</h3><ul><li><p><strong>Locution Abilities:</strong> Choose two
    of
    @UUID[Compendium.magnusarchives.type-abilities.Item.e690d1ce371c814a]{Inspiring
    Success},
    @UUID[Compendium.magnusarchives.type-abilities.Item.f902f8c2ca73ba60]{Mastery
    With Defense},
    @UUID[Compendium.magnusarchives.type-abilities.Item.c88b6703f34986b7]{Soothing
    Words},
    @UUID[Compendium.magnusarchives.type-abilities.Item.21370ccf8aca4a55]{True
    Communication},
    @UUID[Compendium.magnusarchives.type-abilities.Item.ddef7dd76b2c2b67]{Condemn},
    or from a lower tier. You can also swap one lower-tier ability for another
    from a lower tier.</p></li></ul><p>Abilities marked supernatural need 10
    levels of Stress from supernatural sources first (p27).</p><p><em>Sheet
    notes:</em> Cypher limits at higher tiers are raised by hand on the
    sheet.</p>
