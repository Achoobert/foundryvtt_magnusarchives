name: Investigator
type: characterType
_id: f40dbb16cdd66054
img: systems/magnusarchives/assets/icons/magnustype.webp
system:
  schemaVersion: 1
  slug: investigator
  description: >-
    <p>You haunt libraries and record offices as readily as abandoned houses,
    and you would always rather know the truth. Investigators are the core of
    most Magnus groups: researchers, private eyes and archivists who find clues
    and piece them together.</p><p><strong>Starting Pools:</strong> Might 10,
    Speed 9, Intellect 9, plus 6 points to assign as you wish.</p><h3>First-Tier
    Investigator</h3><ul><li><p><strong>Effort:</strong> Your Effort is
    1.</p></li><li><p><strong>Fit:</strong> Edge Might 0, Speed 1, Intellect
    1.</p></li><li><p><strong>Investigative Skills:</strong> You're trained in
    two of
    @UUID[Compendium.magnusarchives.skills.Item.952bfb5f1296eb5b]{Discerning
    motive},
    @UUID[Compendium.magnusarchives.skills.Item.uzlopmNCJj8CpFlC]{Forensics},
    @UUID[Compendium.magnusarchives.skills.Item.TxjNz86eOB6UwTGb]{Intimidation},
    @UUID[Compendium.magnusarchives.skills.Item.S9WFjHa5QI83AFQO]{Perception},
    @UUID[Compendium.magnusarchives.skills.Item.c4b6b98d92624257]{Persuasion},
    @UUID[Compendium.magnusarchives.skills.Item.1ed6a9dae4acd3cb]{Researching},
    @UUID[Compendium.magnusarchives.skills.Item.SbEfC3bQGCbTDvOM]{Tracking}.</p></li><li><p><strong>Cypher
    Use:</strong> You can have 2 cyphers at a
    time.</p></li><li><p><strong>Weapons:</strong> You're practiced with light
    and medium weapons, and have an inability with heavy
    weapons.</p></li><li><p><strong>Investigative Abilities:</strong> Choose two
    of
    @UUID[Compendium.magnusarchives.type-abilities.Item.853af021f960e619]{Careful
    Observation},
    @UUID[Compendium.magnusarchives.type-abilities.Item.122f22c29c0ca2ae]{Decipher},
    @UUID[Compendium.magnusarchives.type-abilities.Item.2942825f6ae92eb7]{Fleet
    of Foot},
    @UUID[Compendium.magnusarchives.type-abilities.Item.dd0347640c3aa660]{Follow
    the Trail},
    @UUID[Compendium.magnusarchives.type-abilities.Item.27b0bc8496dff84d]{Knowledge
    Skills},
    @UUID[Compendium.magnusarchives.type-abilities.Item.b61c48768d1c1c8a]{Missing
    Detail},
    @UUID[Compendium.magnusarchives.type-abilities.Item.b90ff3c803703f91]{Operate
    in the Dark},
    @UUID[Compendium.magnusarchives.type-abilities.Item.a9786432ecec57e4]{Ready
    for Danger},
    @UUID[Compendium.magnusarchives.type-abilities.Item.a5dbad047a05ea87]{Surging
    Confidence}.</p></li></ul><h3>Second-Tier
    Investigator</h3><ul><li><p><strong>Investigative Abilities:</strong> Choose
    two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.5a63b28f6f9a9352]{Escape},
    @UUID[Compendium.magnusarchives.type-abilities.Item.d4b8b28ad55191d3]{Eye
    for Detail},
    @UUID[Compendium.magnusarchives.type-abilities.Item.f72d5d7527c8805f]{Hand
    to Eye},
    @UUID[Compendium.magnusarchives.type-abilities.Item.c43eecd5286b79ff]{Just a
    Hunch},
    @UUID[Compendium.magnusarchives.type-abilities.Item.e70716777451a61b]{Research},
    @UUID[Compendium.magnusarchives.type-abilities.Item.6cd9659eb5988ac1]{Skill
    With Defense},
    @UUID[Compendium.magnusarchives.type-abilities.Item.f99cb3df1165dc34]{Skim},
    @UUID[Compendium.magnusarchives.type-abilities.Item.a4696294a54011b4]{Surveillance},
    @UUID[Compendium.magnusarchives.type-abilities.Item.06b0638f299eda1a]{Travel
    Skills}, or from a lower tier. You can also swap one lower-tier ability for
    another from a lower tier.</p></li></ul><h3>Third-Tier
    Investigator</h3><ul><li><p><strong>Expert Cypher Use:</strong> You can have
    3 cyphers at a time.</p></li><li><p><strong>Investigative
    Abilities:</strong> Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.1398b4fe964076b6]{Interaction
    Skills},
    @UUID[Compendium.magnusarchives.type-abilities.Item.be0e7e23f7399a6b]{Quick
    Recovery},
    @UUID[Compendium.magnusarchives.type-abilities.Item.9671995ad3de6d28]{Scarred
    and Hardened},
    @UUID[Compendium.magnusarchives.type-abilities.Item.f1bd78b99aa6b946]{Seen
    Some . . . Stuff},
    @UUID[Compendium.magnusarchives.type-abilities.Item.4e608625fe201a63]{Skill
    With Attacks},
    @UUID[Compendium.magnusarchives.type-abilities.Item.a29e0a96795ac0bc]{Think
    Your Way Out},
    @UUID[Compendium.magnusarchives.type-abilities.Item.837b2967ffd769c7]{Trapfinder},
    @UUID[Compendium.magnusarchives.type-abilities.Item.91cb010d2331e18e]{Unnatural
    Dream}, or from a lower tier. You can also swap one lower-tier ability for
    another from a lower tier.</p></li></ul><h3>Fourth-Tier
    Investigator</h3><ul><li><p><strong>Investigative Abilities:</strong> Choose
    two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.b040bafbde42cbca]{Credible
    Hypothesis},
    @UUID[Compendium.magnusarchives.type-abilities.Item.19dfe3138dfcac02]{Heightened
    Skills},
    @UUID[Compendium.magnusarchives.type-abilities.Item.c16772d747eb0c1c]{Look
    for the Tell},
    @UUID[Compendium.magnusarchives.type-abilities.Item.3dd7c2f54ff06bf9]{Perfect
    Tracker},
    @UUID[Compendium.magnusarchives.type-abilities.Item.c9b70fa246c88b65]{Subtle
    Steps},
    @UUID[Compendium.magnusarchives.type-abilities.Item.e3635e752309f771]{Take
    Their Measure},
    @UUID[Compendium.magnusarchives.type-abilities.Item.da2e9f4a962087e1]{Versatile
    Mind},
    @UUID[Compendium.magnusarchives.type-abilities.Item.da775b8d3b224f76]{Supernatural
    Senses}, or from a lower tier. You can also swap one lower-tier ability for
    another from a lower tier.</p></li></ul><h3>Fifth-Tier
    Investigator</h3><ul><li><p><strong>Adroit Cypher Use:</strong> You can have
    4 cyphers at a time.</p></li><li><p><strong>Investigative
    Abilities:</strong> Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.02ead2126b57912a]{Hard
    to Kill},
    @UUID[Compendium.magnusarchives.type-abilities.Item.a5c82ec0a6f9f6a7]{Mastery
    With Defense},
    @UUID[Compendium.magnusarchives.type-abilities.Item.773b353306571580]{Seize
    the Moment},
    @UUID[Compendium.magnusarchives.type-abilities.Item.bc1009f7ce67d178]{Shrug
    It Off},
    @UUID[Compendium.magnusarchives.type-abilities.Item.bce18b92d1ee0a68]{Vigilant},
    @UUID[Compendium.magnusarchives.type-abilities.Item.147739497d9e484e]{See
    the Past}, or from a lower tier. You can also swap one lower-tier ability
    for another from a lower tier.</p></li></ul><h3>Sixth-Tier
    Investigator</h3><ul><li><p><strong>Investigative Abilities:</strong> Choose
    two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.f78a00c77477d373]{Advanced
    Research},
    @UUID[Compendium.magnusarchives.type-abilities.Item.56c0fc2565389a49]{General
    Knowledge},
    @UUID[Compendium.magnusarchives.type-abilities.Item.eaa8563c100c9126]{Impossible
    Clue},
    @UUID[Compendium.magnusarchives.type-abilities.Item.0eb6924dafb42488]{Mastery
    With Attacks},
    @UUID[Compendium.magnusarchives.type-abilities.Item.73cdd919f93ec8a7]{See
    the Future}, or from a lower tier. You can also swap one lower-tier ability
    for another from a lower tier.</p></li></ul><p>Abilities marked supernatural
    need 10 levels of Stress from supernatural sources first
    (p27).</p><p><em>Sheet notes:</em> Only the Intellect Edge is applied
    automatically; set the Speed Edge of 1 on the sheet. Cypher limits at higher
    tiers are raised by hand on the sheet.</p>
