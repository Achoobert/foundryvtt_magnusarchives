system:
  schemaVersion: 1
  slug: occultist
  description: >-
    <p>The things you were told to leave alone have always called to you.
    Occultists are well-read, brooding people steeped in dark lore, often the
    first to recognise what the group is facing and the most likely to develop
    real paranormal powers.</p><p><strong>Starting Pools:</strong> Might 7,
    Speed 9, Intellect 12, plus 6 points to assign as you
    wish.</p><h3>First-Tier Occultist</h3><ul><li><p><strong>Effort:</strong>
    Your Effort is 1.</p></li><li><p><strong>Fit:</strong> Edge Might 0, Speed
    0, Intellect 1.</p></li><li><p><strong>Knowledge Skills:</strong> You're
    trained in
    @UUID[Compendium.magnusarchives.skills.Item.8d7248fff87386d3]{Occultism},
    and trained in one of
    @UUID[Compendium.magnusarchives.skills.Item.Ruyq1SdHHH0CAjbJ]{Astronomy},
    @UUID[Compendium.magnusarchives.skills.Item.4XrJq6pn1RcVrbo7]{Biology},
    @UUID[Compendium.magnusarchives.skills.Item.6EAeFLoptNeoy8we]{Engineering},
    @UUID[Compendium.magnusarchives.skills.Item.uzlopmNCJj8CpFlC]{Forensics},
    @UUID[Compendium.magnusarchives.skills.Item.13b2bdb00bf6fbad]{Geography},
    @UUID[Compendium.magnusarchives.skills.Item.5WZgpOhdtyF5lfdj]{Geology},
    @UUID[Compendium.magnusarchives.skills.Item.WwKxO9b2ETF6e6vq]{History},
    @UUID[Compendium.magnusarchives.skills.Item.USk9iDmN7dNunH2I]{Mathematics},
    @UUID[Compendium.magnusarchives.skills.Item.1d4c6135d4221600]{Medicine},
    @UUID[Compendium.magnusarchives.skills.Item.2IRvR3ZWIIEStnDV]{Philosophy},
    @UUID[Compendium.magnusarchives.skills.Item.D1LtZa629twcMtFe]{Physics},
    @UUID[Compendium.magnusarchives.skills.Item.dbd4639749e26c4b]{Programming},
    @UUID[Compendium.magnusarchives.skills.Item.XBkEFJaxQvgGEaZD]{Psychology},
    @UUID[Compendium.magnusarchives.skills.Item.57a23c400d43de6e]{Religion},
    @UUID[Compendium.magnusarchives.skills.Item.1ed6a9dae4acd3cb]{Researching}.</p></li><li><p><strong>Expert
    Cypher Use:</strong> You can have 3 cyphers at a
    time.</p></li><li><p><strong>Weapons:</strong> You're practiced with light
    and medium weapons, and have an inability with heavy
    weapons.</p></li><li><p><strong>Occult Abilities:</strong> Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.19446b5f70591232]{Already
    Tainted},
    @UUID[Compendium.magnusarchives.type-abilities.Item.4d88030a00bb69f2]{Artefact
    Affinity},
    @UUID[Compendium.magnusarchives.type-abilities.Item.326b4e0ca21ecee7]{Esoteric
    Skills},
    @UUID[Compendium.magnusarchives.type-abilities.Item.eace440e38864256]{Intuition},
    @UUID[Compendium.magnusarchives.type-abilities.Item.6c2ae974f0a959f3]{Sensitive},
    @UUID[Compendium.magnusarchives.type-abilities.Item.bc3d3610905e0c9d]{Slightly
    Sinister Skills},
    @UUID[Compendium.magnusarchives.type-abilities.Item.deb1202f4bae0c7e]{Supernatural
    Comprehension},
    @UUID[Compendium.magnusarchives.type-abilities.Item.7bddd531719c1cf4]{Understanding},
    @UUID[Compendium.magnusarchives.type-abilities.Item.c9e2f56c7f2429d3]{Ventriloquism},
    @UUID[Compendium.magnusarchives.type-abilities.Item.78bfe5babe83d069]{Mesmerism}.</p></li></ul><h3>Second-Tier
    Occultist</h3><ul><li><p><strong>Occult Abilities:</strong> Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.9f6d1ec705beee96]{Cold
    Reading},
    @UUID[Compendium.magnusarchives.type-abilities.Item.bd5e6185e9dda98c]{Hoax},
    @UUID[Compendium.magnusarchives.type-abilities.Item.5535dd785ab8b182]{Practiced
    With Medium Weapons},
    @UUID[Compendium.magnusarchives.type-abilities.Item.ba64f85cea356f3e]{Seen
    Some . . . Stuff},
    @UUID[Compendium.magnusarchives.type-abilities.Item.4a20a368527d491a]{Skill
    With Defense},
    @UUID[Compendium.magnusarchives.type-abilities.Item.33d3a30aa211e12c]{Spout
    Nonsense},
    @UUID[Compendium.magnusarchives.type-abilities.Item.aba66e53180fa051]{Premonition},
    @UUID[Compendium.magnusarchives.type-abilities.Item.32309a6021d7d290]{Send
    Thoughts}, or from a lower tier. You can also swap one lower-tier ability
    for another from a lower tier.</p></li></ul><h3>Third-Tier
    Occultist</h3><ul><li><p><strong>Adroit Cypher Use:</strong> You can have 4
    cyphers at a time.</p></li><li><p><strong>Occult Abilities:</strong> Choose
    two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.740ada2c600174c5]{Cooperative
    Sorcery},
    @UUID[Compendium.magnusarchives.type-abilities.Item.3385f34bc45f83c9]{Embracing
    the Unknown},
    @UUID[Compendium.magnusarchives.type-abilities.Item.52d5fe1ad54a49bf]{Intense
    Practitioner},
    @UUID[Compendium.magnusarchives.type-abilities.Item.dbfec87b38813174]{Peering
    Beyond the Veil},
    @UUID[Compendium.magnusarchives.type-abilities.Item.e488e112ef09ac72]{Resistance
    to the Uncanny},
    @UUID[Compendium.magnusarchives.type-abilities.Item.b11ef25ae811ae8c]{Shatter},
    @UUID[Compendium.magnusarchives.type-abilities.Item.39fa642ad1fb0306]{Supernatural
    Resistance}, or from a lower tier. You can also swap one lower-tier ability
    for another from a lower tier.</p></li></ul><h3>Fourth-Tier
    Occultist</h3><ul><li><p><strong>Occult Abilities:</strong> Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.d38a89030cf15fe1]{Combating
    the Uncanny},
    @UUID[Compendium.magnusarchives.type-abilities.Item.db283e0437bfda39]{Heightened
    Skills},
    @UUID[Compendium.magnusarchives.type-abilities.Item.61d13f47f97792fd]{Shrug
    It Off},
    @UUID[Compendium.magnusarchives.type-abilities.Item.c7a1967f182b7667]{Think
    Your Way Out},
    @UUID[Compendium.magnusarchives.type-abilities.Item.0a52bf0113e0056a]{Cypher
    Manifestation},
    @UUID[Compendium.magnusarchives.type-abilities.Item.82aa19bc26770afa]{Edit
    Memories}, or from a lower tier. You can also swap one lower-tier ability
    for another from a lower tier.</p></li></ul><h3>Fifth-Tier
    Occultist</h3><ul><li><p><strong>Master Cypher Use:</strong> You can have 5
    cyphers at a time.</p></li><li><p><strong>Occult Abilities:</strong> Choose
    two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.72607ee3552916e8]{See
    the Truth},
    @UUID[Compendium.magnusarchives.type-abilities.Item.b712d003add6575a]{Skill
    With Attacks},
    @UUID[Compendium.magnusarchives.type-abilities.Item.1e85ff1049c61b0e]{Stern
    Stuff},
    @UUID[Compendium.magnusarchives.type-abilities.Item.0fbca3f58c065801]{Stressed
    Mind},
    @UUID[Compendium.magnusarchives.type-abilities.Item.945c4e5c839b7087]{Vanish
    From Sight}, or from a lower tier. You can also swap one lower-tier ability
    for another from a lower tier.</p></li></ul><h3>Sixth-Tier
    Occultist</h3><ul><li><p><strong>Occult Abilities:</strong> Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.386130c88140aa38]{Craft
    Artefact},
    @UUID[Compendium.magnusarchives.type-abilities.Item.f258f02a8fae1376]{Defending
    Others},
    @UUID[Compendium.magnusarchives.type-abilities.Item.00c794802d3d616d]{Mastery
    With Defense},
    @UUID[Compendium.magnusarchives.type-abilities.Item.27eaa8c73e0635c8]{Meditative
    Restoration},
    @UUID[Compendium.magnusarchives.type-abilities.Item.9a8b5f66e7867779]{Ghost},
    @UUID[Compendium.magnusarchives.type-abilities.Item.68cac6a8630554de]{Psychokinetic
    Attack}, or from a lower tier. You can also swap one lower-tier ability for
    another from a lower tier.</p></li></ul><p>Abilities marked supernatural
    need 10 levels of Stress from supernatural sources first
    (p27).</p><p><em>Sheet notes:</em> The Might Pool starts at 7, below Core
    Setup's base of 8; lower it by 1 on the sheet. Core Setup sets a cypher
    limit of 2; raise it to 3. Cypher limits at higher tiers are raised by hand
    on the sheet.</p>
