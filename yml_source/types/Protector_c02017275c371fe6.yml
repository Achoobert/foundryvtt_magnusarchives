              description: >-
                <p><strong>Cost:</strong> 1+ Speed points.</p><p>Attack the
                highest-level foe in a group or swarm. If you hit, instead of
                dealing damage, every foe within immediate distance either moves
                within an immediate area as you direct, or can't enter an
                immediate space you pick (to shield allies who stay put, not
                yourself). Affects level 1 foes; each extra Speed point raises
                the level affected by 1, and you must cover the highest-level
                foe. Action.</p>
