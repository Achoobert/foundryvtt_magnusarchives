system:
  schemaVersion: 1
  slug: protector
  description: >-
    <p>Someone has to shine a light into the dark, and someone has to watch
    their back. Protectors are physical, action-minded people (soldiers, guards,
    police, mercenaries) who take and deal the most punishment and shield the
    rest of the group.</p><p><strong>Starting Pools:</strong> Might 10, Speed
    10, Intellect 8, plus 6 points to assign as you wish.</p><h3>First-Tier
    Protector</h3><ul><li><p><strong>Effort:</strong> Your Effort is
    1.</p></li><li><p><strong>Fit:</strong> Edge Might 1, Speed 1, Intellect
    0.</p></li><li><p><strong>Protector Knowledge:</strong> You're trained in
    one of
    @UUID[Compendium.magnusarchives.skills.Item.952bfb5f1296eb5b]{Discerning
    motive},
    @UUID[Compendium.magnusarchives.skills.Item.uzlopmNCJj8CpFlC]{Forensics},
    @UUID[Compendium.magnusarchives.skills.Item.TxjNz86eOB6UwTGb]{Intimidation},
    @UUID[Compendium.magnusarchives.skills.Item.S9WFjHa5QI83AFQO]{Perception},
    @UUID[Compendium.magnusarchives.skills.Item.ZxPyYpNcbki4VN3z]{Stealth},
    @UUID[Compendium.magnusarchives.skills.Item.SbEfC3bQGCbTDvOM]{Tracking}.</p></li><li><p><strong>Cypher
    Use:</strong> You can have 2 cyphers at a
    time.</p></li><li><p><strong>Weapons:</strong> You're practiced with light,
    medium and heavy weapons.</p></li><li><p><strong>Protective
    Abilities:</strong> Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.ad89f8a20b02e255]{Combat
    Prowess},
    @UUID[Compendium.magnusarchives.type-abilities.Item.a31a52c4f0358ca8]{No
    Need for Weapons},
    @UUID[Compendium.magnusarchives.type-abilities.Item.3e9b09aca0c55023]{One
    Against Many},
    @UUID[Compendium.magnusarchives.type-abilities.Item.f8af6e04e1eb3f48]{Other
    Knowledge},
    @UUID[Compendium.magnusarchives.type-abilities.Item.49817f65fc328167]{Overwatch},
    @UUID[Compendium.magnusarchives.type-abilities.Item.75823414b28760ca]{Physical
    Skills},
    @UUID[Compendium.magnusarchives.type-abilities.Item.162d7608661acddf]{Protector},
    @UUID[Compendium.magnusarchives.type-abilities.Item.663707a2d018a70f]{Slow
    Them Down},
    @UUID[Compendium.magnusarchives.type-abilities.Item.0db783c6fb7f1f14]{Take
    the Hit}.</p></li></ul><h3>Second-Tier
    Protector</h3><ul><li><p><strong>Protective Abilities:</strong> Choose two
    of
    @UUID[Compendium.magnusarchives.type-abilities.Item.87a2967964003103]{Bodyguard},
    @UUID[Compendium.magnusarchives.type-abilities.Item.7d6d164cfea0f82e]{Coping
    With the Impossible},
    @UUID[Compendium.magnusarchives.type-abilities.Item.26112043bf579970]{Intimidating
    Demeanor},
    @UUID[Compendium.magnusarchives.type-abilities.Item.fc1b62291f7ac4b2]{Quick
    Recovery},
    @UUID[Compendium.magnusarchives.type-abilities.Item.f98aaef1736e191c]{Scarred
    and Hardened},
    @UUID[Compendium.magnusarchives.type-abilities.Item.d55a8edb169afb4f]{Skill
    With Attacks},
    @UUID[Compendium.magnusarchives.type-abilities.Item.d6042394c9ae539a]{Skill
    With Defense},
    @UUID[Compendium.magnusarchives.type-abilities.Item.3816016ca8ec53d2]{Stand
    Watch},
    @UUID[Compendium.magnusarchives.type-abilities.Item.cb889a0a80cae1cf]{Support
    the Team}, or from a lower tier. You can also swap one lower-tier ability
    for another from a lower tier.</p></li></ul><h3>Third-Tier
    Protector</h3><ul><li><p><strong>Expert Cypher Use:</strong> You can have 3
    cyphers at a time.</p></li><li><p><strong>Protective Abilities:</strong>
    Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.f140aa5114c6d417]{Combat
    Medic},
    @UUID[Compendium.magnusarchives.type-abilities.Item.6b5bd23159bb4d2a]{Deadly
    Aim},
    @UUID[Compendium.magnusarchives.type-abilities.Item.650701a356bac04e]{Lunge},
    @UUID[Compendium.magnusarchives.type-abilities.Item.bdbf73d0f6a043f0]{Reaction},
    @UUID[Compendium.magnusarchives.type-abilities.Item.73bb92e7ec1a9fae]{Seen
    Some . . . Stuff},
    @UUID[Compendium.magnusarchives.type-abilities.Item.f167b79b639e4067]{Spray},
    @UUID[Compendium.magnusarchives.type-abilities.Item.9f5519d7864c1a81]{Tactical
    Plan},
    @UUID[Compendium.magnusarchives.type-abilities.Item.edc98cc1a353839b]{Tough},
    @UUID[Compendium.magnusarchives.type-abilities.Item.0e568d5bbad325b8]{Vigilance},
    @UUID[Compendium.magnusarchives.type-abilities.Item.15278d48d8274fed]{Impossible
    Strength}, or from a lower tier. You can also swap one lower-tier ability
    for another from a lower tier.</p></li></ul><h3>Fourth-Tier
    Protector</h3><ul><li><p><strong>Protective Abilities:</strong> Choose two
    of
    @UUID[Compendium.magnusarchives.type-abilities.Item.21e867eeadc5bc85]{Amazing
    Effort},
    @UUID[Compendium.magnusarchives.type-abilities.Item.5e6a7f7866b257b1]{Bury
    the Bodies},
    @UUID[Compendium.magnusarchives.type-abilities.Item.e03cfaabfa706faf]{Capable
    Fighter},
    @UUID[Compendium.magnusarchives.type-abilities.Item.bfb01296f19c8bc9]{Expert
    Bodyguard},
    @UUID[Compendium.magnusarchives.type-abilities.Item.f9da7505c94fb306]{Free
    From Danger},
    @UUID[Compendium.magnusarchives.type-abilities.Item.fec936c933269ae3]{Momentum},
    @UUID[Compendium.magnusarchives.type-abilities.Item.923c6299522ed813]{Size
    Them Up},
    @UUID[Compendium.magnusarchives.type-abilities.Item.06aa2d8a473ad3dd]{Snipe},
    @UUID[Compendium.magnusarchives.type-abilities.Item.362821358c439507]{Touch
    the Untouchable}, or from a lower tier. You can also swap one lower-tier
    ability for another from a lower tier.</p></li></ul><h3>Fifth-Tier
    Protector</h3><ul><li><p><strong>Adroit Cypher Use:</strong> You can have 4
    cyphers at a time.</p></li><li><p><strong>Protective Abilities:</strong>
    Choose two of
    @UUID[Compendium.magnusarchives.type-abilities.Item.314ff3aa787303d9]{Arc
    Spray},
    @UUID[Compendium.magnusarchives.type-abilities.Item.966b419e63ef92b8]{Got
    Your Back},
    @UUID[Compendium.magnusarchives.type-abilities.Item.59f2a9498f27fe1b]{Improved
    Success},
    @UUID[Compendium.magnusarchives.type-abilities.Item.ab4cfb81d0df9a73]{Mastery
    With Attacks},
    @UUID[Compendium.magnusarchives.type-abilities.Item.9da04b8239fd4007]{Mastery
    With Defense},
    @UUID[Compendium.magnusarchives.type-abilities.Item.39de8eb11f6a0272]{Parry},
    @UUID[Compendium.magnusarchives.type-abilities.Item.50b59d29b5d25c88]{Shrug
    It Off},
    @UUID[Compendium.magnusarchives.type-abilities.Item.7b4c23949fc845fb]{Savagery},
    or from a lower tier. You can also swap one lower-tier ability for another
    from a lower tier.</p></li></ul><h3>Sixth-Tier
    Protector</h3><ul><li><p><strong>Protective Abilities:</strong> Choose two
    of
    @UUID[Compendium.magnusarchives.type-abilities.Item.a88bd1dd2d0ebdec]{Again
    and Again},
    @UUID[Compendium.magnusarchives.type-abilities.Item.c9b2428e0aafca22]{Beacon
    of Hope},
    @UUID[Compendium.magnusarchives.type-abilities.Item.0d65731d86028403]{Fight
    On},
    @UUID[Compendium.magnusarchives.type-abilities.Item.a4b26360a0fb16b5]{Finishing
    Blow},
    @UUID[Compendium.magnusarchives.type-abilities.Item.a7050823b424a61c]{Spin
    Attack},
    @UUID[Compendium.magnusarchives.type-abilities.Item.7466bf200b7a6ac2]{Self-Sacrifice},
    or from a lower tier. You can also swap one lower-tier ability for another
    from a lower tier.</p></li></ul><p>Abilities marked supernatural need 10
    levels of Stress from supernatural sources first (p27).</p><p><em>Sheet
    notes:</em> Only the Might Edge is applied automatically; set the Speed Edge
    of 1 on the sheet. Cypher limits at higher tiers are raised by hand on the
    sheet.</p>
